<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="/core.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime · ZukaiTemp</title>
<meta name="theme-color" content="#ff4d94">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
.x-top h1{font-size:2rem}.x-top p{color:var(--mut);font-weight:700;font-size:.88rem;margin-bottom:14px}
.x-search{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 16px;border-radius:99px;margin-bottom:12px}
.x-search input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;font:600 .98rem Nunito;min-height:46px;padding:0 4px}
.x-search:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--p1) 18%,transparent)}
#q,#q:focus{border:0!important;box-shadow:none!important;background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:0!important}
.x-search button{border:0;background:none;color:var(--mut);width:36px;height:36px;font-size:1rem}
.x-seg{display:flex;gap:4px;padding:4px;border-radius:20px;margin-bottom:16px}
.x-seg button{flex:1;min-height:42px;border:0;border-radius:16px;background:transparent;color:var(--mut);font:600 .88rem Fredoka;transition:all .3s}
.x-seg button.on{background:linear-gradient(135deg,var(--p1),color-mix(in srgb,var(--p1) 55%,var(--g2)));color:#fff;box-shadow:0 8px 16px -8px var(--p1)}
/* hero */
.x-hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:28px;margin-bottom:10px;box-shadow:var(--sh)}
.x-hero::-webkit-scrollbar{display:none}
.x-slide{flex:none;width:100%;scroll-snap-align:center;position:relative;min-height:236px;padding:20px 18px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;color:#fff;background:#222 center/cover;cursor:pointer}
.x-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,6,20,.92),rgba(10,6,20,.45) 55%,rgba(10,6,20,.15))}
.x-slide>*{position:relative}
.x-slide h2{font:600 1.35rem/1.15 Fredoka;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.x-slide p{font-size:.82rem;font-weight:600;opacity:.88;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.x-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.x-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font:700 .72rem Nunito;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.x-acts{display:flex;gap:8px;margin-top:4px}
.x-btn{border:0;border-radius:99px;min-height:42px;padding:0 20px;font:600 .9rem Fredoka;color:#fff;background:linear-gradient(135deg,var(--p1),var(--g2));box-shadow:0 10px 20px -10px var(--p1)}
.x-btn.o{background:rgba(255,255,255,.2);box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.x-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.x-dots i{width:7px;height:7px;border-radius:99px;background:color-mix(in srgb,var(--p1) 25%,transparent);transition:all .35s}.x-dots i.on{width:22px;background:var(--p1)}
/* genre */
.x-gen{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 20px;padding:0 18px}
.x-gen::-webkit-scrollbar{display:none}
.x-gen button{flex:none;border:0;min-height:38px;padding:0 16px;border-radius:99px;background:var(--w);color:var(--ink);font:600 .84rem Fredoka;box-shadow:var(--sh)}
/* seksi + kartu */
.x-sec{margin-bottom:24px}
.x-sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.x-sh h2{font-size:1.2rem}.x-sh button{border:0;background:none;color:var(--p1);font:700 .82rem Nunito}
.x-car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -18px;padding:2px 18px 8px}
.x-car::-webkit-scrollbar{display:none}
.x-card{flex:none;width:128px;border:0;background:none;text-align:left;color:var(--ink);scroll-snap-align:start;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.x-card:active{transform:scale(.94)}
.x-poster{position:relative;aspect-ratio:2/3;border-radius:20px;background:color-mix(in srgb,var(--p1) 14%,var(--w)) center/cover;box-shadow:0 14px 26px -16px var(--p1);overflow:hidden}
.x-sc{position:absolute;left:8px;top:8px;font:700 .72rem Nunito;font-style:normal;color:#fff;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.x-ep{position:absolute;right:0;bottom:0;font:700 .7rem Nunito;color:#fff;padding:4px 10px;border-radius:14px 0 0 0;background:linear-gradient(135deg,var(--p1),var(--g2))}
.x-card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;font:600 .86rem/1.25 Fredoka}
.x-card span{display:block;margin-top:2px;font:700 .72rem Nunito;color:var(--mut)}
.x-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px}
.x-grid .x-card{width:auto}
.x-back{border:0;border-radius:99px;min-height:40px;padding:0 18px;font:600 .88rem Fredoka;color:var(--p1);background:color-mix(in srgb,var(--p1) 12%,transparent);margin-bottom:14px}
.x-more{display:block;margin:18px auto;min-height:44px;padding:0 24px}
.x-err{padding:20px;border-radius:24px;text-align:center;color:var(--mut);font-weight:700}
.x-err b{display:block;font:600 1rem Fredoka;color:var(--ink);margin-bottom:6px}
/* jadwal */
.x-days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:0 18px}
.x-days::-webkit-scrollbar{display:none}
.x-days button{flex:none;width:56px;min-height:64px;border:0;border-radius:20px;background:var(--w);color:var(--mut);font:600 .78rem Fredoka;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--sh)}
.x-days button b{font-size:1.2rem;color:var(--ink)}
.x-days button.on{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff}.x-days button.on b{color:#fff}
.x-days button.td::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--p1)}.x-days button.on.td::after{background:#fff}
.x-row{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;color:var(--ink);padding:10px 12px;border-radius:22px;margin-bottom:10px}
.x-row .tm{flex:none;width:50px;text-align:center;font:600 1rem Fredoka;color:var(--p1)}
.x-row .ph{flex:none;width:46px;height:64px;border-radius:12px;background:var(--p3) center/cover}
.x-row .tx{flex:1;min-width:0}.x-row .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 .92rem/1.25 Fredoka}
.x-row .tx span{display:block;font:700 .74rem Nunito;color:var(--mut);margin-top:3px}
.x-chip{padding:3px 10px;border-radius:99px;font:700 .7rem Nunito;white-space:nowrap;background:color-mix(in srgb,var(--p1) 14%,transparent);color:var(--p1)}.x-chip.ok{background:rgba(16,185,129,.15);color:#0f9a63}
.x-tg{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:700 .8rem Nunito;color:var(--mut)}
/* detail */
#det{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--p4);transform:translateY(105%);transition:transform .6s cubic-bezier(.22,1,.36,1);padding-bottom:calc(var(--sb) + 30px)}
#det.on{transform:none}
.d-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:color-mix(in srgb,var(--p4) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.d-top button{flex:none;width:44px;height:44px;border:0;border-radius:15px;color:var(--ink);font-size:1.15rem}
.d-top b{flex:1;min-width:0;font:600 1rem Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-top button.on{color:#ff3b5c}
.d-in{padding:0 16px}
.d-pl{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#000;box-shadow:0 24px 44px -24px var(--p1)}
.d-pl iframe,.d-pl #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.d-ph{position:absolute;inset:0;background:#111 center/cover;display:grid;place-items:center}
.d-ph::before{content:"";position:absolute;inset:0;background:rgba(10,6,20,.45)}
.d-big{position:relative;width:76px;height:76px;border:0;border-radius:50%;font-size:1.9rem;color:#fff;background:linear-gradient(135deg,var(--p1),var(--g2));box-shadow:0 14px 30px -8px var(--p1);animation:ztPls 2s ease-in-out infinite}
@keyframes ztPls{50%{transform:scale(1.08)}}
.d-perr{position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:10px;text-align:center;padding:18px;background:rgba(10,6,20,.88);color:#fff;font-weight:700;font-size:.88rem}
.d-perr a{color:#fff;font:600 .9rem Fredoka;background:linear-gradient(135deg,var(--p1),var(--g2));padding:10px 18px;border-radius:99px;text-decoration:none}
.d-now{margin:10px 2px 0;font:700 .8rem Nunito;color:var(--mut)}
.d-h{margin:16px 2px 8px}.d-h h1{font:600 1.35rem/1.2 Fredoka}.d-h p{color:var(--mut);font-weight:700;font-size:.82rem;margin-top:3px}
.d-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.d-chips span{padding:4px 12px;border-radius:99px;font:700 .74rem Nunito;background:color-mix(in srgb,var(--p1) 12%,transparent);color:var(--p1)}
.d-chips span.s{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff}
.d-box{padding:14px;border-radius:22px;margin:14px 0}
.d-box h3{font:600 1rem Fredoka;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.d-box h3 button{border:0;background:none;color:var(--p1);font:700 .78rem Nunito}
.d-box p,.d-box li{font-weight:600;font-size:.88rem;line-height:1.6;color:var(--ink)}
.d-box p.dm{color:var(--mut);font-size:.8rem}
.d-syn{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.d-syn.all{-webkit-line-clamp:unset}
.d-eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;max-height:230px;overflow-y:auto;padding:2px}
.d-eps button{min-height:44px;border:0;border-radius:14px;font:600 .9rem Fredoka;background:color-mix(in srgb,var(--p1) 10%,var(--w));color:var(--ink)}
.d-eps button.on{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff}.d-eps button.w{color:var(--p1);box-shadow:inset 0 0 0 2px var(--p1)}
.d-info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.d-info div{padding:10px 12px;border-radius:16px;background:var(--p4)}.d-info small{display:block;font:700 .68rem Nunito;color:var(--mut)}.d-info b{display:block;font:600 .9rem Fredoka;margin-top:2px}
.d-alt{display:flex;flex-direction:column;gap:8px;margin-top:10px}.d-alt button{border:0;text-align:left;border-radius:14px;padding:10px 12px;font:600 .82rem Nunito;background:var(--p4);color:var(--ink)}
.d-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.d-links a,.d-links button{border:0;text-decoration:none;border-radius:99px;min-height:38px;padding:0 16px;display:inline-flex;align-items:center;font:600 .82rem Fredoka;background:color-mix(in srgb,var(--p1) 12%,transparent);color:var(--p1)}
.empty{text-align:center;padding:30px 10px;color:var(--mut);font-weight:700}.empty i{display:block;font-style:normal;font-size:2.4rem;margin-bottom:8px}
</style>

<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="wrap">
  <header class="x-top hd"><h1>Anime</h1><p>Katalog lengkap, nonton lewat kanal YouTube resmi</p></header>
  <div class="x-search glass"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Cari judul anime…" autocomplete="off" enterkeyhint="search"><button id="qx" hidden aria-label="Hapus">✕</button></div>
  <nav class="x-seg glass" id="seg"><button data-t="home" class="on">Jelajah</button><button data-t="jadwal">Jadwal</button><button data-t="daftar">Daftarku</button></nav>
  <main id="pg"></main>
</div>
<section id="det" data-noswipe aria-label="Detail anime"></section>
<script>
const $=s=>document.querySelector(s),esc=ZT.esc,O=location.origin;
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
/* ---------- AniList + cache ---------- */
const CP='za_c:',hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)};
const cget=k=>{const v=rd(CP+k,null);return v&&v.e>Date.now()?v.d:null};
function cset(k,d,ttl){const put=()=>localStorage.setItem(CP+k,JSON.stringify({e:Date.now()+ttl,d}));try{put()}catch{Object.keys(localStorage).filter(x=>x.startsWith(CP)).slice(0,25).forEach(x=>localStorage.removeItem(x));try{put()}catch{}}}
async function gql(q,v,ttl=20*60e3){
  const k=hs(q+JSON.stringify(v||{})),c=cget(k);if(c)return c;
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({query:q,variables:v||{}})});
  if(r.status===429)throw new Error('AniList sedang membatasi permintaan. Tunggu semenit lalu coba lagi.');
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.errors)throw new Error((j.errors&&j.errors[0]&&j.errors[0].message)||'AniList bermasalah ('+r.status+')');
  cset(k,j.data,ttl);return j.data;
}
const CARD='id title{romaji english} coverImage{large color} averageScore episodes format status genres nextAiringEpisode{episode airingAt}';
const LIST=`query($page:Int,$per:Int,$sort:[MediaSort],$status:MediaStatus,$genre:String,$search:String,$format:MediaFormat,$pop:Int){Page(page:$page,perPage:$per){pageInfo{hasNextPage}media(type:ANIME,isAdult:false,genre_not_in:["Hentai"],sort:$sort,status:$status,genre:$genre,search:$search,format:$format,popularity_greater:$pop){${CARD}}}}`;
const list=(v,ttl)=>gql(LIST,Object.assign({page:1,per:20},v),ttl).then(d=>d.Page);
const HERO=`query{Page(page:1,perPage:8){media(type:ANIME,isAdult:false,sort:TRENDING_DESC,status:RELEASING){id title{romaji english} bannerImage coverImage{extraLarge large color} description(asHtml:false) genres averageScore format episodes}}}`;
const DET=`query($id:Int){Media(id:$id,type:ANIME){${CARD} bannerImage description(asHtml:false) synonyms title{native} duration source isAdult season seasonYear studios(isMain:true){nodes{name}} startDate{year month day} trailer{id site} recommendations(perPage:12,sort:RATING_DESC){nodes{mediaRecommendation{${CARD} isAdult}}}}}`;
const SCH=`query($from:Int,$to:Int,$page:Int){Page(page:$page,perPage:50){pageInfo{hasNextPage}airingSchedules(airingAt_greater:$from,airingAt_lesser:$to,sort:TIME){airingAt episode media{id title{romaji english} coverImage{large} format isAdult popularity countryOfOrigin}}}}`;
const SECS=[
  {k:'new',t:'🆕 Baru rilis',v:{sort:['START_DATE_DESC'],status:'RELEASING',pop:5000}},
  {k:'trend',t:'🔥 Lagi trending',v:{sort:['TRENDING_DESC']}},
  {k:'top',t:'⭐ Top rated',v:{sort:['SCORE_DESC'],pop:40000,format:'TV'}},
  {k:'pop',t:'💖 Terpopuler',v:{sort:['POPULARITY_DESC']}},
  {k:'movie',t:'🎬 Film anime',v:{sort:['POPULARITY_DESC'],format:'MOVIE'}}
];
const GENRES=[['Action','Aksi'],['Adventure','Petualangan'],['Comedy','Komedi'],['Drama','Drama'],['Fantasy','Fantasi'],['Romance','Romantis'],['Sci-Fi','Sci-Fi'],['Slice of Life','Slice of Life'],['Supernatural','Supranatural'],['Sports','Olahraga'],['Mystery','Misteri'],['Horror','Horor'],['Psychological','Psikologis'],['Music','Musik'],['Mecha','Mecha'],['Mahou Shoujo','Mahou Shoujo'],['Thriller','Thriller']];
const FMT={TV:'TV',MOVIE:'Film',OVA:'OVA',ONA:'ONA',SPECIAL:'Spesial',TV_SHORT:'TV Pendek',MUSIC:'Musik'},STAT={FINISHED:'Tamat',RELEASING:'Sedang tayang',NOT_YET_RELEASED:'Belum tayang',CANCELLED:'Dibatalkan',HIATUS:'Hiatus'};
const name=m=>m.title.english||m.title.romaji;
const plain=t=>String(t||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const bgu=u=>u?`background-image:url('${esc(u)}')`:'';
const card=m=>`<button class="x-card" data-open="${m.id}"><div class="x-poster" style="${bgu(m.coverImage&&m.coverImage.large)}">${m.averageScore?`<i class="x-sc">★ ${(m.averageScore/10).toFixed(1)}</i>`:''}${m.nextAiringEpisode&&m.nextAiringEpisode.episode>1?`<i class="x-ep">Ep ${m.nextAiringEpisode.episode-1}</i>`:m.format==='MOVIE'?'<i class="x-ep">Film</i>':''}</div><b>${esc(name(m))}</b><span>${FMT[m.format]||''}${m.episodes?' · '+m.episodes+' eps':''}</span></button>`;
const fail=(e,fn)=>`<div class="x-err glass"><b>Gagal memuat</b>${esc(e.message||e)}<br><button class="x-btn" style="margin-top:12px" data-retry="${fn}">Coba lagi</button></div>`;
/* ---------- tampilan utama ---------- */
let tab='home',LV=null,dsub='fav',heroT=0;
const pg=$('#pg');
function setTab(t){tab=t;LV=null;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function render(){clearInterval(heroT);if(LV)return rListing();if(tab==='jadwal')return rJadwal();if(tab==='daftar')return rDaftar();rHome()}
async function rHome(){
  const lastSeen=Object.values(rd('za_hist',{})).sort((a,b)=>b.ts-a.ts).slice(0,10);
  pg.innerHTML=`<div class="sk" style="height:236px;border-radius:28px;margin-bottom:24px"></div><div class="x-gen">${GENRES.map(g=>`<button data-g="${esc(g[0])}">${g[1]}</button>`).join('')}</div>`
   +(lastSeen.length?`<section class="x-sec"><div class="x-sh"><h2 class="f">▶️ Lanjut menonton</h2></div><div class="x-car">${lastSeen.map(h=>`<button class="x-card" data-open="${h.id}"><div class="x-poster" style="${bgu(h.cover)}"><i class="x-ep">${esc(h.ep||'')}</i></div><b>${esc(h.title)}</b><span>${h.pt>10?'lanjut '+clk(h.pt):'mulai lagi'}</span></button>`).join('')}</div></section>`:'')
   +SECS.map(s=>`<section class="x-sec" id="s-${s.k}"><div class="x-sh"><h2 class="f">${s.t}</h2><button data-all="${s.k}">Lihat semua ›</button></div><div class="x-car">${'<div class="sk" style="flex:none;width:128px;height:210px;border-radius:20px"></div>'.repeat(4)}</div></section>`).join('');
  gql(HERO).then(d=>{const hs=d.Page.media.filter(m=>m.bannerImage||m.coverImage.extraLarge).slice(0,6);if(tab!=='home'||LV||!hs.length)return;
    const el=document.createElement('div');el.innerHTML=`<div class="x-hero" id="hero">${hs.map(m=>`<div class="x-slide" data-open="${m.id}" style="${bgu(m.bannerImage||m.coverImage.extraLarge)}"><div class="x-meta">${m.averageScore?`<span class="x-pill">★ ${(m.averageScore/10).toFixed(1)}</span>`:''}<span class="x-pill">${FMT[m.format]||'Anime'}</span>${(m.genres||[]).slice(0,2).map(g=>`<span class="x-pill">${esc(g)}</span>`).join('')}</div><h2>${esc(name(m))}</h2><p>${esc(plain(m.description).slice(0,160))}</p><div class="x-acts"><button class="x-btn" data-open="${m.id}">▶ Tonton</button></div></div>`).join('')}</div><div class="x-dots" id="dots">${hs.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`;
    const sk=pg.firstElementChild;sk.replaceWith(...el.childNodes);
    const h=$('#hero');if(!h)return;
    h.addEventListener('scroll',()=>{const i=Math.round(h.scrollLeft/h.clientWidth);document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',i===j))},{passive:true});
    let hold=0;h.addEventListener('touchstart',()=>hold=Date.now()+8000,{passive:true});
    heroT=setInterval(()=>{if(document.hidden||Date.now()<hold||$('#det').classList.contains('on'))return;const n=(Math.round(h.scrollLeft/h.clientWidth)+1)%hs.length;h.scrollTo({left:n*h.clientWidth,behavior:'smooth'})},5500);
  }).catch(()=>{});
  SECS.forEach(s=>list(s.v).then(p=>{const car=$('#s-'+s.k+' .x-car');if(car&&tab==='home'&&!LV)car.innerHTML=p.media.map(card).join('')}).catch(e=>{const car=$('#s-'+s.k+' .x-car');if(car)car.innerHTML=`<div class="x-err glass" style="width:100%"><b>Gagal memuat</b>${esc(e.message)}<br><button class="x-btn" style="margin-top:10px" data-retry="home">Coba lagi</button></div>`}));

};

onErr=(e)=>{ oErr(e); setTimeout(autoSw, 1500); };

loadEps=async()=>{
  if(src==='yt') return oLoad();
  $('#epbox').innerHTML='<h3>Episode</h3><div class="sk" style="height:56px"></div>'; fixUI();
  try{
    let r=await fetch('/api/anime?source=animeindo&s='+q2(D.title.romaji||D.title.english));
    let l=(await r.json()); let s=l.data?.data?.[0]?.slug || l.data?.[0]?.slug || l[0]?.slug;
    if(!s) throw 1;
    let r2=await fetch('/api/anime?source=animeindo&slug='+q2(s));
    let d=(await r2.json()); d=d.data?.data||d.data||d;
    let ep=d.episode_lists||d.episodes||[];
    if(!ep.length) throw 1;
    EPS=ep.map((e,i)=>({n:i+1,t:e.title,s:e.slug||e.endpoint}));
    paintEps({ch:'AnimeIndo',title:'Auto-Fallback Aktif'});
  }catch{ autoSw(); }
};

window.playAI=async(i)=>{
  $('#plph').hidden=true; CUR={idx:i,vid:''}; $('#now').textContent='Memuat AnimeIndo...';
  try{
    let r=await fetch('/api/anime?source=animeindo&ep_slug='+q2(EPS[i].s));
    let d=(await r.json()); d=d.data?.data||d.data||d;
    let u=d.stream_url||d.servers?.[0]?.url||d.video_source;
    if(!u) throw 1;
    if(!$('#ai-if')) $('#pl').appendChild(Object.assign(document.createElement('iframe'),{id:'ai-if',style:'position:absolute;inset:0;width:100%;height:100%;border:0'}));
    $('#ai-if').src=u; $('#now').textContent='Ep '+EPS[i].n;
    document.querySelectorAll('#eps button').forEach(b=>b.classList.toggle('on',+b.dataset.ep===i));
  }catch{ autoSw(); }
};

document.addEventListener('click',e=>{
  let x=e.target.closest('[data-s]');
  if(x){src=x.dataset.s; sIdx=srcs.indexOf(src); killPlayer(); if($('#plph'))$('#plph').hidden=false; loadEps();}
  let ep=e.target.closest('[data-ep]'), go=e.target.closest('#plgo');
  if((ep||go)&&src==='ai'){ e.stopPropagation(); playAI(ep?+ep.dataset.ep:0); }
},true);
render();
</script>
</body>
</html>
