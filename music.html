<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
body{padding-bottom:178px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{border:2px solid var(--p3);background:var(--w);color:var(--mut);border-radius:99px;min-height:40px;padding:0 18px;font:600 .9rem Fredoka}
.tab.on{background:var(--p1);border-color:var(--p1);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.tr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--w);cursor:pointer;transition:.15s}
.tr:hover{background:var(--p3)}.tr.cur{outline:2px solid var(--p1)}
.tr img,.art{width:52px;height:52px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--p2),var(--p1));flex:none}
.tr .i{flex:1;min-width:0}.tr b,.tr span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr span{font-size:.82rem;color:var(--mut);font-weight:600}
.tr .d{font-size:.78rem;color:var(--mut);font-weight:700}
.hb{border:0;background:none;font-size:1.3rem;padding:6px;color:var(--p1)}
.empty{text-align:center;color:var(--mut);font-weight:700;padding:36px 10px}
#pl{position:fixed;left:0;right:0;bottom:0;background:var(--w);border-top:2px solid var(--p3);box-shadow:0 -14px 30px -20px rgba(255,77,148,.7);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10}
#pl .in{max-width:760px;margin:0 auto}
.row{display:flex;align-items:center;gap:12px}
.row .i{flex:1;min-width:0}.row b,.row span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{font-size:.8rem;color:var(--mut);font-weight:600}
.ct{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.ct button{border:0;background:none;font-size:1.35rem;width:44px;height:44px;border-radius:50%;color:var(--ink)}
.ct button.main{background:var(--p1);color:#fff;width:52px;height:52px;box-shadow:0 8px 18px -8px var(--p1)}
.ct button.on{color:var(--p1)}
.sk{display:flex;align-items:center;gap:10px;font-size:.75rem;font-weight:700;color:var(--mut)}
input[type=range]{min-height:0;padding:0;border:0;accent-color:var(--p1);height:24px;background:none}
#ly{position:fixed;left:0;right:0;top:0;bottom:178px;background:var(--p4);z-index:9;overflow:auto;padding:20px 22px 40px;text-align:center}
#ly .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#ly p{font:600 1.35rem/1.5 Fredoka;color:var(--mut);margin:12px 0;opacity:.6;transition:.25s}
#ly p.on{color:var(--p1);opacity:1;transform:scale(1.04)}
#ly pre{font:600 1.05rem/1.8 Nunito;white-space:pre-wrap;text-align:center;color:var(--ink)}
dialog{border:0;border-radius:22px;padding:20px;background:var(--w);color:var(--ink);width:min(92vw,360px)}
dialog::backdrop{background:rgba(64,24,45,.5)}
#dB{display:flex;flex-direction:column;gap:8px;margin:14px 0}
</style></head>
<body>
<div class="wrap">
  <div class="hd"><h1>🎵 Musik</h1></div>
  <input id="q" type="search" placeholder="Cari lagu, artis..." aria-label="Cari musik">
  <div class="tabs"><button class="tab on" data-t="home">Jelajah</button><button class="tab" data-t="fav">❤ Favorit</button><button class="tab" data-t="pl">📂 Playlist</button></div>
  <div class="sub" id="ttl" style="margin-bottom:10px"></div>
  <div class="list" id="list"></div>
  <p class="sub" style="text-align:center;margin-top:24px">Sumber musik: Audius (platform musik independen, gratis dan legal).</p>
</div>
<div id="pl"><div class="in">
  <div class="row"><div class="art" id="pArt"></div><div class="i"><b id="pT">Belum ada lagu</b><span id="pA">Cari lalu ketuk lagu untuk memutar</span></div><button class="hb" id="pFav" aria-label="Favorit">♡</button></div>
  <div class="sk"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posisi lagu"><span id="dur">0:00</span></div>
  <div class="ct"><button id="bLy" aria-label="Lirik">🎤</button><button id="bSh" aria-label="Acak">🔀</button><button id="bPv" aria-label="Sebelumnya">⏮</button><button class="main" id="bPl" aria-label="Putar">▶</button><button id="bNx" aria-label="Berikutnya">⏭</button><button id="bRp" aria-label="Ulang">🔁</button></div>
</div></div>
<div id="ly" hidden><div class="h"><b class="f" id="lyT"></b><button class="btn o" id="lyX">Tutup ✕</button></div><div id="lyB"></div></div>
<dialog id="dlg"><h3 id="dT" style="font-size:1.05rem"></h3><div id="dB"></div><button class="btn o" id="dX" style="width:100%">Tutup</button></dialog>
<audio id="au" preload="none"></audio>
<div class="toast" id="toast"></div>
<script src="/dark-sync.js"></script>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const A='https://api.audius.co/v1',APP='ZukaiTemp';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let list=[],queue=[],idx=-1,favs=store.get('zm_fav',[]),pls=store.get('zm_pl',[]),plOpen=null,shuf=false,rep=0,tab='home';
const savePl=()=>store.set('zm_pl',pls);
async function aud(path){
  const r=await fetch(A+path+(path.includes('?')?'&':'?')+'app_name='+APP);
  if(!r.ok)throw new Error('Server musik membalas '+r.status);
  return (await r.json()).data||[];
}
const norm=t=>({id:t.id,title:t.title||'(tanpa judul)',artist:(t.user&&t.user.name)||'',dur:t.duration||0,art:(t.artwork&&(t.artwork['480x480']||t.artwork['150x150']))||'',src:`${A}/tracks/${t.id}/stream?app_name=${APP}`});
const isFav=t=>favs.some(f=>f.id===t.id);
function render(){
  $('#list').innerHTML=list.length?list.map((t,i)=>`<div class="tr ${queue[idx]&&queue[idx].id===t.id?'cur':''}" data-i="${i}" tabindex="0">
    ${t.art?`<img src="${esc(t.art)}" alt="" loading="lazy">`:'<div class="art"></div>'}
    <div class="i"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>
    <div class="d">${fmt(t.dur)}</div><button class="hb" data-f="${i}" aria-label="Favorit">${isFav(t)?'❤':'♡'}</button><button class="hb" data-m="${i}" aria-label="Menu lagu">⋯</button></div>`).join('')
    :`<div class="empty">${tab==='fav'?'Belum ada favorit. Ketuk ♡ di lagu yang kamu suka.':'Tidak ada hasil.'}</div>`;
}
async function load(q){
  tab='home';setTabs();$('#ttl').textContent=q?`Hasil untuk "${q}"`:'Lagi populer minggu ini';
  $('#list').innerHTML='<div class="empty">Memuat...</div>';
  try{list=(await aud(q?`/tracks/search?query=${encodeURIComponent(q)}&limit=30`:'/tracks/trending?time=week&limit=30')).filter(t=>t.id).map(norm)}
  catch(e){list=[];toast('Gagal memuat: '+e.message)}
  render();
}
function setTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function showPls(){
  $('#ttl').textContent='Playlist kamu';
  $('#list').innerHTML=(pls.length?pls.map((p,i)=>`<div class="tr" data-p="${i}" tabindex="0"><div class="art" style="display:grid;place-items:center;font-size:1.5rem">📂</div><div class="i"><b>${esc(p.name)}</b><span>${p.tracks.length} lagu</span></div><button class="hb" data-dp="${i}" aria-label="Hapus playlist">🗑</button></div>`).join(''):'<div class="empty">Belum ada playlist. Ketuk ⋯ di sebuah lagu untuk membuat.</div>');
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  const t=b.dataset.t;plOpen=null;
  if(t==='fav'){tab='fav';setTabs();list=favs.slice();$('#ttl').textContent='Lagu favoritmu';render()}
  else if(t==='pl'){tab='pl';setTabs();showPls()}
  else load($('#q').value.trim());
});
let dt;$('#q').oninput=()=>{clearTimeout(dt);dt=setTimeout(()=>load($('#q').value.trim()),500)};
$('#q').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(dt);load($('#q').value.trim())}};
var play=function(i,fromList){
  if(fromList){queue=list.slice();}
  idx=i;const t=queue[idx];if(!t)return;
  au.src=t.src;au.play().catch(()=>toast('Tidak bisa memutar lagu ini'));
  $('#pT').textContent=t.title;$('#pA').textContent=t.artist;
  $('#pArt').style.background=t.art?`center/cover url("${t.art.replace(/"/g,'')}")`:'';
  $('#pFav').textContent=isFav(t)?'❤':'♡';render();meta(t);
};
function next(auto){
  if(!queue.length)return;
  if(auto&&rep===2)return play(idx);
  let n=shuf?Math.floor(Math.random()*queue.length):idx+1;
  if(n>=queue.length){if(rep===1||!auto)n=0;else{au.pause();return}}
  play(n);
}
const prev=()=>{if(au.currentTime>3)au.currentTime=0;else play(idx>0?idx-1:queue.length-1)};
function meta(t){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:t.art?[{src:t.art,sizes:'480x480',type:'image/jpeg'}]:[]});
  navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause());
  navigator.mediaSession.setActionHandler('nexttrack',()=>next());navigator.mediaSession.setActionHandler('previoustrack',prev);
}
$('#list').onclick=e=>{
  const f=e.target.closest('[data-f]');
  if(f){const t=list[+f.dataset.f];favs=isFav(t)?favs.filter(x=>x.id!==t.id):[t,...favs];store.set('zm_fav',favs);if(tab==='fav'){list=favs.slice()}render();return}
  const m=e.target.closest('[data-m]');if(m){openMenu(list[+m.dataset.m]);return}
  const d=e.target.closest('[data-dp]');if(d){if(confirm('Hapus playlist ini?')){pls.splice(+d.dataset.dp,1);savePl();showPls()}return}
  const p=e.target.closest('[data-p]');if(p){plOpen=+p.dataset.p;list=pls[plOpen].tracks.slice();$('#ttl').textContent='📂 '+pls[plOpen].name+' (ketuk tab Playlist untuk kembali)';render();return}
  const r=e.target.closest('.tr');if(r&&r.dataset.i!=null)play(+r.dataset.i,true);
};
$('#list').onkeydown=e=>{if(e.key==='Enter'){const r=e.target.closest('.tr');if(r&&r.dataset.i!=null)play(+r.dataset.i,true);else if(r&&r.dataset.p!=null)r.click()}};
let mTrack=null;
function openMenu(t){
  mTrack=t;$('#dT').textContent=t.title;
  $('#dB').innerHTML=pls.map((p,i)=>`<button class="btn o" data-add="${i}">📂 ${esc(p.name)}</button>`).join('')+'<button class="btn p" data-new="1">➕ Playlist baru</button>'+(plOpen!=null?'<button class="btn o" data-rm="1">🗑 Hapus dari playlist ini</button>':'');
  $('#dlg').showModal();
}
$('#dB').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.add!=null){const p=pls[+b.dataset.add];if(!p.tracks.some(x=>x.id===mTrack.id))p.tracks.push(mTrack);savePl();toast('Ditambahkan ke '+p.name)}
  else if(b.dataset.new){const n=(prompt('Nama playlist baru:')||'').trim();if(!n)return;pls.push({id:Date.now(),name:n,tracks:[mTrack]});savePl();toast('Playlist dibuat 📂')}
  else if(b.dataset.rm){const p=pls[plOpen];p.tracks=p.tracks.filter(x=>x.id!==mTrack.id);savePl();list=p.tracks.slice();render()}
  $('#dlg').close();
};
$('#dX').onclick=()=>$('#dlg').close();
$('#pFav').onclick=()=>{const t=queue[idx];if(!t)return;favs=isFav(t)?favs.filter(x=>x.id!==t.id):[t,...favs];store.set('zm_fav',favs);$('#pFav').textContent=isFav(t)?'❤':'♡';if(tab==='fav'){list=favs.slice()}render()};
$('#bPl').onclick=()=>{if(!au.src)return toast('Pilih lagu dulu');au.paused?au.play():au.pause()};
$('#bNx').onclick=()=>next();$('#bPv').onclick=prev;
$('#bSh').onclick=()=>{shuf=!shuf;$('#bSh').classList.toggle('on',shuf);toast(shuf?'Acak nyala':'Acak mati')};
$('#bRp').onclick=()=>{rep=(rep+1)%3;$('#bRp').classList.toggle('on',rep>0);$('#bRp').textContent=rep===2?'🔂':'🔁';toast(['Ulang mati','Ulang semua','Ulang satu lagu'][rep])};
au.onplay=()=>$('#bPl').textContent='⏸';au.onpause=()=>$('#bPl').textContent='▶';
au.onended=()=>next(true);
au.onerror=()=>{if(au.src)toast('Lagu gagal dimuat, lanjut ke berikutnya');setTimeout(()=>au.src&&next(true),800)};
au.ontimeupdate=()=>{if(au.duration){$('#seek').value=au.currentTime/au.duration*1000;$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration)}};
$('#seek').oninput=()=>{if(au.duration)au.currentTime=$('#seek').value/1000*au.duration};
/* ---------- Lirik (LRCLIB) ---------- */
let lyr=null,lyIdx=-1,lyFor=null;
async function fetchLyrics(t){
  lyFor=t.id;lyr=null;lyIdx=-1;$('#lyT').textContent=t.title;$('#lyB').innerHTML='<div class="empty">Mencari lirik...</div>';
  try{
    const clean=t.title.replace(/\(.*?\)|\[.*?\]/g,'').trim();
    let a=[];
    for(const q of [new URLSearchParams({track_name:clean,artist_name:t.artist}),new URLSearchParams({q:t.artist+' '+clean})]){
      const r=await fetch('https://lrclib.net/api/search?'+q);if(r.ok)a=await r.json();if(a.length)break;
    }
    const h=a.find(x=>x.syncedLyrics)||a.find(x=>x.plainLyrics);
    if(!h)throw 0;
    if(lyFor!==t.id)return;
    if(h.syncedLyrics){
      lyr=h.syncedLyrics.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);return m?{t:+m[1]*60+ +m[2],s:m[3].trim()}:null}).filter(Boolean);
      $('#lyB').innerHTML=lyr.map((l,i)=>`<p data-i="${i}">${esc(l.s)||'♪'}</p>`).join('');
    }else $('#lyB').innerHTML=`<pre>${esc(h.plainLyrics)}</pre>`;
  }catch{if(lyFor===t.id)$('#lyB').innerHTML='<div class="empty">Lirik tidak ditemukan untuk lagu ini.</div>'}
}
function syncLy(){
  if(!lyr||$('#ly').hidden)return;
  let n=-1;for(let i=0;i<lyr.length;i++){if(lyr[i].t<=au.currentTime+0.2)n=i;else break}
  if(n===lyIdx)return;
  const ps=$('#lyB').children;if(ps[lyIdx])ps[lyIdx].classList.remove('on');
  lyIdx=n;if(ps[n]){ps[n].classList.add('on');ps[n].scrollIntoView({block:'center',behavior:'smooth'})}
}
$('#bLy').onclick=()=>{const t=queue[idx];if(!t)return toast('Putar lagu dulu');$('#ly').hidden=false;if(lyFor!==t.id)fetchLyrics(t)};
$('#lyX').onclick=()=>$('#ly').hidden=true;

/* ---------- Mini-player di aplikasi (shell) ---------- */
function post(){
  if(parent===window)return;const t=queue[idx];
  parent.postMessage({mini:{has:!!t,title:t&&t.title,artist:t&&t.artist,art:t&&t.art,playing:!au.paused}},location.origin);
}
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;const c=e.data.cmd;if(c==='toggle')$('#bPl').click();else if(c==='next')next();else if(c==='prev')prev()});
const _op=au.onplay,_pa=au.onpause;
au.onplay=()=>{_op();post()};au.onpause=()=>{_pa();post()};
const _tu=au.ontimeupdate;au.ontimeupdate=()=>{_tu();syncLy()};
const _pl=play;play=function(i,f){_pl(i,f);post();const t=queue[idx];if(t&&!$('#ly').hidden&&lyFor!==t.id)fetchLyrics(t)};
load('');
</script></body></html>
