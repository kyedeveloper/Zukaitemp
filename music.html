<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musik · ZukaiTemp</title>
<meta name="theme-color" content="#08070c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
body{padding-bottom:150px}
header.top{background:rgba(8,7,12,.97)}
.hrow{padding-top:2px}
.searchbar{display:flex;gap:6px;margin-top:9px}
.searchbar input{flex:1;background:#12101a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:.84rem;font-family:inherit}
.searchbar input:focus{outline:none;border-color:var(--a)}
.searchbar button{width:40px;border-radius:10px;border:1px solid var(--a-soft);background:linear-gradient(120deg,var(--a),#6d28d9);color:#fff;cursor:pointer}
.srcrow{display:flex;gap:5px;margin-top:8px}
.srcrow button{font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim2);cursor:pointer}
.srcrow button.on{background:rgba(168,85,247,.16);border-color:var(--a);color:#e9d5ff}
.tabs{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#0d0b14;margin:12px 0}
.tabs button{flex:1;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:7px 4px;border-radius:8px;border:none;background:none;color:var(--dim2);cursor:pointer}
.tabs button.on{background:rgba(168,85,247,.18);color:#f3e8ff}
h2{font-size:.9rem;margin:16px 0 8px;display:flex;align-items:center;gap:7px}
h2 i{color:var(--a2);font-size:.76rem}
h2 small{margin-left:auto;font-family:var(--mono);font-size:.54rem;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase}
h2 button.playall{margin-left:auto;font-family:var(--mono);font-size:.56rem;padding:4px 9px;border-radius:99px;border:1px solid var(--a-soft);background:rgba(168,85,247,.14);color:#e9d5ff;cursor:pointer}
.trk{display:flex;align-items:center;gap:9px;padding:6px;border-radius:9px;cursor:pointer}
.trk:hover{background:rgba(255,255,255,.045)}
.trk.on{background:rgba(168,85,247,.13)}
.trk .no{width:16px;font-family:var(--mono);font-size:.6rem;color:var(--dim2);text-align:center;flex:none}
.trk .cv{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#1b1728;flex:none}
.trk .m{flex:1;min-width:0}
.trk .m b{display:block;font-size:.81rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .m small{font-size:.68rem;color:var(--dim2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .d{font-family:var(--mono);font-size:.6rem;color:var(--dim2)}
.trk .f{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;font-size:.64rem;flex:none}
.trk .f.on{color:var(--bad);border-color:rgba(251,113,133,.5)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chips button{font-size:.68rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(14,12,20,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 11px calc(8px + env(safe-area-inset-bottom));transform:translateY(130%);transition:transform .4s var(--ease)}
#bar.up{transform:none}
#bar .r{display:flex;align-items:center;gap:9px}
#bar img{width:42px;height:42px;border-radius:6px;object-fit:cover}
#bar .m{flex:1;min-width:0}
#bar .m b{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .m small{font-size:.66rem;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#bar button{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--txt);cursor:pointer;flex:none;font-size:.95rem}
#bar button.main{width:42px;height:42px;background:linear-gradient(120deg,var(--a),#6d28d9);color:#fff}
#seek{width:100%;height:4px;appearance:none;background:#2a2438;border-radius:9px;margin:7px 0 3px;cursor:pointer}
#seek::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:var(--a2)}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.55rem;color:var(--dim2)}
#np{position:fixed;inset:0;z-index:80;background:#08070c;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#np.up{display:flex}
#npBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5);opacity:.32;transform:scale(1.3)}
#np .in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
#np .top{display:flex;gap:9px;align-items:center}
#np .top button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);cursor:pointer}
#np .top span{font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;color:var(--dim2)}
#npCv{width:min(74vw,300px);aspect-ratio:1;border-radius:16px;object-fit:cover;margin:auto;box-shadow:0 24px 60px rgba(0,0,0,.7)}
#np h3{font-size:1.05rem;margin-top:16px}
#np p{color:var(--dim2);font-size:.82rem;margin-bottom:10px}
#np .ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 12px}
#np .ctl button{background:none;border:none;color:var(--txt);font-size:1.05rem;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
#np .ctl button.big{width:62px;height:62px;font-size:1.4rem;background:#fff;color:#000}
#np .ctl button.on{color:var(--a2)}
#np .bot{display:flex;gap:6px;margin-top:auto}
#np .bot button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-size:.68rem;font-family:var(--mono);cursor:pointer}
.badge{font-family:var(--mono);font-size:.5rem;padding:1px 5px;border-radius:4px;border:1px solid rgba(34,211,238,.4);color:var(--a2)}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="hrow">
    <a href="/" class="logo"><span class="mk"><i class="fa-solid fa-wave-square"></i></span><span>ZUKAI MUSIK<small>FULL TRACK · LATAR AMAN</small></span></a>
    <div class="hactions">
      <button class="iconbtn" id="bgBtn" title="Mode latar belakang"><i class="fa-solid fa-moon"></i></button>
      <a class="iconbtn" href="/anime.html"><i class="fa-solid fa-tv"></i></a>
      <a class="iconbtn" href="/"><i class="fa-solid fa-xmark"></i></a>
    </div>
  </div>
  <form class="searchbar" onsubmit="doSearch(event)">
    <input id="q" placeholder="Cari lagu, artis, atau tempel link Spotify…" autocomplete="off">
    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
  </form>
  <div class="srcrow" id="srcrow">
    <button class="on" data-s="yt">YouTube</button>
    <button data-s="spotify">Spotify</button>
  </div>
</div></header>

<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="on" data-t="home">Jelajah</button>
    <button data-t="fav">Favorit</button>
    <button data-t="pl">Playlist</button>
    <button data-t="hist">Riwayat</button>
  </div>
  <div id="view"></div>
</main>

<div id="bar">
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tC">0:00</span><span id="tD">0:00</span></div>
  <div class="r">
    <img id="bCv" src="" alt="">
    <div class="m"><b id="bT">—</b><small id="bA">—</small></div>
    <button onclick="openNp()"><i class="fa-solid fa-chevron-up"></i></button>
    <button class="main" id="bP" onclick="toggle()"><i class="fa-solid fa-play"></i></button>
    <button onclick="next()"><i class="fa-solid fa-forward-step"></i></button>
  </div>
</div>

<div id="np">
  <div id="npBg"></div>
  <div class="in">
    <div class="top"><button onclick="closeNp()"><i class="fa-solid fa-chevron-down"></i></button>
      <span>SEDANG DIPUTAR</span><button style="margin-left:auto" id="npF" onclick="favNow()"><i class="fa-regular fa-heart"></i></button></div>
    <img id="npCv" src="" alt="">
    <h3 id="npT">—</h3><p id="npA">—</p>
    <input type="range" id="seek2" min="0" max="1000" value="0" style="width:100%;height:4px;appearance:none;background:#2a2438;border-radius:9px;margin-bottom:12px">
    <div class="ctl">
      <button id="bS" onclick="shuf()"><i class="fa-solid fa-shuffle"></i></button>
      <button onclick="prev()"><i class="fa-solid fa-backward-step"></i></button>
      <button class="big" id="npP" onclick="toggle()"><i class="fa-solid fa-play"></i></button>
      <button onclick="next()"><i class="fa-solid fa-forward-step"></i></button>
      <button id="bR" onclick="rep()"><i class="fa-solid fa-repeat"></i></button>
    </div>
    <div class="bot"><button onclick="addPl()"><i class="fa-solid fa-plus"></i> Playlist</button>
      <button onclick="shareNow()"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
      <button onclick="dlNow()"><i class="fa-solid fa-download"></i> Unduh</button></div>
  </div>
</div>

<audio id="au" preload="auto" crossorigin="anonymous"></audio>
<iframe id="ytp" style="position:fixed;width:1px;height:1px;left:-9999px" allow="autoplay; encrypted-media"></iframe>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const au = $('#au');
const API = { s:'/api/yt', st:'/api/stream', sp:'/api/spotify' };
const LS = { fav:'zk_fav', pl:'zk_pl', hist:'zk_hist' };
let queue = [], idx = -1, sh = false, rp = 0, src = 'yt', tab = 'home', mode = 'proxy';
let tt; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('up'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('up'),2400); };
const st = { get(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch{ return []; } }, set(k,v){ localStorage.setItem(k,JSON.stringify(v)); } };
const fmt = s => { s = Math.max(0, Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- mesin putar berlapis ---------- */
/* 1) proxy (paling aman, Range jalan)  2) URL langsung  3) embed YT */
const tries = new Map();

async function load(t, autoplay = true){
  const id = t.id;
  const n = tries.get(id) || 0;
  paint(t);
  if (n === 0) {
    au.src = `${API.st}?id=${id}&v=${Date.now()}`;
  } else if (n === 1) {
    try {
      const r = await fetch(`${API.st}?id=${id}&json=1`);
      const j = await r.json();
      if (!j.url) throw new Error('kosong');
      au.src = j.url;
    } catch { return embed(t); }
  } else return embed(t);
  tries.set(id, n);
  if (autoplay) au.play().catch(() => { tries.set(id, 2); embed(t); });
}

function embed(t) {
  mode = 'embed';
  au.pause();
  $('#ytp').src = `https://www.youtube-nocookie.com/embed/${t.id}?autoplay=1&rel=0&playsinline=1&loop=1&playlist=${t.id}`;
  toast('Sumber langsung mati, dialihkan ke pemutar YouTube. Latar belakang nonaktif sementara.');
  paint(t);
}

au.addEventListener('error', () => {
  const t = queue[idx]; if (!t) return;
  const n = (tries.get(t.id) || 0) + 1;
  tries.set(t.id, n);
  if (n <= 2) load(t, true); else embed(t);
});

au.addEventListener('play', () => { $$('#bP i,#npP i').forEach(i => i.className='fa-solid fa-pause'); navigator.mediaSession && (navigator.mediaSession.playbackState='playing'); holdLock(); });
au.addEventListener('pause', () => { $$('#bP i,#npP i').forEach(i => i.className='fa-solid fa-play'); navigator.mediaSession && (navigator.mediaSession.playbackState='paused'); });
au.addEventListener('loadedmetadata', () => $('#tD').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  const p = au.duration ? au.currentTime/au.duration*1000 : 0;
  $('#seek').value = p; $('#seek2').value = p; $('#tC').textContent = fmt(au.currentTime);
});
au.addEventListener('ended', () => rp === 2 ? playAt(idx) : next());
$('#seek').oninput = e => { if (au.duration) au.currentTime = e.target.value/1000*au.duration; };
$('#seek2').oninput = e => { if (au.duration) au.currentTime = e.target.value/1000*au.duration; };

/* wake lock supaya layar tidak tidur saat audio jalan */
let lock = null;
async function holdLock(){
  if (mode === 'embed') return;
  try { lock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !au.paused) holdLock();
});

/* ---------- kontrol ---------- */
function playList(list, i){ queue = list.slice(); idx = sh ? Math.floor(Math.random()*queue.length) : i; playAt(idx); }
function playAt(i){
  if (i < 0 || i >= queue.length) return;
  idx = i; tries.delete(queue[i].id);
  load(queue[i]);
  pushHist(queue[i]); $('#bar').classList.add('up'); paintActive();
}
function toggle(){
  if (mode === 'embed') {
    const u = $('#ytp').src;
    $('#ytp').src = u.includes('autoplay=1') ? u.replace('autoplay=1','autoplay=0') : u.replace('autoplay=0','autoplay=1');
    return;
  }
  if (!queue.length) return toast('Pilih lagu dulu.');
  if (au.paused) au.play().catch(() => embed(queue[idx])); else au.pause();
}
function next(){ if (!queue.length) return; if (rp === 1) return playAt(idx); playAt(sh ? Math.floor(Math.random()*queue.length) : (idx+1)%queue.length); }
function prev(){ if (!queue.length) return; if (au.currentTime > 4) { au.currentTime = 0; return; } playAt((idx-1+queue.length)%queue.length); }
function shuf(){ sh = !sh; $('#bS').classList.toggle('on', sh); toast(sh?'Acak aktif':'Acak mati'); }
function rep(){ rp = (rp+1)%3; $('#bR').classList.toggle('on', rp>0); toast(['Repeat mati','Repeat semua','Repeat satu'][rp]); }

function paint(t){
  $('#bCv').src = t.cover; $('#npCv').src = t.coverBig || t.cover;
  $('#bT').textContent = t.title; $('#npT').textContent = t.title;
  $('#bA').textContent = t.artist; $('#npA').textContent = t.artist;
  $('#npBg').style.backgroundImage = `url(${t.coverBig || t.cover})`;
  document.title = `${t.title} — ${t.artist}`;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist, album:t.album||'ZukaiTemp',
      artwork:[{ src: t.coverBig||t.cover, sizes:'512x512', type:'image/jpeg' }] });
    const h = (k,f) => { try { navigator.mediaSession.setActionHandler(k,f); } catch {} };
    h('play',()=>au.play()); h('pause',()=>au.pause()); h('nexttrack',next); h('previoustrack',prev);
    h('seekto', d => { if (d.seekTime != null) au.currentTime = d.seekTime; });
  }
  paintFav();
}
function openNp(){ if (queue.length) $('#np').classList.add('up'); }
function closeNp(){ $('#np').classList.remove('up'); }

/* ---------- favorit, playlist, riwayat ---------- */
const isFav = id => st.get(LS.fav).some(x => x.id === id);
function toggleFav(t){
  const f = st.get(LS.fav); const i = f.findIndex(x => x.id === t.id);
  if (i > -1) { f.splice(i,1); toast('Dihapus dari favorit'); } else { f.unshift(t); toast('Masuk favorit'); }
  st.set(LS.fav, f.slice(0,300)); paintFav(); if (tab==='fav') render();
}
function paintFav(){
  const t = queue[idx]; const on = t && isFav(t.id);
  $('#npF').innerHTML = `<i class="fa-${on?'solid':'regular'} fa-heart" style="${on?'color:var(--bad)':''}"></i>`;
}
function favNow(){ const t = queue[idx]; if (t) toggleFav(t); }
function pushHist(t){ const h = st.get(LS.hist).filter(x => x.id !== t.id); h.unshift(t); st.set(LS.hist, h.slice(0,60)); }
function addPl(){
  const t = queue[idx]; if (!t) return;
  const n = prompt('Nama playlist:', 'Favorit saya'); if (!n) return;
  const pl = st.get(LS.pl); let p = pl.find(x => x.name === n);
  if (!p) { p = { name:n, tracks:[] }; pl.unshift(p); }
  if (!p.tracks.some(x => x.id === t.id)) p.tracks.unshift(t);
  st.set(LS.pl, pl); toast('Masuk playlist '+n);
}
function shareNow(){
  const t = queue[idx]; if (!t) return;
  const u = `https://youtu.be/${t.id}`;
  navigator.share ? navigator.share({ title:t.title, url:u }).catch(()=>{}) : (navigator.clipboard.writeText(u), toast('Link disalin'));
}
function dlNow(){ const t = queue[idx]; if (t) location.href = `${API.st}?id=${t.id}`; }

/* ---------- render ---------- */
function row(t, list, i){
  const f = isFav(t.id);
  return `<div class="trk ${queue[idx]?.id===t.id?'on':''}" data-i="${i}">
    <span class="no">${i+1}</span><img class="cv" src="${esc(t.cover)}" loading="lazy" alt="">
    <div class="m"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div>
    <span class="d">${fmt(t.duration)}</span>
    <button class="f ${f?'on':''}" data-f="${i}"><i class="fa-${f?'solid':'regular'} fa-heart"></i></button></div>`;
}
function bindList(root, list){
  root.querySelectorAll('.trk').forEach(el => {
    const i = +el.dataset.i;
    el.onclick = e => { if (e.target.closest('[data-f]')) { e.stopPropagation(); toggleFav(list[i]); } else playList(list, i); };
  });
}

async function render(){
  const v = $('#view');
  if (tab === 'fav') {
    const f = st.get(LS.fav);
    v.innerHTML = `<h2><i class="fa-solid fa-heart"></i>Favorit <small>${f.length}</small>${f.length?'<button class="playall" onclick="playList(store0(),0)">Putar</button>':''}</h2>` +
      (f.length ? f.map((t,i)=>row(t,f,i)).join('') : '<div class="empty">Belum ada favorit.</div>');
    if (f.length) { bindList(v, f); v.querySelector('.playall').onclick = () => playList(f, 0); }
    return;
  }
  if (tab === 'hist') {
    const h = st.get(LS.hist);
    v.innerHTML = `<h2><i class="fa-solid fa-clock-rotate-left"></i>Riwayat <small>${h.length}</small></h2>` +
      (h.length ? h.map((t,i)=>row(t,h,i)).join('') : '<div class="empty">Belum ada riwayat.</div>');
    if (h.length) bindList(v, h);
    return;
  }
  if (tab === 'pl') {
    const pl = st.get(LS.pl);
    v.innerHTML = `<h2><i class="fa-solid fa-list"></i>Playlist <small>${pl.length}</small></h2>` +
      (pl.length ? pl.map((p,i)=>`<div class="trk" data-p="${i}"><span class="no">${i+1}</span>
        <div class="cv" style="display:grid;place-items:center;color:var(--a)"><i class="fa-solid fa-list"></i></div>
        <div class="m"><b>${esc(p.name)}</b><small>${p.tracks.length} lagu</small></div>
        <button class="f" data-d="${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('') : '<div class="empty">Belum ada playlist.</div>');
    v.querySelectorAll('[data-p]').forEach(el => el.onclick = e => {
      if (e.target.closest('[data-d]')) { const p = st.get(LS.pl); p.splice(+el.dataset.d,1); st.set(LS.pl,p); render(); return; }
      const p = st.get(LS.pl)[+el.dataset.p]; if (p?.tracks.length) playList(p.tracks, 0);
    });
    return;
  }
  v.innerHTML = '<div class="skel"></div><div class="skel" style="margin-top:8px"></div>';
  const list = await search('musik populer indonesia');
  v.innerHTML = `<div class="chips">${['Lofi chill','Top Indonesia','Hindia','Tulus','Nadin Amizah','Dangdut koplo','Karaoke','JVKE'].map(c=>`<button data-q="${c}">${c}</button>`).join('')}</div>
    <h2><i class="fa-solid fa-fire"></i>Rekomendasi <small>YouTube</small></h2><div id="h"></div>`;
  v.querySelectorAll('.chips [data-q]').forEach(b => b.onclick = () => { $('#q').value = b.dataset.q; doSearch(); });
  const box = $('#h');
  box.innerHTML = list.length ? list.map((t,i)=>row(t,list,i)).join('') : '<div class="empty">Gagal memuat.</div>';
  if (list.length) bindList(box, list);
}
const store0 = () => st.get(LS.fav);

async function search(q){
  try {
    const u = src === 'spotify' ? `${API.sp}?q=${encodeURIComponent(q)}` : `${API.s}?q=${encodeURIComponent(q)}`;
    const j = await (await fetch(u)).json();
    if (j.error) toast(j.error);
    return j.data || [];
  } catch { toast('Pencarian gagal'); return []; }
}
async function doSearch(e){
  if (e) e.preventDefault();
  const q = $('#q').value.trim(); if (!q) return;
  const sp = q.match(/open\.spotify\.com\/(track|playlist|album)\/(\w+)/);
  tab = 'home'; $$('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t==='home'));
  $('#view').innerHTML = '<div class="skel"></div>';
  if (sp) {
    try {
      const j = await (await fetch(`${API.sp}?a=${sp[1]}&id=${sp[2]}`)).json();
      const list = j.data || [];
      $('#view').innerHTML = `<h2><i class="fa-brands fa-spotify"></i>${esc(j.name||'Impor')} <small>${list.length}</small>${list.length?'<button class="playall">Putar</button>':''}</h2><div id="h"></div>`;
      const box = $('#h');
      box.innerHTML = list.length ? list.map((t,i)=>row(t,list,i)).join('') : '<div class="empty">Tidak ada yang cocok.</div>';
      if (list.length) { bindList(box, list); $('#view .playall').onclick = () => playList(list,0); }
    } catch { toast('Impor gagal'); }
    return;
  }
  const list = await search(q);
  $('#view').innerHTML = `<h2><i class="fa-solid fa-magnifying-glass"></i>Hasil "${esc(q)}" <small>${list.length}</small></h2><div id="h"></div>`;
  const box = $('#h');
  box.innerHTML = list.length ? list.map((t,i)=>row(t,list,i)).join('') : '<div class="empty">Tidak ada hasil.</div>';
  if (list.length) bindList(box, list);
}
function paintActive(){ $$('.trk').forEach(el => { const t = queue[idx]; el.classList.toggle('on', !!t && el.querySelector('b')?.textContent === t.title); }); }

/* ---------- init ---------- */
$$('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; $$('#tabs button').forEach(x=>x.classList.toggle('on', x===b)); render(); });
$$('#srcrow button').forEach(b => b.onclick = () => { src = b.dataset.s; $$('#srcrow button').forEach(x=>x.classList.toggle('on', x===b)); });
$('#bgBtn').onclick = () => {
  mode = 'proxy';
  toast('Mode latar belakang: audio diputar lewat proxy, tetap jalan saat layar mati.');
  if (queue[idx] && $('#ytp').src) { $('#ytp').src=''; load(queue[idx], true); }
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
</script>
