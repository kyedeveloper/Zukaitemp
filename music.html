<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musik · ZukaiTemp</title>
<meta name="theme-color" content="#08070c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#08070c;--card:#12101a;--line:#241f33;--txt:#f2eefb;--dim:#9a92b0;--dim2:#6a6280;--a:#a855f7;--a2:#22d3ee;--ok:#34d399;--bad:#fb7185;--mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;overflow-x:hidden;padding-bottom:180px;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--a);border-radius:9px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:linear-gradient(180deg,rgba(8,7,12,.96),rgba(8,7,12,.6) 70%,transparent);padding:10px 0 12px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;font-weight:700}
.logo i{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(140deg,var(--a),#4c1d95);border:1px solid #c084fc;font-size:.85rem;box-shadow:0 0 18px rgba(168,85,247,.45)}
.back{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03)}
.searchbar{display:flex;gap:8px;margin-top:10px}
.searchbar input{flex:1;background:#0e0c16;border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font-size:.85rem;font-family:inherit}
.searchbar input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.searchbar button{width:44px;border-radius:11px;border:1px solid #c084fc;background:linear-gradient(120deg,var(--a),#6d28d9);color:#fff;font-size:.9rem;cursor:pointer}
.srcrow{display:flex;gap:6px;margin-top:9px;overflow:auto;scrollbar-width:none}
.srcrow::-webkit-scrollbar{display:none}
.src{flex:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
.src.on{background:rgba(168,85,247,.16);border-color:var(--a);color:#e9d5ff}

.tabs{display:flex;gap:4px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:12px;background:#0d0b14;margin:14px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;white-space:nowrap;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;border-radius:9px;border:none;background:none;color:var(--dim2);cursor:pointer;transition:.25s}
.tabs button.on{background:rgba(168,85,247,.18);color:#f3e8ff}

h2{font-size:.95rem;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
h2 i{color:var(--a2);font-size:.8rem}
h2 small{margin-left:auto;font-family:var(--mono);font-size:.56rem;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase}

.trk{display:flex;align-items:center;gap:10px;padding:7px;border-radius:11px;transition:.2s;cursor:pointer}
.trk:hover{background:rgba(255,255,255,.05)}
.trk.on{background:rgba(168,85,247,.14)}
.trk .cv{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#1b1728;flex:none}
.trk .meta{flex:1;min-width:0}
.trk .meta b{display:block;font-size:.83rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .meta small{font-size:.7rem;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.trk .dur{font-family:var(--mono);font-size:.63rem;color:var(--dim2)}
.trk .act{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;font-size:.68rem;display:grid;place-items:center;flex:none}
.trk .act:hover{color:var(--a);border-color:var(--a)}
.trk .act.fav{color:var(--bad);border-color:rgba(251,113,133,.5)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:.7rem;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer}
.chip:hover{border-color:var(--a);color:#e9d5ff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.25s}
.art:hover{transform:translateY(-3px);border-color:rgba(168,85,247,.5)}
.art img{width:100%;aspect-ratio:1;object-fit:cover;background:#1b1728;display:block}
.art span{display:block;padding:8px;font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:36px 16px;color:var(--dim2);font-family:var(--mono);font-size:.72rem;border:1px dashed var(--line);border-radius:14px}
.skel{height:56px;border-radius:11px;background:linear-gradient(90deg,#12101a,#1a1626,#12101a);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}

/* PLAYER */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:60;backdrop-filter:blur(22px);background:rgba(14,12,20,.94);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .45s var(--ease)}
#bar.up{transform:none}
#bar .row{display:flex;align-items:center;gap:10px}
#bar img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#1b1728}
#bar .info{flex:1;min-width:0}
#bar .info b{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .info small{font-size:.68rem;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#bar button{width:38px;height:38px;border-radius:50%;border:none;background:none;color:var(--txt);font-size:1rem;cursor:pointer;flex:none;display:grid;place-items:center}
#bar button.main{width:44px;height:44px;background:linear-gradient(120deg,var(--a),#6d28d9);color:#fff;box-shadow:0 0 22px rgba(168,85,247,.5)}
#seek{width:100%;height:4px;appearance:none;background:#2a2438;border-radius:9px;margin:8px 0 4px;cursor:pointer}
#seek::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2)}
#seek::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--a2)}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.58rem;color:var(--dim2)}

/* NOW PLAYING */
#np{position:fixed;inset:0;z-index:80;background:#08070c;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#np.up{display:flex;animation:npIn .4s var(--ease)}
@keyframes npIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#npBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(70px) saturate(1.6);opacity:.35;transform:scale(1.3)}
#np .inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
#np .top{display:flex;align-items:center;gap:10px}
#np .top button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);cursor:pointer}
#np .top span{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
#npCover{width:min(78vw,320px);aspect-ratio:1;border-radius:18px;object-fit:cover;margin:auto;box-shadow:0 30px 70px rgba(0,0,0,.7)}
#np h3{font-size:1.15rem;margin-top:18px}
#np p{color:var(--dim2);font-size:.85rem;margin-bottom:12px}
#np .ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 14px}
#np .ctrl button{background:none;border:none;color:var(--txt);font-size:1.15rem;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
#np .ctrl button.big{width:66px;height:66px;font-size:1.5rem;background:#fff;color:#000}
#np .ctrl button.on{color:var(--a2)}
#np .bottom{display:flex;gap:8px;margin-top:auto}
#np .bottom button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-size:.72rem;font-family:var(--mono);cursor:pointer}
#ytp{position:fixed;width:1px;height:1px;left:-9999px;top:0}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#1a1428;border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-size:.76rem;opacity:0;transition:.3s;z-index:99;pointer-events:none;max-width:88vw;text-align:center}
#toast.up{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="wrap">
  <div class="hrow">
    <a href="/" class="logo"><i class="fa-solid fa-wave-square"></i> ZUKAI MUSIK</a>
    <a href="/" class="back"><i class="fa-solid fa-xmark"></i></a>
  </div>
  <form class="searchbar" onsubmit="doSearch(event)">
    <input id="q" placeholder="Cari lagu, artis, atau tempel link Spotify…" autocomplete="off">
    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
  </form>
  <div class="srcrow" id="srcrow">
    <button class="src on" data-src="yt">YouTube</button>
    <button class="src" data-src="spotify">Spotify</button>
  </div>
</header>

<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="on" data-tab="home">Jelajah</button>
    <button data-tab="fav">Favorit</button>
    <button data-tab="pl">Playlist</button>
    <button data-tab="hist">Riwayat</button>
  </div>
  <div id="view"></div>
</main>

<div id="bar">
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="row">
    <img id="barCv" src="" alt="">
    <div class="info"><b id="barTitle">—</b><small id="barArtist">—</small></div>
    <button onclick="openNp()"><i class="fa-solid fa-chevron-up"></i></button>
    <button class="main" id="barPlay" onclick="toggle()"><i class="fa-solid fa-play"></i></button>
    <button onclick="next()"><i class="fa-solid fa-forward-step"></i></button>
  </div>
</div>

<div id="np">
  <div id="npBg"></div>
  <div class="inner">
    <div class="top">
      <button onclick="closeNp()"><i class="fa-solid fa-chevron-down"></i></button>
      <span>Sedang diputar</span>
      <button style="margin-left:auto" id="npFav" onclick="favNow()"><i class="fa-regular fa-heart"></i></button>
    </div>
    <img id="npCover" src="" alt="">
    <h3 id="npTitle">—</h3>
    <p id="npArtist">—</p>
    <input type="range" id="seek2" min="0" max="1000" value="0" style="width:100%;height:4px;appearance:none;background:#2a2438;border-radius:9px;margin-bottom:14px">
    <div class="ctrl">
      <button id="btnShuf" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
      <button onclick="prev()"><i class="fa-solid fa-backward-step"></i></button>
      <button class="big" id="npPlay" onclick="toggle()"><i class="fa-solid fa-play"></i></button>
      <button onclick="next()"><i class="fa-solid fa-forward-step"></i></button>
      <button id="btnRep" onclick="cycleRepeat()"><i class="fa-solid fa-repeat"></i></button>
    </div>
    <div class="bottom">
      <button onclick="addToPlaylist()"><i class="fa-solid fa-plus"></i> Playlist</button>
      <button onclick="shareNow()"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
      <button onclick="downloadNow()"><i class="fa-solid fa-download"></i> Unduh</button>
    </div>
  </div>
</div>

<audio id="au" preload="none" crossorigin="anonymous"></audio>
<iframe id="ytp" allow="autoplay; encrypted-media"></iframe>
<div id="toast"></div>

<script>
/* ============ util ============ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const au = $('#au');
const API = { search: '/api/yt', stream: '/api/stream', sp: '/api/spotify', dl: '/api/dl' };
const LS = { fav: 'zk_fav', pl: 'zk_pl', hist: 'zk_hist' };

let toastT;
function toast(m) {
  const t = $('#toast');
  t.textContent = m; t.classList.add('up');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('up'), 2400);
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
const fmt = s => {
  s = Math.max(0, Math.round(s || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ============ state ============ */
let queue = [], idx = -1, shuffle = false, repeat = 0, src = 'yt', tab = 'home';
let ytPlayer = null, ytReady = false, usingYt = false;

/* ============ audio ============ */
function loadTrack(t, autoplay = true) {
  usingYt = false;
  au.src = `${API.stream}?id=${encodeURIComponent(t.id)}`;
  if (autoplay) au.play().catch(() => fallbackYt(t));
  paintNp(t);
  mediaSession(t);
}
au.addEventListener('error', () => {
  const t = queue[idx];
  if (t && !usingYt) fallbackYt(t);
});
au.addEventListener('loadedmetadata', () => { $('#tDur').textContent = fmt(au.duration); });
au.addEventListener('timeupdate', () => {
  const p = au.duration ? (au.currentTime / au.duration) * 1000 : 0;
  $('#seek').value = p; $('#seek2').value = p;
  $('#tCur').textContent = fmt(au.currentTime);
});
au.addEventListener('ended', () => repeat === 2 ? playAt(idx) : next());

$('#seek').oninput = e => { if (au.duration) au.currentTime = (e.target.value / 1000) * au.duration; };
$('#seek2').oninput = e => { if (au.duration) au.currentTime = (e.target.value / 1000) * au.duration; };

/* fallback: kalau stream gagal, pakai iframe YouTube biar lagu tetap jalan */
function fallbackYt(t) {
  usingYt = true;
  au.pause();
  $('#ytp').src = `https://www.youtube-nocookie.com/embed/${t.id}?autoplay=1&rel=0&playsinline=1&enablejsapi=1`;
  toast('Stream langsung gagal, dialihkan ke pemutar YouTube.');
}

/* ============ player ============ */
function playList(list, i) {
  queue = list.slice(); idx = i;
  if (shuffle) idx = Math.floor(Math.random() * queue.length);
  playAt(idx);
}
function playAt(i) {
  if (i < 0 || i >= queue.length) return;
  idx = i;
  const t = queue[i];
  loadTrack(t);
  pushHist(t);
  paintActive();
  $('#bar').classList.add('up');
}
function toggle() {
  if (usingYt) { $('#ytp').src = $('#ytp').src.includes('autoplay=1') ? $('#ytp').src.replace('autoplay=1', 'autoplay=0') : $('#ytp').src.replace('autoplay=0', 'autoplay=1'); return; }
  if (!queue.length) return toast('Belum ada lagu dipilih.');
  if (au.paused) au.play().catch(() => fallbackYt(queue[idx]));
  else au.pause();
}
au.addEventListener('play', () => {
  $$('#barPlay i, #npPlay i').forEach(i => i.className = 'fa-solid fa-pause');
  navigator.mediaSession && (navigator.mediaSession.playbackState = 'playing');
});
au.addEventListener('pause', () => {
  $$('#barPlay i, #npPlay i').forEach(i => i.className = 'fa-solid fa-play');
  navigator.mediaSession && (navigator.mediaSession.playbackState = 'paused');
});
function next() {
  if (!queue.length) return;
  if (repeat === 1) return playAt(idx);
  playAt(shuffle ? Math.floor(Math.random() * queue.length) : (idx + 1) % queue.length);
}
function prev() {
  if (!queue.length) return;
  if (au.currentTime > 4) { au.currentTime = 0; return; }
  playAt((idx - 1 + queue.length) % queue.length);
}
function toggleShuffle() { shuffle = !shuffle; $('#btnShuf').classList.toggle('on', shuffle); toast(shuffle ? 'Acak aktif' : 'Acak mati'); }
function cycleRepeat() {
  repeat = (repeat + 1) % 3;
  $('#btnRep').classList.toggle('on', repeat > 0);
  $('#btnRep').innerHTML = repeat === 2 ? '<i class="fa-solid fa-repeat"></i><sup style="font-size:.5rem">1</sup>' : '<i class="fa-solid fa-repeat"></i>';
  toast(['Repeat mati', 'Repeat semua', 'Repeat satu lagu'][repeat]);
}

function paintNp(t) {
  $('#barCv').src = t.cover; $('#npCover').src = t.coverBig || t.cover;
  $('#barTitle').textContent = t.title; $('#npTitle').textContent = t.title;
  $('#barArtist').textContent = t.artist; $('#npArtist').textContent = t.artist;
  $('#npBg').style.backgroundImage = `url(${t.coverBig || t.cover})`;
  document.title = `${t.title} — ${t.artist}`;
  paintFav();
}
function mediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: t.artist, album: t.album || 'ZukaiTemp',
    artwork: [{ src: t.coverBig || t.cover, sizes: '512x512', type: 'image/jpeg' }]
  });
  navigator.mediaSession.setActionHandler('play', () => au.play());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('nexttrack', next);
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}
function openNp() { if (queue.length) $('#np').classList.add('up'); }
function closeNp() { $('#np').classList.remove('up'); }

/* ============ favorit / riwayat / playlist ============ */
function isFav(id) { return store.get(LS.fav).some(x => x.id === id); }
function toggleFav(t) {
  const f = store.get(LS.fav);
  const i = f.findIndex(x => x.id === t.id);
  if (i > -1) { f.splice(i, 1); toast('Dihapus dari favorit'); }
  else { f.unshift(t); toast('Ditambahkan ke favorit'); }
  store.set(LS.fav, f.slice(0, 300));
  paintFav(); paintActive();
  if (tab === 'fav') render();
}
function paintFav() {
  const t = queue[idx];
  const on = t && isFav(t.id);
  $('#npFav').innerHTML = `<i class="fa-${on ? 'solid' : 'regular'} fa-heart" style="${on ? 'color:var(--bad)' : ''}"></i>`;
}
function favNow() { const t = queue[idx]; if (t) toggleFav(t); }
function pushHist(t) {
  const h = store.get(LS.hist).filter(x => x.id !== t.id);
  h.unshift(t); store.set(LS.hist, h.slice(0, 60));
}
function addToPlaylist() {
  const t = queue[idx]; if (!t) return;
  const name = prompt('Nama playlist:', 'Favorit saya');
  if (!name) return;
  const pl = store.get(LS.pl);
  let p = pl.find(x => x.name === name);
  if (!p) { p = { name, tracks: [] }; pl.unshift(p); }
  if (!p.tracks.some(x => x.id === t.id)) p.tracks.unshift(t);
  store.set(LS.pl, pl);
  toast('Masuk playlist ' + name);
}
function shareNow() {
  const t = queue[idx]; if (!t) return;
  const url = `https://youtu.be/${t.id}`;
  if (navigator.share) navigator.share({ title: t.title, url }).catch(() => {});
  else { navigator.clipboard.writeText(url); toast('Link disalin'); }
}
function downloadNow() {
  const t = queue[idx]; if (!t) return;
  window.open(`${API.stream}?id=${t.id}`, '_blank');
}

/* ============ render ============ */
function trackRow(t, list, i) {
  return `<div class="trk ${queue[idx]?.id === t.id ? 'on' : ''}" data-i="${i}">
    <img class="cv" src="${esc(t.cover)}" loading="lazy" alt="">
    <div class="meta"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div>
    <span class="dur">${fmt(t.duration)}</span>
    <button class="act ${isFav(t.id) ? 'fav' : ''}" data-fav="${i}"><i class="fa-${isFav(t.id) ? 'solid' : 'regular'} fa-heart"></i></button>
  </div>`;
}
function bindRows(container, list) {
  container.querySelectorAll('.trk').forEach(el => {
    const i = +el.dataset.i;
    el.onclick = e => {
      if (e.target.closest('[data-fav]')) { e.stopPropagation(); toggleFav(list[i]); return; }
      playList(list, i);
    };
  });
}

async function render() {
  const v = $('#view');
  if (tab === 'fav') {
    const f = store.get(LS.fav);
    v.innerHTML = `<h2><i class="fa-solid fa-heart"></i>Favorit <small>${f.length} lagu</small></h2>` +
      (f.length ? f.map((t, i) => trackRow(t, f, i)).join('') : '<div class="empty">Belum ada favorit. Tekan ikon hati di lagu mana pun.</div>');
    return bindRows(v, f);
  }
  if (tab === 'hist') {
    const h = store.get(LS.hist);
    v.innerHTML = `<h2><i class="fa-solid fa-clock-rotate-left"></i>Riwayat <small>${h.length}</small></h2>` +
      (h.length ? h.map((t, i) => trackRow(t, h, i)).join('') : '<div class="empty">Belum ada riwayat putar.</div>');
    return bindRows(v, h);
  }
  if (tab === 'pl') {
    const pl = store.get(LS.pl);
    v.innerHTML = `<h2><i class="fa-solid fa-list"></i>Playlist <small>${pl.length}</small></h2>` +
      (pl.length ? pl.map((p, i) => `<div class="trk" data-pl="${i}">
        <div class="cv" style="display:grid;place-items:center;color:var(--a)"><i class="fa-solid fa-list"></i></div>
        <div class="meta"><b>${esc(p.name)}</b><small>${p.tracks.length} lagu</small></div>
        <button class="act" data-del="${i}"><i class="fa-solid fa-trash"></i></button>
      </div>`).join('') : '<div class="empty">Belum ada playlist. Buka lagu lalu tekan Playlist di pemutar.</div>');
    v.querySelectorAll('[data-pl]').forEach(el => {
      el.onclick = e => {
        if (e.target.closest('[data-del]')) {
          const pl2 = store.get(LS.pl); pl2.splice(+el.dataset.del, 1); store.set(LS.pl, pl2); render(); return;
        }
        const p = store.get(LS.pl)[+el.dataset.pl];
        if (p?.tracks.length) playList(p.tracks, 0);
      };
    });
    return;
  }
  v.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  v.innerHTML = `<h2><i class="fa-solid fa-fire"></i>Rekomendasi <small>YouTube</small></h2>
    <div class="chips">${['Lofi chill', 'Top Indonesia', 'Hindia', 'Tulus', 'Nadin Amizah', 'JVKE', 'Dangdut koplo', 'Karaoke'].map(c => `<button class="chip" data-q="${c}">${c}</button>`).join('')}</div>
    <div id="homeList"></div>`;
  v.querySelectorAll('.chip').forEach(c => c.onclick = () => { $('#q').value = c.dataset.q; doSearch(); });
  const list = await search('musik populer indonesia 2026');
  const box = $('#homeList');
  box.innerHTML = list.length ? list.map((t, i) => trackRow(t, list, i)).join('') : '<div class="empty">Gagal memuat rekomendasi.</div>';
  bindRows(box, list);
}

async function search(q) {
  try {
    const url = src === 'spotify' ? `${API.sp}?q=${encodeURIComponent(q)}` : `${API.search}?q=${encodeURIComponent(q)}`;
    const r = await fetch(url);
    const j = await r.json();
    if (j.error) toast(j.error);
    return j.data || [];
  } catch { toast('Pencarian gagal'); return []; }
}

async function doSearch(e) {
  if (e) e.preventDefault();
  let q = $('#q').value.trim();
  if (!q) return;
  // tempel link spotify → impor
  const sp = q.match(/open\.spotify\.com\/(track|playlist|album)\/([\w]+)/);
  if (sp) {
    tab = 'home';
    $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'home'));
    $('#view').innerHTML = '<div class="skel"></div><div class="skel"></div>';
    try {
      const r = await fetch(`${API.sp}?a=${sp[1]}&id=${sp[2]}`);
      const j = await r.json();
      const list = j.data || [];
      $('#view').innerHTML = `<h2><i class="fa-brands fa-spotify"></i>${esc(j.name || 'Impor Spotify')} <small>${list.length} lagu</small></h2><div id="imp"></div>`;
      const box = $('#imp');
      box.innerHTML = list.length ? list.map((t, i) => trackRow(t, list, i)).join('') : '<div class="empty">Tidak ada lagu yang bisa dicocokkan ke YouTube.</div>';
      bindRows(box, list);
      toast('Diimpor dari Spotify (diputar via YouTube).');
    } catch { toast('Impor gagal'); }
    return;
  }
  tab = 'home';
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'home'));
  $('#view').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const list = await search(q);
  $('#view').innerHTML = `<h2><i class="fa-solid fa-magnifying-glass"></i>Hasil "${esc(q)}" <small>${list.length}</small></h2><div id="res"></div>`;
  const box = $('#res');
  box.innerHTML = list.length ? list.map((t, i) => trackRow(t, list, i)).join('') : '<div class="empty">Tidak ada hasil.</div>';
  bindRows(box, list);
}

function paintActive() {
  $$('.trk').forEach(el => {
    const t = queue[idx];
    if (t && el.querySelector('b')?.textContent === t.title) el.classList.add('on');
    else el.classList.remove('on');
  });
}

/* ============ init ============ */
$$('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  $$('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$$('.src').forEach(b => b.onclick = () => {
  src = b.dataset.src;
  $$('.src').forEach(x => x.classList.toggle('on', x === b));
  toast(src === 'spotify' ? 'Sumber Spotify (butuh SPOTIFY_ID/SECRET di Vercel)' : 'Sumber YouTube');
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.shiftKey) next();
  if (e.code === 'ArrowLeft' && e.shiftKey) prev();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') paintFav();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
render();
</script>
