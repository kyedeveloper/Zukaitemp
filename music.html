<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="/core.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musik · ZukaiTemp</title>
<meta name="theme-color" content="#ff4d94">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
:root{--sb:env(safe-area-inset-bottom)}
.m-wrap{padding-bottom:220px}
.m-hd h1{font-size:2rem}
.m-hd p{color:var(--mut);font-weight:700;font-size:.88rem;margin-bottom:14px}
.m-search{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 16px;border-radius:99px;margin-bottom:12px}
.m-search input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;font:600 .98rem Nunito;min-height:46px;padding:0 4px;color:var(--ink)}
#q,#q:focus{border:0!important;box-shadow:none!important;background:transparent!important;border-radius:0!important}
.m-search button{border:0;background:none;color:var(--mut);width:36px;height:36px;font-size:1rem}
.m-tabs{display:flex;gap:4px;padding:4px;border-radius:20px;margin-bottom:16px}
.m-tabs button{flex:1;min-height:42px;border:0;border-radius:16px;background:transparent;color:var(--mut);font:600 .88rem Fredoka;transition:all .3s}
.m-tabs button.on{background:linear-gradient(135deg,var(--p1),color-mix(in srgb,var(--p1) 55%,var(--g2)));color:#fff;box-shadow:0 8px 16px -8px var(--p1)}
.m-info{padding:14px 16px;border-radius:20px;margin-bottom:18px;font:600 .8rem/1.5 Nunito;color:var(--mut)}
.m-info b{color:var(--ink);font-weight:600}
.m-track{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:22px;margin-bottom:8px;background:var(--w);transition:transform .2s,box-shadow .2s}
.m-track.on{background:linear-gradient(135deg,color-mix(in srgb,var(--p1) 15%,var(--w)),color-mix(in srgb,var(--g2) 15%,var(--w)));box-shadow:0 8px 20px -12px var(--p1)}
.m-track .th{flex:none;width:52px;height:52px;border:0;border-radius:14px;background:var(--p3) center/cover;position:relative;overflow:hidden;cursor:pointer}
.m-track.on .th::after{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem;color:#fff;background:linear-gradient(135deg,rgba(255,77,148,.75),rgba(200,80,220,.75))}
.m-track .tx{flex:1;min-width:0;cursor:pointer;text-align:left;border:0;background:none;color:var(--ink);padding:0}
.m-track .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 .9rem/1.25 Fredoka;color:var(--ink)}
.m-track .tx span{display:block;font:700 .72rem Nunito;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-track .dur{font:700 .74rem Nunito;color:var(--mut);flex:none}
.m-track .cl{border:0;background:none;color:var(--mut);width:36px;height:36px;font-size:1rem;flex:none;cursor:pointer}
.m-empty{text-align:center;padding:50px 20px;color:var(--mut);font-weight:700}
.m-empty i{display:block;font-style:normal;font-size:2.6rem;margin-bottom:10px}
.m-skel{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:22px;background:var(--w)}
.m-skel .a{width:52px;height:52px;border-radius:14px}
.m-skel .b{flex:1;height:36px;border-radius:10px}
.m-player{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 78px);z-index:40;padding:12px 16px 14px;background:color-mix(in srgb,var(--p4) 88%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid color-mix(in srgb,var(--p1) 22%,transparent);box-shadow:0 -14px 40px -20px rgba(0,0,0,.35);transform:translateY(140%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.m-player.on{transform:none}
.m-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.m-row img{width:48px;height:48px;border-radius:12px;background:var(--p3);object-fit:cover;flex:none}
.m-row .in{flex:1;min-width:0}
.m-row b{display:block;font:600 .92rem/1.2 Fredoka;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row span{display:block;font:700 .72rem Nunito;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.m-row .cl{border:0;background:none;color:var(--mut);width:34px;height:34px;font-size:1rem;flex:none}
.m-bar{position:relative;height:5px;border-radius:99px;background:color-mix(in srgb,var(--p1) 15%,transparent);cursor:pointer;margin-bottom:6px;touch-action:none}
.m-bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--g2));width:0;pointer-events:none}
.m-bar .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}
.m-tm{display:flex;justify-content:space-between;font:700 .68rem Nunito;color:var(--mut);margin-bottom:8px}
.m-ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
.m-ctrl button{border:0;background:none;color:var(--ink);width:44px;height:44px;font-size:1.2rem;border-radius:50%;transition:transform .15s;display:grid;place-items:center;cursor:pointer}
.m-ctrl button:active{transform:scale(.9)}
.m-ctrl button.main{width:56px;height:56px;font-size:1.7rem;color:#fff;background:linear-gradient(135deg,var(--p1),var(--g2));box-shadow:0 10px 26px -10px var(--p1)}
.m-ctrl button.on{color:var(--p1)}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/glass.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="wrap m-wrap">
  <header class="m-hd hd"><h1>Musik</h1><p>Streaming lagu dari YouTube · background play aktif</p></header>
  <div class="m-search glass">
    <span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="Cari lagu, artis…" autocomplete="off" enterkeyhint="search">
    <button id="qx" hidden aria-label="Hapus">✕</button>
  </div>
  <nav class="m-tabs glass" id="tabs">
    <button data-t="home" class="on">Cari</button>
    <button data-t="fav">❤ Favorit</button>
    <button data-t="hist">🕘 Riwayat</button>
  </nav>
  <main id="pg"></main>
</div>

<div class="m-player" id="player">
  <div class="m-row">
    <img id="pth" alt="" referrerpolicy="no-referrer">
    <div class="in"><b id="ptt">–</b><span id="par">–</span></div>
    <button class="cl" id="pcl" aria-label="Tutup">✕</button>
  </div>
  <div class="m-bar" id="pbar"><div class="fill" id="pfl"></div><div class="dot" id="pdt" style="left:0"></div></div>
  <div class="m-tm"><span id="pcu">0:00</span><span id="pdu">0:00</span></div>
  <div class="m-ctrl">
    <button id="prp" aria-label="Ulang">🔁</button>
    <button id="ppv" aria-label="Sebelumnya">⏮</button>
    <button id="ppl" class="main" aria-label="Putar">▶</button>
    <button id="pnx" aria-label="Berikutnya">⏭</button>
    <button id="psh" aria-label="Acak">🔀</button>
  </div>
</div>

<audio id="au" preload="metadata" crossorigin="anonymous"></audio>

<script>
const ZT = window.ZT || { esc: s => String(s ?? ''), toast: m => alert(m) };
const $ = s => document.querySelector(s), esc = ZT.esc;
const toast = m => { try { ZT.toast(m); } catch { console.log(m); } };
const rd = (k,d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const wr = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const fmt = s => { s = Math.floor(s || 0); const m = Math.floor(s/60), c = s%60; return m + ':' + String(c).padStart(2,'0'); };

const MUSIC_API = 'https://zukaitemp.vercel.app/api/play';

let tab = 'home';
let RESULTS = [], FAV = rd('zm_fav', []), HIST = rd('zm_hist', []);
let CUR = { idx: -1, list: [], track: null, repeat: 'none', shuffle: false };
const au = $('#au'), pg = $('#pg'), player = $('#player');

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if (tab === 'home') renderHome();
  else if (tab === 'fav') renderFav();
  else renderHist();
}

function renderHome(){
  if (!RESULTS.length) {
    pg.innerHTML = `<div class="m-info glass">Sumber: <b>YouTube</b> via bot Telegram + Piped + Invidious.<br>Ketik judul lagu di atas untuk mulai. 🎵</div>
      <div class="m-empty"><i>🎧</i>Belum ada pencarian.</div>`;
    return;
  }
  pg.innerHTML = `<div class="m-info glass">${RESULTS.length} hasil ditemukan</div>` +
    RESULTS.map((t,i) => tHTML(t,i,CUR.track && CUR.track.id === t.id, 'home')).join('');
}

function renderFav(){
  if (!FAV.length) { pg.innerHTML = `<div class="m-empty"><i>💝</i>Belum ada favorit.<br>Tekan ❤ di lagu yang kamu suka.</div>`; return; }
  pg.innerHTML = FAV.map((t,i) => tHTML(t,i,CUR.track && CUR.track.id === t.id,'fav')).join('');
}

function renderHist(){
  if (!HIST.length) { pg.innerHTML = `<div class="m-empty"><i>🕘</i>Belum ada riwayat.</div>`; return; }
  pg.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="x-back" id="hclr" style="margin:0;min-height:34px;padding:0 14px;font-size:.78rem">🗑 Hapus riwayat</button></div>` +
    HIST.map((t,i) => tHTML(t,i,CUR.track && CUR.track.id === t.id,'hist')).join('');
}

function tHTML(t, i, isCur, mode){
  const on = isCur ? ' on' : '';
  const thumb = t.thumbnail ? esc(t.thumbnail) : '';
  const dur = t.duration ? `<span class="dur">${fmt(t.duration)}</span>` : '';
  const isFav = FAV.some(x => x.id === t.id);
  return `<div class="m-track${on}">
    <button class="th" data-play="${i}" data-mode="${mode}" style="background-image:url('${thumb}')" aria-label="Putar"></button>
    <button class="tx" data-play="${i}" data-mode="${mode}">
      <b>${esc(t.title)}</b>
      <span>${esc(t.artist || 'YouTube')}</span>
    </button>
    ${dur}
    <button class="cl" data-fav="${i}" data-mode="${mode}" style="${isFav?'color:var(--p1)':''}" aria-label="Favorit">${isFav?'❤':'🤍'}</button>
  </div>`;
}

let qT = 0;
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim();
  $('#qx').hidden = !v;
  clearTimeout(qT);
  qT = setTimeout(() => { if (v.length > 1) doSearch(v); }, 600);
});
$('#qx').onclick = () => { $('#q').value=''; $('#qx').hidden=true; RESULTS=[]; tab='home'; render(); };

async function doSearch(q){
  tab = 'home';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === 'home'));
  pg.innerHTML = Array(5).fill('<div class="m-skel"><div class="a sk"></div><div class="b sk"></div></div>').join('');
  try {
    const r = await fetch(`${MUSIC_API}?a=search&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    if (!j.ok || !j.data?.length) {
      pg.innerHTML = `<div class="m-empty"><i>🔍</i>Tidak ada hasil untuk "${esc(q)}"<br><small>Server mungkin sibuk, coba lagi.</small></div>`;
      return;
    }
    RESULTS = j.data;
    renderHome();
  } catch (e) {
    pg.innerHTML = `<div class="m-empty"><i>⚠️</i>Gagal mencari: ${esc(e.message)}</div>`;
  }
}

async function playTrack(t, list, idx){
  if (!t) return;
  CUR.track = t; CUR.list = list; CUR.idx = idx;
  player.classList.add('on');
  $('#ptt').textContent = t.title;
  $('#par').textContent = t.artist || 'YouTube';
  $('#pth').src = t.thumbnail || '';
  $('#ppl').innerHTML = '<span class="sp"></span>';

  let url = t.url;
  if (!url) {
    url = `${MUSIC_API}?a=stream&id=${encodeURIComponent(t.id)}`;
  }
  au.src = url;
  au.load();
  try {
    await au.play();
    $('#ppl').textContent = '⏸';
  } catch (err) {
    toast('Gagal putar: ' + (err.message || 'coba lagu lain'));
    $('#ppl').textContent = '▶';
    if (!t.url) {
      try { au.src = `${MUSIC_API}?a=stream&id=${encodeURIComponent(t.id)}`; await au.play(); $('#ppl').textContent = '⏸'; } catch {}
    }
  }

  updateMS(t);

  HIST = HIST.filter(x => x.id !== t.id);
  HIST.unshift({ ...t, url: t.url });
  if (HIST.length > 50) HIST = HIST.slice(0, 50);
  wr('zm_hist', HIST);

  document.querySelectorAll('.m-track').forEach(el => el.classList.remove('on'));
  render();
}

function updateMS(t){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title || '',
      artist: t.artist || 'YouTube',
      album: 'Zukai Musik',
      artwork: t.thumbnail ? [
        { src: t.thumbnail, sizes: '512x512', type: 'image/jpeg' },
        { src: t.thumbnail, sizes: '256x256', type: 'image/jpeg' },
      ] : [],
    });
    navigator.mediaSession.setActionHandler('play', () => au.play());
    navigator.mediaSession.setActionHandler('pause', () => au.pause());
    navigator.mediaSession.setActionHandler('previoustrack', playPrev);
    navigator.mediaSession.setActionHandler('nexttrack', playNext);
    navigator.mediaSession.setActionHandler('seekto', d => { if (d.seekTime != null) au.currentTime = d.seekTime; });
  } catch {}
}

function playNext(){
  if (!CUR.list.length) return;
  if (CUR.shuffle) {
    const i = Math.floor(Math.random() * CUR.list.length);
    playTrack(CUR.list[i], CUR.list, i);
  } else {
    const i = (CUR.idx + 1) % CUR.list.length;
    playTrack(CUR.list[i], CUR.list, i);
  }
}
function playPrev(){
  if (!CUR.list.length) return;
  const i = (CUR.idx - 1 + CUR.list.length) % CUR.list.length;
  playTrack(CUR.list[i], CUR.list, i);
}

au.addEventListener('timeupdate', () => {
  const c = au.currentTime, d = au.duration || 0;
  $('#pcu').textContent = fmt(c);
  $('#pdu').textContent = fmt(d);
  const p = d ? (c/d*100) : 0;
  $('#pfl').style.width = p + '%';
  $('#pdt').style.left = p + '%';
});
au.addEventListener('play', () => { $('#ppl').textContent = '⏸'; });
au.addEventListener('pause', () => { $('#ppl').textContent = '▶'; });
au.addEventListener('ended', () => {
  if (CUR.repeat === 'one') { au.currentTime = 0; au.play(); }
  else playNext();
});
au.addEventListener('error', () => {
  toast('Stream gagal, coba lagu lain');
  $('#ppl').textContent = '▶';
});

$('#ppl').onclick = () => { if (!CUR.track) return; au.paused ? au.play() : au.pause(); };
$('#pnx').onclick = playNext;
$('#ppv').onclick = playPrev;
$('#prp').onclick = () => {
  const o = ['none','one','all'];
  CUR.repeat = o[(o.indexOf(CUR.repeat)+1) % 3];
  $('#prp').classList.toggle('on', CUR.repeat !== 'none');
  toast('Ulang: ' + (CUR.repeat === 'one' ? 'Lagu ini' : CUR.repeat === 'all' ? 'Semua' : 'Mati'));
};
$('#psh').onclick = () => {
  CUR.shuffle = !CUR.shuffle;
  $('#psh').classList.toggle('on', CUR.shuffle);
  toast('Acak: ' + (CUR.shuffle ? 'Aktif' : 'Mati'));
};
$('#pcl').onclick = () => {
  au.pause(); au.src = '';
  player.classList.remove('on');
  CUR = { idx: -1, list: [], track: null, repeat: CUR.repeat, shuffle: CUR.shuffle };
};

const bar = $('#pbar');
let dragging = false;
function seek(e){
  const r = bar.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const pct = Math.max(0, Math.min(1, x / r.width));
  if (au.duration) au.currentTime = pct * au.duration;
  $('#pfl').style.width = pct*100 + '%';
  $('#pdt').style.left = pct*100 + '%';
}
bar.addEventListener('click', seek);
bar.addEventListener('touchstart', e => { dragging = true; seek(e); }, {passive:true});
bar.addEventListener('touchmove', e => { if (dragging) seek(e); }, {passive:true});
bar.addEventListener('touchend', () => dragging = false);

pg.addEventListener('click', e => {
  const playBtn = e.target.closest('[data-play]');
  if (playBtn) {
    const i = +playBtn.dataset.play;
    const mode = playBtn.dataset.mode;
    const list = mode === 'fav' ? FAV : mode === 'hist' ? HIST : RESULTS;
    const track = list[i];
    if (track) playTrack(track, list, i);
    return;
  }
  const favBtn = e.target.closest('[data-fav]');
  if (favBtn) {
    const i = +favBtn.dataset.fav;
    const mode = favBtn.dataset.mode;
    const list = mode === 'fav' ? FAV : mode === 'hist' ? HIST : RESULTS;
    const track = list[i];
    if (!track) return;
    if (FAV.some(x => x.id === track.id)) {
      FAV = FAV.filter(x => x.id !== track.id);
      toast('Dihapus dari favorit');
    } else {
      FAV.unshift({ ...track });
      toast('Ditambah ke favorit ❤');
    }
    wr('zm_fav', FAV);
    render();
    return;
  }
  if (e.target.id === 'hclr') { HIST = []; wr('zm_hist', HIST); renderHist(); }
});

document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => { tab = b.dataset.t; render(); };
});

addEventListener('message', e => {
  if (e.data && e.data.animePlay) { try { au.pause(); } catch {} }
});

render();
</script>
</body>
</html>
