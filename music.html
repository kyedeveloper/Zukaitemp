<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="/core.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musik · ZukaiTemp</title>
<meta name="theme-color" content="#ff4d94">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
:root{--sb:env(safe-area-inset-bottom)}
.m-wrap{padding-bottom:220px}
.mh h1{font-size:2.2rem;color:var(--p1);line-height:1.05}
.mh p{color:var(--mut);font-weight:700;margin-top:4px;font-size:.9rem}
.msearch{display:flex;align-items:center;gap:10px;padding:0 18px;height:56px;border-radius:24px;margin-top:18px}
.msearch input{flex:1;min-width:0;border:0!important;background:none!important;box-shadow:none!important;min-height:0;height:100%;padding:0;font:600 1rem Nunito;color:var(--ink)}
.msearch input:focus{outline:none}
.msearch button{border:0;background:none;color:var(--mut);font-size:1.1rem;padding:6px}
.mseg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-radius:22px;padding:5px;margin:16px 0 8px;overflow:hidden}
.mseg button{position:relative;z-index:1;border:0;background:none;height:42px;font:600 .85rem Fredoka;color:var(--mut);transition:color .3s;white-space:nowrap}
.mseg button.on{color:#fff}
.mseg i{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:17px;background:linear-gradient(135deg,var(--p1),var(--g2));transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 20px -10px var(--p1)}
.sec{margin-bottom:22px}
.sec h2{font-size:1.15rem;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2 small{font:700 .74rem Nunito;color:var(--mut)}
.sec h2 button{border:0;background:none;color:var(--p1);font:700 .8rem Nunito;padding:0}
.car{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cd{flex:none;width:150px;scroll-snap-align:start;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1);border:0;background:none;text-align:left;color:var(--ink);padding:0}
.cd:active{transform:scale(.95)}
.cd .im{position:relative;width:150px;height:150px;border-radius:24px;background:var(--p3) center/cover;box-shadow:0 16px 28px -16px color-mix(in srgb,var(--p1) 70%,transparent);overflow:hidden}
.cd .im .rk{position:absolute;left:8px;top:8px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;display:grid;place-items:center;font:700 .76rem Fredoka;font-style:normal;color:#fff;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cd .im .rk.t{background:linear-gradient(135deg,var(--p1),var(--g2))}
.cd b{display:block;margin-top:9px;font:600 .9rem/1.25 Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd span{display:block;margin-top:2px;font:700 .74rem Nunito;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{flex:none;width:110px;scroll-snap-align:start;cursor:pointer;text-align:center;border:0;background:none;color:var(--ink);padding:0}
.ar:active{transform:scale(.95)}
.ar .im{width:110px;height:110px;border-radius:50%;background:var(--p3) center/cover;box-shadow:0 12px 24px -14px color-mix(in srgb,var(--p1) 75%,transparent)}
.ar b{display:block;margin-top:8px;font:600 .86rem Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--w);cursor:pointer;transition:transform .2s;border:0;text-align:left;color:var(--ink);width:100%}
.tr:active{transform:scale(.98)}
.tr.cur{outline:2px solid var(--p1);outline-offset:-2px}
.tr .im{width:52px;height:52px;border-radius:14px;flex:none;background:var(--p3) center/cover}
.tr .i{flex:1;min-width:0}
.tr b{display:block;font:600 .92rem/1.25 Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr span{display:block;font:700 .72rem Nunito;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .d{font:700 .74rem Nunito;color:var(--mut);flex:none}
.tr .fv{border:0;background:none;color:var(--mut);font-size:1.1rem;width:34px;height:34px;flex:none;cursor:pointer;padding:0}
.tr .fv.on{color:var(--p1)}
.empty{text-align:center;padding:44px 20px;color:var(--mut);font-weight:700;line-height:1.7}
.empty i{display:block;font-style:normal;font-size:2.6rem;margin-bottom:8px}
.sk{width:150px;height:150px;border-radius:24px;flex:none;background:linear-gradient(100deg,rgba(255,255,255,.15) 30%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.15) 70%) 0 0/200% 100%;animation:shim 1.3s linear infinite}
.sk-row{height:72px;border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.15) 30%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.15) 70%) 0 0/200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
/* Player mini */
#bar{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 78px);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:8;transform:translateY(180%);transition:transform .5s cubic-bezier(.22,1,.36,1);cursor:pointer;overflow:hidden;background:color-mix(in srgb,var(--p4) 90%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 14px 32px -16px rgba(0,0,0,.4)}
#bar.on{transform:none}
#bar .im{width:46px;height:46px;border-radius:13px;flex:none;background:var(--p3) center/cover}
#bar .i{flex:1;min-width:0}
#bar b{display:block;font:600 .88rem Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar span{display:block;font:700 .72rem Nunito;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#bar button{border:0;background:none;font-size:1.2rem;width:40px;height:40px;border-radius:50%;color:var(--ink);cursor:pointer;padding:0}
#bar button.pl{background:var(--p1);color:#fff;box-shadow:0 8px 16px -8px var(--p1)}
#bar .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--p1);width:var(--w,0%);transition:width .3s linear}
/* Player sheet */
#np{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(20px + var(--sb));background:var(--p4);transform:translateY(105%);transition:transform .6s cubic-bezier(.22,1,.36,1);overflow:hidden}
#np.on{transform:none}
#npBg{position:absolute;inset:-60px;background:center/cover;filter:blur(55px) saturate(1.6);opacity:.55;z-index:0;transform:scale(1.2)}
#np>*:not(#npBg){position:relative;z-index:1}
#np .nt{display:flex;align-items:center;justify-content:space-between;gap:10px}
#np .nt button{border:0;background:none;width:44px;height:44px;border-radius:50%;color:var(--ink);font-size:1.2rem;cursor:pointer;padding:0}
#np .nt .mid{text-align:center;flex:1;min-width:0}
#np .nt .t1{font:600 1rem Fredoka}
#np .nt .t2{font:700 .76rem Nunito;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#np .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#np .art .im{width:max(180px,min(100%,420px,calc(100vh - 430px)));aspect-ratio:1;border-radius:36px;background:var(--p3) center/cover;box-shadow:0 34px 60px -26px color-mix(in srgb,var(--p1) 85%,transparent);transition:transform .5s}
#np .art .im.paused{transform:scale(.88)}
#np .meta h2{font:600 1.45rem/1.2 Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .meta p{color:var(--mut);font-weight:700;font-size:1rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .seekw{margin-top:8px}
#np .seekw .tm{display:flex;justify-content:space-between;font:700 .74rem Nunito;color:var(--mut);margin-top:6px}
#np input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:5px;border-radius:99px;border:0;padding:0;min-height:0;background:linear-gradient(90deg,var(--p1) var(--v,0%),rgba(255,255,255,.35) 0)!important;box-shadow:none!important;cursor:pointer}
#np input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--p1);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#np .ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
#np .ctl button{border:0;background:none;color:var(--ink);width:50px;height:50px;font-size:1.4rem;border-radius:50%;cursor:pointer;padding:0}
#np .ctl button.main{width:64px;height:64px;font-size:1.9rem;color:#fff;background:linear-gradient(135deg,var(--p1),var(--g2));box-shadow:0 12px 26px -10px var(--p1)}
#np .ctl button.on{color:var(--p1)}
#np .ex{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:4px}
#np .ex button{border:0;background:none;color:var(--mut);width:44px;height:44px;font-size:1.1rem;border-radius:50%;cursor:pointer;padding:0}
#np .ex button.on{color:var(--p1)}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;place-items:center;padding:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal.on{display:grid}
.modal .box{background:var(--p4);border-radius:26px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow:auto}
.modal h3{font:600 1.05rem Fredoka;margin-bottom:12px}
.modal .row{padding:10px 12px;border-radius:14px;background:var(--w);margin-bottom:8px;cursor:pointer;font:600 .9rem Fredoka;color:var(--ink);display:flex;gap:10px;align-items:center;border:0;width:100%;text-align:left}
.modal .row.new{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff}
</style>
<link rel="stylesheet" href="/glass.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="wrap m-wrap">
  <header class="mh hd"><h1>Musik</h1><p id="greet">Selamat datang, mau dengar apa?</p></header>
  <label class="msearch glass">
    <span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="Cari lagu, artis, album…" autocomplete="off" enterkeyhint="search">
    <button id="qx" hidden aria-label="Hapus">✕</button>
  </label>
  <nav class="mseg glass" id="seg">
    <i></i>
    <button data-t="home" class="on">Jelajah</button>
    <button data-t="fav">❤ Favorit</button>
    <button data-t="pl">📂 Playlist</button>
    <button data-t="hist">🕘 Riwayat</button>
  </nav>
  <main id="main"></main>
</div>

<div id="bar" class="glass">
  <div class="im" id="bArt"></div>
  <div class="i"><b id="bT">–</b><span id="bA">–</span></div>
  <button id="bPl" class="pl" aria-label="Putar">▶</button>
  <button id="bNx" aria-label="Berikutnya">⏭</button>
  <i class="pg" id="bPg"></i>
</div>

<div id="np" data-noswipe>
  <div id="npBg"></div>
  <div class="nt">
    <button id="npX" aria-label="Tutup">⌄</button>
    <div class="mid"><div class="t1">Sedang Dimainkan</div><div class="t2" id="nCtx"></div></div>
    <button id="npM" aria-label="Menu">⋯</button>
  </div>
  <div class="art"><div class="im" id="nArt"></div></div>
  <div class="meta">
    <h2 id="nT">–</h2>
    <p id="nA">–</p>
  </div>
  <div class="seekw">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="ctl">
    <button id="psh" aria-label="Acak">🔀</button>
    <button id="ppv" aria-label="Sebelumnya">⏮</button>
    <button id="ppl" class="main" aria-label="Putar">▶</button>
    <button id="pnx" aria-label="Berikutnya">⏭</button>
    <button id="prp" aria-label="Ulang">🔁</button>
  </div>
  <div class="ex">
    <button id="nfav" aria-label="Favorit">🤍</button>
    <button id="nq" aria-label="Antrean">📜</button>
    <button id="nsh" aria-label="Bagikan">↗</button>
  </div>
</div>

<div class="modal" id="dlgPl">
  <div class="box">
    <h3>Tambah ke playlist</h3>
    <div id="plList"></div>
    <button class="row new" id="newPl">➕ Playlist baru</button>
    <button class="row" id="closePl" style="justify-content:center">Tutup</button>
  </div>
</div>

<div class="modal" id="dlgQ">
  <div class="box">
    <h3>Antrean (${''})</h3>
    <div id="qList"></div>
    <button class="row" id="closeQ" style="justify-content:center">Tutup</button>
  </div>
</div>

<audio id="au" preload="none" crossorigin="anonymous"></audio>

<script>
const ZT = window.ZT || { esc: s => String(s ?? ''), toast: m => alert(m) };
const $=s=>document.querySelector(s),esc=ZT.esc;
const toast=m=>{try{ZT.toast(m)}catch{console.log(m)}};
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const fmt=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
const qurl=u=>String(u||'').replace(/['"()\\\s<>]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));
const bgu=a=>a?`background-image:url('${qurl(a)}'),linear-gradient(135deg,var(--p2),var(--p1))`:'';
const bg=a=>esc(bgu(a));
const MUSIC_API='/api/music';
const YT_API='/api/yt';
const AUDIO_API='/api/audio';
const INFO_API='/api/info';

let tab='home', qtxt='', results=null, HOME={}, SECS=[], art=null;
let queue=[], idx=-1, shuf=false, rep=0;
let favs=rd('zm_fav',[]), pls=rd('zm_pl',[]), hist=rd('zm_hist',[]);
let plOpen=null;
let useYT=false, loading=false, want=false, seeking=false, curTrack=null;

const au=$('#au'), pg=$('#main');

/* Waktu sapaan */
const hr=new Date().getHours();
$('#greet').textContent=(hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam')+', mau dengar apa hari ini?';

/* Data helpers */
const uid=t=>t.id||t.vid||'';
const same=(a,b)=>a&&b&&uid(a)===uid(b);
const isFav=t=>favs.some(f=>same(f,t));
const saveFav=()=>wr('zm_fav',favs);
const savePl=()=>wr('zm_pl',pls);
const saveHist=()=>wr('zm_hist',hist);

/* Map hasil dari /api/music → format internal */
function mapTrack(d){
  const cover=(d.album&&d.album.cover_big)||(d.album&&d.album.cover_medium)||'';
  return {
    id:d.id,
    vid:d.id,
    title:d.title||'(tanpa judul)',
    artist:(d.artist&&d.artist.name)||'YouTube',
    duration:d.duration||0,
    cover:cover,
    album:(d.album&&d.album.title)||'',
    _views:d._views, _likes:d._likes, _date:d._date,
  };
}

/* Fetch helpers */
async function fetchMusic(params){
  const qs=new URLSearchParams(params).toString();
  const r=await fetch(`${MUSIC_API}?${qs}`);
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j.data||[];
}

/* ---------- Render utama ---------- */
function renderSeg(){
  const i=['home','fav','pl','hist'].indexOf(tab);
  $('#seg').style.setProperty('--i',i);
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}

function trackRow(t,i,mode){
  const curCls=same(curTrack,t)?' cur':'';
  return `<div class="tr${curCls}" data-l="${mode}" data-i="${i}">
    <div class="im" style="${bg(t.cover)}"></div>
    <div class="i"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>
    <div class="d">${t.duration?fmt(t.duration):''}</div>
    <button class="fv ${isFav(t)?'on':''}" data-fav="${i}" data-mode="${mode}">${isFav(t)?'❤':'🤍'}</button>
  </div>`;
}

function rows(list,mode,emptyText){
  if(!list.length) return `<div class="empty"><i>🎧</i>${emptyText||'Belum ada lagu.'}</div>`;
  return `<div class="rows">${list.map((t,i)=>trackRow(t,i,mode)).join('')}</div>`;
}

function card(t,i,mode,rank){
  return `<button class="cd" data-l="${mode}" data-i="${i}">
    <div class="im" style="${bg(t.cover)}">${rank?`<i class="rk ${i<3?'t':''}">${i+1}</i>`:''}</div>
    <b>${esc(t.title)}</b>
    <span>${esc(t.artist)}</span>
  </button>`;
}

function arCard(a,i,mode){
  return `<button class="ar" data-al="${mode}" data-ai="${i}">
    <div class="im" style="${bg(a.img)}"></div>
    <b>${esc(a.name)}</b>
  </button>`;
}

async function render(){
  renderSeg();
  if(art) return renderArtist();
  if(tab==='home' && qtxt) return renderSearch();
  if(tab==='home') return renderHome();
  if(tab==='fav') return renderFav();
  if(tab==='pl') return renderPl();
  if(tab==='hist') return renderHist();
}

function renderHome(){
  const secs=SECS;
  if(!secs.length){
    pg.innerHTML='<div class="empty"><i>⏳</i>Memuat...</div>';
    return;
  }
  pg.innerHTML=secs.map(s=>{
    const a=HOME[s.k];
    let body;
    if(a===undefined){ body=Array(4).fill('<div class="sk"></div>').join(''); }
    else if(!a.length){ body='<div class="empty" style="padding:20px"><i>🤷</i>Belum ada</div>'; }
    else if(s.kind==='artist'){
      body=a.slice(0,12).map((x,i)=>arCard(x,i,s.k)).join('');
    } else {
      body=a.slice(0,20).map((x,i)=>card(x,i,s.k,s.rank)).join('');
    }
    return `<section class="sec"><h2><span>${s.title}</span><small>${s.sub||''}</small></h2><div class="car">${body}</div></section>`;
  }).join('');
}

function renderSearch(){
  if(results===null) return pg.innerHTML='<div class="empty"><i>⏳</i>Mencari…</div>';
  if(!results.length) return pg.innerHTML=`<div class="empty"><i>🔍</i>Tidak ada hasil untuk "${esc(qtxt)}".</div>`;
  pg.innerHTML=`<div class="d" style="margin:8px 0 12px;color:var(--mut);font-weight:700;font-size:.85rem">${results.length} hasil untuk "${esc(qtxt)}"</div>`+rows(results,'res','');
}

function renderFav(){
  pg.innerHTML=`<h2 class="f" style="margin:12px 0">❤ Favorit</h2>`+rows(favs,'fav','Belum ada favorit.');
}

function renderHist(){
  pg.innerHTML=`<h2 class="f" style="margin:12px 0">🕘 Riwayat</h2>`+rows(hist,'hist','Belum ada riwayat tontonan.');
}

function renderPl(){
  if(plOpen!=null && pls[plOpen]){
    const p=pls[plOpen];
    pg.innerHTML=`<button class="x-back" data-backpl style="border:0;border-radius:99px;min-height:40px;padding:0 18px;font:600 .88rem Fredoka;color:var(--p1);background:color-mix(in srgb,var(--p1) 12%,transparent);margin:12px 0">← Semua playlist</button>
      <h2 class="f">📂 ${esc(p.name)}</h2>
      <button data-playpl style="border:0;background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;border-radius:99px;min-height:42px;padding:0 20px;font:600 .9rem Fredoka;margin:12px 0">▶ Putar semua</button>
      ${rows(p.tracks,'plx','Playlist kosong.')}`;
    return;
  }
  if(!pls.length){
    pg.innerHTML=`<h2 class="f" style="margin:12px 0">📂 Playlist</h2><div class="empty"><i>📂</i>Belum ada playlist.</div>
      <button id="newPl2" style="border:0;background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;border-radius:99px;min-height:44px;padding:0 24px;font:600 .9rem Fredoka;display:block;margin:16px auto">➕ Playlist baru</button>`;
    return;
  }
  pg.innerHTML=`<h2 class="f" style="margin:12px 0">📂 Playlist</h2><div class="rows">${pls.map((p,i)=>`
    <button class="tr" data-openpl="${i}">
      <div class="im" style="display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--p1) 15%,var(--w))">📂</div>
      <div class="i"><b>${esc(p.name)}</b><span>${p.tracks.length} lagu</span></div>
    </button>`).join('')}</div>
    <button id="newPl2" style="border:0;background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;border-radius:99px;min-height:44px;padding:0 24px;font:600 .9rem Fredoka;display:block;margin:16px auto">➕ Playlist baru</button>`;
}

async function renderArtist(){
  const a=art.a, tracks=art.tracks;
  let body;
  if(tracks===undefined) body='<div class="empty"><i>⏳</i>Memuat lagu…</div>';
  else if(!tracks.length) body='<div class="empty"><i>🎧</i>Lagu artis ini tidak bisa dimuat.</div>';
  else body=rows(tracks,'art','');
  pg.innerHTML=`<button data-backart style="border:0;border-radius:99px;min-height:40px;padding:0 18px;font:600 .88rem Fredoka;color:var(--p1);background:color-mix(in srgb,var(--p1) 12%,transparent);margin:12px 0">← Kembali</button>
    <div style="display:flex;align-items:center;gap:16px;margin:8px 0 16px">
      <div style="width:88px;height:88px;border-radius:50%;background:var(--p3) center/cover;flex:none;${bgu(a.img).replace('background-image','background')}" class="ar-cover"></div>
      <h2 class="f" style="font-size:1.4rem">${esc(a.name)}</h2>
    </div>
    ${tracks&&tracks.length?'<button data-playart style="border:0;background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;border-radius:99px;min-height:42px;padding:0 22px;font:600 .9rem Fredoka;margin-bottom:14px">▶ Putar semua</button>':''}
    ${body}`;
  // Fix cover background khusus artist
  const cov=pg.querySelector('.ar-cover');
  if(cov) cov.style.cssText=`width:88px;height:88px;border-radius:50%;background:${bgu(a.img).replace('background-image:','')} center/cover;flex:none;`;
}

/* ---------- Load home ---------- */
async function loadHome(){
  SECS=[
    {k:'ytArtists',kind:'artist',title:'🎤 Artis populer',sub:'dari chart'},
    {k:'ytID',rank:1,title:'🇮🇩 Top Indonesia',sub:'chart YouTube'},
    {k:'ytUS',rank:1,title:'🌍 Chart Dunia',sub:'chart YouTube'},
  ];
  SECS.forEach(async s=>{
    try{
      let data;
      if(s.k==='ytArtists') data=(await fetchMusic({kind:'artists'})).map(a=>({id:a.id,name:a.name,img:a.picture_big||'',fans:a.nb_fan||0}));
      else if(s.k==='ytID') data=(await fetchMusic({kind:'chart'})).map(mapTrack);
      else if(s.k==='ytUS') data=(await fetchMusic({kind:'chartGlobal'})).map(mapTrack);
      HOME[s.k]=data;
    }catch(e){
      HOME[s.k]=[];
      console.warn('loadHome',s.k,e.message);
    }
    if(tab==='home'&&!qtxt&&!art) render();
  });
  render();
}

/* ---------- Search ---------- */
let qT=0;
$('#q').addEventListener('input',e=>{
  const v=e.target.value.trim();
  $('#qx').hidden=!v;
  clearTimeout(qT);
  qT=setTimeout(()=>{
    if(v.length>1) doSearch(v);
    else if(!v){ qtxt=''; results=null; art=null; render(); }
  },600);
});
$('#qx').onclick=()=>{ $('#q').value=''; $('#qx').hidden=true; qtxt=''; results=null; art=null; render(); };

async function doSearch(q){
  qtxt=q; art=null; tab='home'; renderSeg();
  pg.innerHTML=Array(4).fill('<div class="sk-row" style="margin-bottom:8px"></div>').join('');
  results=null;
  try{
    const data=await fetchMusic({q});
    if(qtxt!==q) return;
    results=data.map(mapTrack);
  }catch(e){
    results=[];
    toast('Gagal mencari: '+e.message);
  }
  render();
}

async function openArtist(a){
  art={a, tracks:undefined};
  render();
  try{
    const data=await fetchMusic({kind:'top', id:a.id});
    if(art&&art.a.id===a.id) art.tracks=data.map(mapTrack);
  }catch{
    if(art&&art.a.id===a.id) art.tracks=[];
  }
  if(art&&art.a.id===a.id) render();
}
/* ---------- PLAYER ---------- */
function cur(){return queue[idx];}
function setPlayUI(on){
  $('#bPl').textContent=on?'⏸':'▶';
  $('#ppl').innerHTML=on?'⏸':'▶';
  $('#nArt').classList.toggle('paused',!on);
  try{if('mediaSession' in navigator) navigator.mediaSession.playbackState=on?'playing':'paused'}catch{}
}

function syncNp(){
  const t=cur(); if(!t) return;
  $('#bar').classList.add('on');
  $('#bT').textContent=t.title;
  $('#bA').textContent=t.artist;
  $('#bArt').style.cssText=bgu(t.cover)+';width:46px;height:46px;border-radius:13px;flex:none';
  $('#nArt').style.cssText=bgu(t.cover);
  $('#npBg').style.cssText=bgu(t.cover);
  $('#nT').textContent=t.title;
  $('#nA').textContent=t.artist;
  $('#nCtx').textContent='YouTube · lagu utuh';
  $('#nfav').textContent=isFav(t)?'❤':'🤍';
  $('#nfav').classList.toggle('on',isFav(t));
  updateMediaSession(t);
  // Update highlight row
  document.querySelectorAll('.tr').forEach(el=>{
    const mode=el.dataset.l, i=+el.dataset.i;
    const list=mode==='fav'?favs:mode==='hist'?hist:mode==='res'?results:mode==='plx'?(pls[plOpen]&&pls[plOpen].tracks)||[]:mode==='art'?art&&art.tracks||[]:queue;
    if(list[i]&&same(list[i],t)) el.classList.add('cur');
    else el.classList.remove('cur');
  });
}

function updateMediaSession(t){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.title, artist:t.artist, album:'Zukai Musik',
      artwork: t.cover?[{src:t.cover,sizes:'512x512'}]:[]
    });
    navigator.mediaSession.setActionHandler('play',()=>{want=true;loading=false;au.play()});
    navigator.mediaSession.setActionHandler('pause',()=>{want=false;au.pause()});
    navigator.mediaSession.setActionHandler('nexttrack',next);
    navigator.mediaSession.setActionHandler('previoustrack',prev);
    navigator.mediaSession.setActionHandler('seekto',d=>{if(d.seekTime!=null)au.currentTime=d.seekTime});
    navigator.mediaSession.setActionHandler('seekbackward',d=>au.currentTime=Math.max(0,au.currentTime-(d.seekOffset||10)));
    navigator.mediaSession.setActionHandler('seekforward',d=>au.currentTime=Math.min(au.duration||1e9,au.currentTime+(d.seekOffset||10)));
  }catch{}
}

async function play(i,list){
  if(list) queue=list.slice();
  idx=i;
  const t=cur(); if(!t) return;
  curTrack=t;
  syncNp();
  $('#bar').classList.add('on');
  loading=true;
  want=true;
  setPlayUI(true);
  au.pause();
  try{
    // Prioritas: stream audio (background play aman)
    const src=`${AUDIO_API}?id=${encodeURIComponent(t.vid||t.id)}`;
    au.src=src;
    au.load();
    await au.play();
    loading=false;
    // Simpan riwayat
    hist=hist.filter(x=>!same(x,t));
    hist.unshift(t);
    if(hist.length>50) hist=hist.slice(0,50);
    saveHist();
    syncNp();
  }catch(e){
    loading=false;
    setPlayUI(false);
    toast('Gagal memutar: '+e.message);
  }
}

function next(){
  if(!queue.length) return;
  if(rep===2) return play(idx);
  let n=shuf?Math.floor(Math.random()*queue.length):idx+1;
  if(n>=queue.length){ if(rep===1) n=0; else return; }
  play(n);
}

function prev(){
  if(au.currentTime>3){ au.currentTime=0; return; }
  play(idx>0?idx-1:queue.length-1);
}

function tog(){
  if(!curTrack) return toast('Pilih lagu dulu');
  if(au.paused){ want=true; loading=false; au.play(); }
  else { want=false; au.pause(); }
}

au.addEventListener('play',()=>setPlayUI(true));
au.addEventListener('pause',()=>{ if(!loading) setPlayUI(false); });
au.addEventListener('ended',()=>next());
au.addEventListener('error',()=>{ if(!loading){ toast('Stream gagal'); next(); }});
au.addEventListener('timeupdate',()=>{
  const c=au.currentTime, d=au.duration||curTrack&&curTrack.duration||0;
  if(!seeking){
    const p=d?Math.min(100,c/d*100):0;
    $('#seek').value=p*10;
    $('#seek').style.setProperty('--v',p+'%');
    $('#bPg').style.setProperty('--w',p+'%');
    $('#cur').textContent=fmt(c);
    $('#dur').textContent=fmt(d);
  }
});

/* Seek bar */
$('#seek').oninput=()=>{ seeking=true; const d=au.duration; if(d) $('#cur').textContent=fmt($('#seek').value/1000*d); };
$('#seek').onchange=()=>{ const d=au.duration; if(d) au.currentTime=$('#seek').value/1000*d; seeking=false; };

/* Kontrol */
$('#bPl').onclick=e=>{e.stopPropagation();tog()};
$('#ppl').onclick=tog;
$('#bNx').onclick=e=>{e.stopPropagation();next()};
$('#pnx').onclick=next;
$('#ppv').onclick=prev;
$('#prp').onclick=()=>{ rep=(rep+1)%3; $('#prp').classList.toggle('on',rep>0); toast(['Ulang mati','Ulang semua','Ulang satu lagu'][rep]); };
$('#psh').onclick=()=>{ shuf=!shuf; $('#psh').classList.toggle('on',shuf); toast('Acak: '+(shuf?'nyala':'mati')); };
$('#nfav').onclick=()=>{ const t=curTrack; if(!t) return; favs=isFav(t)?favs.filter(x=>!same(x,t)):[t,...favs]; saveFav(); syncNp(); if(tab==='fav') render(); };

/* Bar buka sheet */
$('#bar').onclick=()=>{ $('#np').classList.add('on'); try{parent.postMessage({np:true},location.origin)}catch{} };
$('#npX').onclick=()=>{ $('#np').classList.remove('on'); try{parent.postMessage({np:false},location.origin)}catch{} };
$('#npM').onclick=()=>{ const t=curTrack; if(t) openAddPl(t); };
$('#nq').onclick=()=>{ renderQueue(); $('#dlgQ').classList.add('on'); };
$('#closeQ').onclick=()=>$('#dlgQ').classList.remove('on');
$('#closePl').onclick=()=>$('#dlgPl').classList.remove('on');
$('#nsh').onclick=async()=>{
  const t=curTrack; if(!t) return;
  const url='https://youtu.be/'+t.id;
  const text=t.title+' - '+t.artist;
  try{
    if(navigator.share){ await navigator.share({title:t.title,text,url}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text+' '+url); toast('Tersalin'); }catch{ toast('Tidak bisa bagikan'); }
};

/* Playlist add */
function openAddPl(t){
  const list=$('#plList');
  list.innerHTML=pls.length?pls.map((p,i)=>`<button class="row" data-addpl="${i}">📂 ${esc(p.name)}</button>`).join(''):'<div style="color:var(--mut);font:700 .85rem Nunito;text-align:center;padding:12px 0">Belum ada playlist.</div>';
  $('#dlgPl').classList.add('on');
  $('#dlgPl').dataset.track=JSON.stringify(t);
}
$('#newPl').onclick=()=>{
  const n=(prompt('Nama playlist baru:')||'').trim();
  if(!n) return;
  const t=JSON.parse($('#dlgPl').dataset.track||'{}');
  pls.push({id:Date.now(),name:n,tracks:t.id?[t]:[]});
  savePl();
  $('#dlgPl').classList.remove('on');
  toast('Playlist dibuat 📂');
  if(tab==='pl') render();
};
$('#dlgPl').onclick=e=>{
  const b=e.target.closest('[data-addpl]');
  if(!b) return;
  const i=+b.dataset.addpl;
  const t=JSON.parse($('#dlgPl').dataset.track||'{}');
  if(!t.id) return;
  if(!pls[i].tracks.some(x=>same(x,t))) pls[i].tracks.push(t);
  savePl();
  $('#dlgPl').classList.remove('on');
  toast('Ditambah ke '+pls[i].name);
};

/* Queue modal */
function renderQueue(){
  $('#qList').innerHTML=queue.length?queue.map((t,i)=>`<div class="row ${i===idx?'':''}" data-playq="${i}"><div style="width:36px;height:36px;border-radius:10px;flex:none;background:${bgu(t.cover).replace('background-image:','')} center/cover"></div><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</b><span style="display:block;font:700 .72rem Nunito;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.artist)}</span></div></div>`).join(''):'<div style="color:var(--mut);text-align:center;padding:20px 0">Antrean kosong.</div>';
}
$('#qList').onclick=e=>{
  const r=e.target.closest('[data-playq]');
  if(!r) return;
  play(+r.dataset.playq);
  $('#dlgQ').classList.remove('on');
};

/* ---------- Handler klik di main ---------- */
pg.addEventListener('click',e=>{
  const fav=e.target.closest('[data-fav]');
  if(fav){
    e.stopPropagation();
    const i=+fav.dataset.fav, mode=fav.dataset.mode;
    const list=mode==='fav'?favs:mode==='hist'?hist:mode==='res'?results:mode==='plx'?(pls[plOpen]&&pls[plOpen].tracks)||[]:mode==='art'?art&&art.tracks||[]:queue;
    const t=list[i]; if(!t) return;
    favs=isFav(t)?favs.filter(x=>!same(x,t)):[t,...favs];
    saveFav();
    if(tab==='fav') render(); else if(mode==='res') render(); else if(mode==='plx') renderPl(); else if(mode==='art') renderArtist();
    return;
  }
  const ar=e.target.closest('[data-al]');
  if(ar){
    const mode=ar.dataset.al, i=+ar.dataset.ai;
    const a=(HOME[mode]||[])[i];
    if(a) openArtist(a);
    return;
  }
  const row=e.target.closest('[data-l]');
  if(row){
    const mode=row.dataset.l, i=+row.dataset.i;
    const list=mode==='fav'?favs:mode==='hist'?hist:mode==='res'?results:mode==='plx'?(pls[plOpen]&&pls[plOpen].tracks)||[]:mode==='art'?art&&art.tracks||[]:queue;
    const t=list[i];
    if(t) play(i,list);
    return;
  }
  const c=e.target.closest('.cd[data-l]');
  if(c){
    const mode=c.dataset.l, i=+c.dataset.i;
    const list=HOME[mode]||[];
    const t=list[i];
    if(t) play(i,list);
    return;
  }
  if(e.target.closest('[data-backart]')){ art=null; render(); return; }
  if(e.target.closest('[data-playart]')){ if(art&&art.tracks&&art.tracks.length) play(0,art.tracks); return; }
  if(e.target.closest('[data-backpl]')){ plOpen=null; renderPl(); return; }
  if(e.target.closest('[data-openpl]')){ plOpen=+e.target.closest('[data-openpl]').dataset.openpl; renderPl(); return; }
  if(e.target.closest('[data-playpl]')){ const p=pls[plOpen]; if(p&&p.tracks.length) play(0,p.tracks); return; }
  if(e.target.id==='newPl2'){ const n=(prompt('Nama playlist baru:')||'').trim(); if(n){ pls.push({id:Date.now(),name:n,tracks:[]}); savePl(); renderPl(); } return; }
});

/* Tab */
$('#seg').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');
  if(!b) return;
  tab=b.dataset.t;
  art=null;
  if(tab!=='pl') plOpen=null;
  render();
});

/* ---------- Auto background saat HP dikunci ---------- */
document.addEventListener('visibilitychange',()=>{
  // Tidak perlu apa-apa karena sudah pakai <audio>, tetap jalan di background
  if(document.hidden) return;
  // Sinkron tombol play
  if(curTrack && !loading) setPlayUI(!au.paused);
});

/* ---------- Init ---------- */
render();
loadHome();
</script>
</body>
</html>
