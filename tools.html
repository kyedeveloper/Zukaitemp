<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools · ZukaiTemp</title>
<meta name="theme-color" content="#08070c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
.tool{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:16px;margin-bottom:12px}
.tool h3{font-size:.88rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.tool h3 i{color:var(--a2)}
.out{margin-top:10px;background:#06050a;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px;font-family:var(--mono);font-size:.75rem;color:var(--a2);word-break:break-all;min-height:42px;white-space:pre-wrap}
#qr{background:#fff;padding:12px;border-radius:10px;display:inline-block;margin-top:10px}
</style>
</head>
<body>
<div class="grid-bg"></div>
<header class="top"><div class="wrap hrow">
  <a href="/" class="logo"><span class="mk"><i class="fa-solid fa-toolbox"></i></span><span>TOOLS<small>ZUKAITEMP</small></span></a>
  <div class="hactions"><a class="iconbtn" href="/"><i class="fa-solid fa-xmark"></i></a></div>
</div></header>

<main class="wrap" style="padding-top:24px;max-width:660px">
  <span class="kicker">Alat harian</span>
  <h2 class="sec">Semua diproses di perangkat</h2>
  <p class="sub" style="margin-bottom:20px">Tidak ada data yang dikirim ke server.</p>

  <div class="tool">
    <h3><i class="fa-solid fa-qrcode"></i> Generator QR</h3>
    <input class="inp" id="qrIn" placeholder="Teks atau URL" value="https://zukaitemp.vercel.app">
    <div style="margin-top:10px"><button class="btn p" onclick="mkQr()">Buat QR</button></div>
    <div id="qr"></div>
  </div>

  <div class="tool">
    <h3><i class="fa-solid fa-code"></i> Base64</h3>
    <textarea class="inp" id="b64" rows="3" placeholder="Teks..."></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" onclick="b64run('enc')">Encode</button>
      <button class="btn" onclick="b64run('dec')">Decode</button>
    </div>
    <div class="out" id="b64out">—</div>
  </div>

  <div class="tool">
    <h3><i class="fa-solid fa-brackets-curly"></i> Rapi JSON</h3>
    <textarea class="inp" id="js" rows="4" placeholder='{"a":1}'></textarea>
    <div style="margin-top:10px"><button class="btn" onclick="fmtJson()">Rapikan</button></div>
    <div class="out" id="jsout">—</div>
  </div>

  <div class="tool">
    <h3><i class="fa-solid fa-palette"></i> Warna</h3>
    <input type="color" id="col" value="#a855f7" style="width:60px;height:38px;border:none;background:none">
    <div class="out" id="colout">—</div>
  </div>

  <div class="tool">
    <h3><i class="fa-solid fa-clock"></i> Timestamp</h3>
    <button class="btn" onclick="nowTs()">Sekarang</button>
    <input class="inp" id="tsIn" placeholder="Unix atau ISO, Enter untuk konversi" style="margin-top:10px">
    <div class="out" id="tsout">—</div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('up'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('up'),2000); }

async function mkQr(){
  const v = $('#qrIn').value.trim();
  if (!v) return toast('Isi dulu teksnya.');
  if (!window.QRCode) {
    await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
      s.onload = ok; s.onerror = no; document.head.appendChild(s);
    }).catch(() => toast('Gagal memuat pustaka QR.'));
  }
  $('#qr').innerHTML = '';
  if (window.QRCode) new QRCode($('#qr'), { text: v, width: 180, height: 180 });
}
function b64run(mode){
  const v = $('#b64').value;
  try {
    $('#b64out').textContent = mode === 'enc'
      ? btoa(unescape(encodeURIComponent(v)))
      : decodeURIComponent(escape(atob(v.trim())));
  } catch { $('#b64out').textContent = 'Input tidak valid untuk decode.'; }
}
function fmtJson(){
  try { $('#jsout').textContent = JSON.stringify(JSON.parse($('#js').value), null, 2); }
  catch (e) { $('#jsout').textContent = 'JSON tidak valid: ' + e.message; }
}
$('#col').oninput = e => {
  const h = e.target.value;
  const n = parseInt(h.slice(1), 16);
  $('#colout').textContent = `${h}\nRGB ${(n>>16)&255}, ${(n>>8)&255}, ${n&255}\nHSL ${h}`;
};
function nowTs(){
  const d = new Date();
  $('#tsout').textContent = `Unix ${Math.floor(d.getTime()/1000)}\nISO ${d.toISOString()}\nLokal ${d.toLocaleString('id-ID')}`;
}
$('#tsIn').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  const d = /^\d+$/.test(v) ? new Date(+v * 1000) : new Date(v);
  $('#tsout').textContent = isNaN(d) ? 'Tidak valid.' : `ISO ${d.toISOString()}\nLokal ${d.toLocaleString('id-ID')}`;
});
</script>
</body>
</html>
