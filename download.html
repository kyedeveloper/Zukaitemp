<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Downloader · ZukaiTemp</title>
<meta name="theme-color" content="#08070c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
.box{max-width:620px;margin:0 auto}
.res{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);display:none}
.res.on{display:block;animation:in .4s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.res .top{display:flex;gap:12px;padding:12px}
.res img{width:104px;height:78px;object-fit:cover;border-radius:9px;background:#1b1728}
.res .m{flex:1;min-width:0}
.res h3{font-size:.9rem;margin-bottom:4px}
.res small{color:var(--dim2);font-size:.72rem}
.res .row{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:.58rem;padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim2)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<header class="top"><div class="wrap hrow">
  <a href="/" class="logo"><span class="mk"><i class="fa-solid fa-download"></i></span><span>DOWNLOADER<small>ZUKAITEMP</small></span></a>
  <div class="hactions"><a class="iconbtn" href="/"><i class="fa-solid fa-xmark"></i></a></div>
</div></header>

<main class="wrap" style="padding-top:26px">
  <div class="box">
    <span class="kicker">YouTube</span>
    <h2 class="sec">Tempel link, ambil audionya</h2>
    <p class="sub">Video biasa, Shorts, atau youtu.be semuanya bisa. Hasil berupa tautan langsung dan tautan proxy.</p>

    <form style="display:flex;gap:8px;margin-top:16px" onsubmit="go(event)">
      <input class="inp" id="u" placeholder="https://youtu.be/xxxxxxxxxxx" autocomplete="off">
      <button class="btn p" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>

    <div class="res" id="res"></div>
    <div class="note" style="font-size:.72rem;color:var(--dim2);border-left:2px solid var(--warn);padding-left:9px;margin-top:16px">
      Tautan langsung dari Google berlaku sekitar 6 jam. Untuk disimpan lama, pakai tautan proxy.
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('up'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('up'),2400); }
const idFrom = u => {
  const m = String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(u.trim()) ? u.trim() : null);
};

async function go(e){
  e.preventDefault();
  const id = idFrom($('#u').value);
  if (!id) return toast('Link tidak dikenali.');
  const r = $('#res'); r.classList.remove('on');
  r.classList.add('on'); r.innerHTML = '<div style="padding:14px"><div class="skel"></div></div>';
  try {
    const res = await fetch('/api/dl?id=' + id);
    const j = await res.json();
    if (!res.ok || j.error) throw new Error(j.error || 'gagal');
    r.innerHTML = `<div class="top"><img src="${j.thumb}" alt=""><div class="m">
        <h3>${j.title.replace(/[<>]/g,'')}</h3><small>${j.artist.replace(/[<>]/g,'')}</small>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <span class="tag">${Math.floor(j.seconds/60)}:${String(j.seconds%60).padStart(2,'0')}</span>
          <span class="tag">${j.audio.mime}</span><span class="tag">${Math.round(j.audio.bitrate/1000)}kbps</span>
        </div></div></div>
      <div class="row">
        <a class="btn p" href="/api/stream?id=${id}" download="${j.title.slice(0,40)}.m4a"><i class="fa-solid fa-download"></i> Audio</a>
        <a class="btn" href="${j.yt}" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i> Sumber</a>
        <button class="btn" onclick="navigator.clipboard.writeText('${j.proxy}');toast('Link proxy disalin')"><i class="fa-regular fa-copy"></i> Copy proxy</button>
      </div>`;
  } catch (err) {
    r.innerHTML = `<div style="padding:14px" class="empty">${err.message}</div>`;
  }
}
</script>
</body>
</html>
