<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZukaiTemp</title>
<meta name="description" content="ZukaiTemp: email sementara, musik, downloader, dan banyak tools.">
<meta name="theme-color" content="#ff4d94">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZukaiTemp">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/glass.css">
<style>
html,body{height:100%;overflow:hidden}
#app{position:fixed;inset:0}
#views{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(8%) scale(.96);filter:blur(6px);transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease,filter .45s ease,visibility 0s linear .55s}
iframe.before{transform:translateX(-8%) scale(.96)}
iframe.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease,filter .45s ease,visibility 0s}
#load{position:absolute;left:50%;top:42%;width:46px;height:46px;margin:-23px;border-radius:50%;border:4px solid rgba(255,77,148,.2);border-top-color:var(--p1);animation:sp .8s linear infinite;z-index:3}
@keyframes sp{to{transform:rotate(360deg)}}
#bar{position:absolute;left:14px;right:14px;bottom:calc(10px + var(--sb));height:68px;border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:10;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s}
body.npo #bar,body.npo #mini{transform:translateY(190%);opacity:0;pointer-events:none}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.45));box-shadow:inset 0 1.5px 0 #fff,0 8px 22px -8px rgba(255,77,148,.7);transform:translateX(calc(var(--i,0)*100%));transition:transform .6s cubic-bezier(.34,1.46,.64,1)}
:root[data-dark] #ind{background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.1))}
#bar button{position:relative;z-index:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 .72rem Fredoka;transition:color .3s}
#bar button i{font-style:normal;font-size:1.4rem;line-height:1;transition:transform .5s cubic-bezier(.34,1.8,.64,1)}
#bar button.on{color:var(--p1)}#bar button.on i{transform:translateY(-1px) scale(1.18)}
#bar button:focus-visible{outline:3px solid var(--p1);outline-offset:-3px;border-radius:24px}
#mini{position:absolute;left:14px;right:14px;bottom:var(--navh);border-radius:26px;display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:9;transform:translateY(170%);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}
#mini.on{transform:none;opacity:1}
#mini .a{flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p2),var(--p1)) center/cover}
#mini .i{flex:1;min-width:0;cursor:pointer}#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini b{font-size:.9rem}#mini span{font-size:.76rem;color:var(--mut);font-weight:700}
#mini button{border:0;background:none;font-size:1.25rem;width:42px;height:42px;border-radius:50%;color:var(--ink)}
#mini button.pl{background:var(--p1);color:#fff;box-shadow:0 8px 16px -8px var(--p1)}
#ins{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 8px);z-index:12;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:20px;font:600 .85rem Fredoka;animation:drop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}}
#ins span{flex:1}#ins button{border:0;border-radius:99px;min-height:34px;padding:0 14px;font:600 .82rem Fredoka;background:var(--p1);color:#fff}
#ins button.x{background:none;color:var(--mut);padding:0 8px;font-size:1rem}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(60% 45% at 20% 10%,#ff8fbd,transparent 70%),radial-gradient(55% 45% at 90% 90%,#ffc4e0,transparent 70%),linear-gradient(160deg,#fff5f9,#ffd9e8);transition:opacity .8s ease,transform .9s cubic-bezier(.22,1,.36,1),filter .8s}
:root[data-dark] #splash{background:radial-gradient(60% 45% at 20% 10%,rgba(255,77,148,.4),transparent 70%),radial-gradient(55% 45% at 90% 90%,rgba(140,60,200,.35),transparent 70%),#1f0d18}
#splash.out{opacity:0;transform:scale(1.12);filter:blur(14px);pointer-events:none}
.lgo{position:relative;width:112px;height:112px;display:grid;place-items:center;font-size:3.2rem;border-radius:34px;background:linear-gradient(145deg,var(--p1),var(--p2));box-shadow:0 24px 50px -16px var(--p1),inset 0 2px 0 rgba(255,255,255,.6);animation:pop 1s cubic-bezier(.34,1.56,.64,1) both,fl 3s 1s ease-in-out infinite}
.lgo::before,.lgo::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--p2);animation:ring 2.2s ease-out infinite}
.lgo::after{animation-delay:1.1s}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-20deg)}}
@keyframes fl{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
#splash h1{font-size:2rem;color:var(--p1);animation:rise .8s .2s both}
#splash h1 span{background:linear-gradient(90deg,var(--p1),#ff9ec7,var(--p1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
#spT{font-weight:700;color:var(--mut);font-size:.92rem;min-height:1.4em;animation:rise .8s .35s both}
.pb{width:min(280px,70vw);height:10px;border-radius:99px;padding:2px;animation:rise .8s .45s both}
.pb i{display:block;height:100%;width:4%;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 0 14px var(--p1);transition:width .6s cubic-bezier(.22,1,.36,1)}
#spS{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px;margin-top:6px}
#spS span{padding:7px 14px;border-radius:99px;font:700 .78rem Nunito;color:var(--ink);animation:rise .6s both}
</style>
</head>
<body>
<div id="app">
  <div id="views">
    <iframe id="v-email" title="Email sementara" data-src="/email.html"></iframe>
    <iframe id="v-musik" title="Musik" data-src="/music.html" allow="autoplay; encrypted-media"></iframe>
    <iframe id="v-unduh" title="Downloader" data-src="/download.html"></iframe>
    <iframe id="v-tools" title="Tools" data-src="/tools.html" allow="clipboard-write"></iframe>
    <div id="load" hidden></div>
  </div>
  <div id="ins" class="glass" hidden><span>📲 Pasang ZukaiTemp sebagai aplikasi</span><button id="insGo">Pasang</button><button class="x" id="insX" aria-label="Tutup">✕</button></div>
  <div id="mini" class="glass"><div class="a" id="mArt"></div><div class="i" id="mInfo"><b id="mT"></b><span id="mA"></span></div><button id="mPv" aria-label="Sebelumnya">⏮</button><button class="pl" id="mPl" aria-label="Putar atau jeda">⏸</button><button id="mNx" aria-label="Berikutnya">⏭</button></div>
  <nav id="bar" class="glass" aria-label="Navigasi utama">
    <i id="ind"></i>
    <button data-v="email"><i>📧</i>Email</button>
    <button data-v="musik"><i>🎵</i>Musik</button>
    <button data-v="unduh"><i>⬇️</i>Unduh</button>
    <button data-v="tools"><i>🛠</i>Tools</button>
  </nav>
</div>

<div id="splash">
  <div class="lgo">💌</div>
  <h1 class="f"><span>ZukaiTemp</span></h1>
  <div id="spT">Menyiapkan aplikasi...</div>
  <div class="pb glass"><i id="spB"></i></div>
  <div id="spS"></div>
</div>

<script>
try{if(JSON.parse(localStorage.getItem('zt_dark')))document.documentElement.setAttribute('data-dark','')}catch{}
addEventListener('storage',e=>{if(e.key==='zt_dark'){try{document.documentElement.toggleAttribute('data-dark',!!JSON.parse(e.newValue))}catch{}}});
const $=s=>document.querySelector(s);
const V=['email','musik','unduh','tools'];let curV='email',mini=null;
/* inset layar bawah (iPhone) diteruskan ke semua halaman */
const SB=(()=>{const d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden';document.body.appendChild(d);const v=parseFloat(getComputedStyle(d).paddingBottom)||0;d.remove();return v})();
document.documentElement.style.setProperty('--sb',SB+'px');
let mailStats=null,mailResolve;const mailP=new Promise(r=>mailResolve=r);
document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{
  f.dataset.r='1';try{f.contentDocument.documentElement.style.setProperty('--sb',SB+'px')}catch{}
  if('v-'+curV===f.id)$('#load').hidden=true;
}));
const syncMini=()=>$('#mini').classList.toggle('on',!!(mini&&mini.has&&curV!=='musik'));
const cmd=c=>{const f=$('#v-musik');f.contentWindow&&f.contentWindow.postMessage({cmd:c},location.origin)};
function go(v){
  if(!V.includes(v))v='email';
  const n=V.indexOf(v);curV=v;
  V.forEach((k,i)=>{const f=$('#v-'+k);if(k===v&&!f.src)f.src=f.dataset.src;f.classList.toggle('on',k===v);f.classList.toggle('before',i<n)});
  document.querySelectorAll('#bar [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#bar').style.setProperty('--i',n);
  $('#load').hidden=$('#v-'+v).dataset.r==='1';
  syncMini();
  if(v!=='musik'&&document.body.classList.contains('npo'))cmd('closeNp');
  if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);
}
document.querySelectorAll('#bar [data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data)return;
  if(e.data.go)go(e.data.go);
  if('np' in e.data)document.body.classList.toggle('npo',!!e.data.np);
  if(e.data.stats){mailStats=e.data.stats;mailResolve(mailStats)}
  if(e.data.mini){mini=e.data.mini;$('#mT').textContent=mini.title||'';$('#mA').textContent=mini.artist||'';$('#mArt').style.backgroundImage=mini.art?`url("${String(mini.art).replace(/"/g,'')}")`:'';$('#mPl').textContent=mini.playing?'⏸':'▶';syncMini()}
});
$('#mPl').onclick=()=>cmd('toggle');$('#mNx').onclick=()=>cmd('next');$('#mPv').onclick=()=>cmd('prev');$('#mInfo').onclick=()=>go('musik');
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'email');

/* ---- tombol pasang aplikasi ---- */
let defer=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const showIns=()=>{let x=false;try{x=localStorage.getItem('zt_ins_x')}catch{}if(!standalone&&!x)$('#ins').hidden=false};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();defer=e;showIns()});
if(/iphone|ipad|ipod/i.test(navigator.userAgent))showIns();
$('#insGo').onclick=async()=>{if(defer){defer.prompt();await defer.userChoice;defer=null;$('#ins').hidden=true}else alert('Di iPhone: ketuk tombol Bagikan, lalu pilih "Tambah ke Layar Utama"')};
$('#insX').onclick=()=>{$('#ins').hidden=true;try{localStorage.setItem('zt_ins_x','1')}catch{}};
addEventListener('appinstalled',()=>{$('#ins').hidden=true});

/* ---- layar pembuka: semua angka diukur sungguhan, bukan karangan ---- */
(async()=>{
  const t0=performance.now(),B=$('#spB'),T=$('#spT'),S=$('#spS');
  const prog=(p,txt)=>{B.style.width=p+'%';if(txt)T.textContent=txt};
  const chip=(id,txt)=>{let e=document.getElementById(id);if(!e){e=document.createElement('span');e.id=id;e.className='glass';S.appendChild(e)}e.textContent=txt};
  prog(10,'Memeriksa koneksi...');
  const c=navigator.connection,eff=c&&c.effectiveType;
  chip('c1',navigator.onLine?'🌐 Online'+(eff?' · '+eff.toUpperCase():''):'📴 Offline');
  const ts=[];
  for(let i=0;i<3;i++){const s=performance.now();try{await fetch('/icon-192.png?_='+Math.random(),{cache:'no-store'});ts.push(performance.now()-s)}catch{}}
  if(ts.length){ts.sort((a,b)=>a-b);chip('c2','⚡ Ping '+Math.round(ts[ts.length>>1])+' ms')}
  prog(35,'Memuat email sementara...');
  const f=$('#v-email'),loaded=new Promise(r=>{if(f.dataset.r==='1')r();else f.addEventListener('load',r,{once:true})});
  await Promise.race([loaded,new Promise(r=>setTimeout(r,6000))]);
  prog(65,'Mengecek server email...');chip('c3','📬 Mengecek server...');
  const st=await Promise.race([mailP,new Promise(r=>setTimeout(()=>r(null),6000))]);
  if(st){chip('c3',`📬 Server email ${st.ok}/${st.total} aktif`);chip('c4','🔗 '+st.domains+' domain tersedia')}
  else chip('c3','📬 Server email: belum merespons');
  prog(100,st?'Siap digunakan!':'Siap (server email sedang lambat)');
  await new Promise(r=>setTimeout(r,Math.max(900,2200-(performance.now()-t0))));
  $('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),950);
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
