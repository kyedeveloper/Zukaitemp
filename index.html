<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="/core.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZukaiTemp</title>
<meta name="description" content="ZukaiTemp: email sementara, musik, downloader, dan banyak tools.">
<meta name="theme-color" content="#ff4d94">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZukaiTemp">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/glass.css">
<style>
html,body{height:100%;overflow:hidden}
#app{position:fixed;inset:0}
#views{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(8%) scale(.96);filter:blur(6px);transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease,filter .45s ease,visibility 0s linear .55s}
iframe.before{transform:translateX(-8%) scale(.96)}
iframe.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease,filter .45s ease,visibility 0s}
#load{position:absolute;left:50%;top:42%;width:46px;height:46px;margin:-23px;border-radius:50%;border:4px solid color-mix(in srgb,var(--p1) 20%,transparent);border-top-color:var(--p1);animation:sp .8s linear infinite;z-index:3}
@keyframes sp{to{transform:rotate(360deg)}}
/* navigasi bawah: tab Menu di kiri + 4 tab */
#bar{position:absolute;left:14px;right:14px;bottom:calc(10px + var(--sb));height:70px;border-radius:32px;display:grid;grid-template-columns:repeat(6,1fr);padding:6px;z-index:10;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s}
body.npo #bar,body.npo #mini{transform:translateY(190%);opacity:0;pointer-events:none}
#ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/6);border-radius:26px;background:linear-gradient(145deg,color-mix(in srgb,var(--p1) 20%,#fff),color-mix(in srgb,var(--p2) 28%,rgba(255,255,255,.55)));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),0 10px 26px -10px var(--p1);transform:translateX(calc(var(--i,1)*100%));transition:transform .6s cubic-bezier(.34,1.46,.64,1)}
:root[data-dark] #ind{background:linear-gradient(145deg,color-mix(in srgb,var(--p1) 42%,transparent),color-mix(in srgb,var(--p1) 14%,transparent));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.25),0 10px 26px -10px var(--p1)}
#bar button{position:relative;z-index:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 .64rem Fredoka;transition:color .3s}
#bar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s cubic-bezier(.34,1.8,.64,1)}
#bar button.on{color:var(--p1)}#bar button.on svg{transform:translateY(-1px) scale(1.14)}
#bar button:focus-visible{outline:3px solid var(--p1);outline-offset:-3px;border-radius:26px}
#bar .dot{position:absolute;top:9px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:#ff3b5c;border:2px solid var(--p4);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
/* mini player */
#mini{position:absolute;left:14px;right:14px;bottom:var(--navh);border-radius:26px;display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:9;transform:translateY(170%);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .4s}
#mini.on{transform:none;opacity:1}
#mini .a{flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p2),var(--p1)) center/cover}
#mini .i{flex:1;min-width:0;cursor:pointer}#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini b{font-size:.9rem}#mini span{font-size:.76rem;color:var(--mut);font-weight:700}
#mini button{border:0;background:none;font-size:1.25rem;width:42px;height:42px;border-radius:50%;color:var(--ink)}
#mini button.x{font-size:.95rem;width:32px;color:var(--mut)}
#mini button.pl{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;box-shadow:0 8px 16px -8px var(--p1)}
#ins{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 8px);z-index:12;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:20px;font:600 .85rem Fredoka;animation:drop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}}
#ins span{flex:1}#ins button{border:0;border-radius:99px;min-height:34px;padding:0 14px;font:600 .82rem Fredoka;background:var(--p1);color:#fff}
#ins button.x{background:none;color:var(--mut);padding:0 8px;font-size:1rem}
/* tab kiri (drawer) */
#scrim{position:fixed;inset:0;z-index:28;background:rgba(14,8,24,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
#scrim.on{opacity:1;pointer-events:auto}
#edge{position:fixed;left:0;top:18%;bottom:18%;width:14px;z-index:25;touch-action:none}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:30;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(var(--sb) + 16px);border-radius:0 34px 34px 0;background:color-mix(in srgb,var(--p4) 86%,transparent);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border-right:1px solid var(--glb);box-shadow:30px 0 70px -30px rgba(0,0,0,.5);transform:translateX(-108%);transition:transform .55s cubic-bezier(.22,1,.36,1);overflow-y:auto}
#drawer.on{transform:none}
.prof{display:flex;gap:12px;align-items:center;padding:16px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--p1),color-mix(in srgb,var(--p1) 40%,var(--g2)));box-shadow:0 20px 36px -18px var(--p1);position:relative;overflow:hidden}
.prof::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18)}
.av{flex:none;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font:600 1.4rem Fredoka;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.av img{width:100%;height:100%;object-fit:cover}
.prof .t{min-width:0;position:relative;z-index:1}
.prof b{display:block;font:600 1.05rem Fredoka;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof span{display:block;font-size:.78rem;opacity:.9;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof em{display:inline-block;margin-top:4px;font:700 .68rem Nunito;font-style:normal;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.3)}
.gb{border:0;border-radius:18px;min-height:46px;font:600 .92rem Fredoka;color:var(--p1);background:var(--w);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.gb:active{transform:scale(.96)}
.dl{display:flex;flex-direction:column;gap:2px}
.dl hr{border:0;height:1px;margin:6px 10px;background:var(--p3)}
.dl button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 10px;border:0;border-radius:18px;background:transparent;color:var(--ink);font:600 .98rem Fredoka;text-align:left;transition:background .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.dl button:active{transform:scale(.97);background:color-mix(in srgb,var(--p1) 12%,transparent)}
.ic2{flex:none;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--p1) 14%,transparent);color:var(--p1)}
.ic2 svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bg2{margin-left:auto;min-width:22px;height:22px;border-radius:99px;background:var(--p1);color:#fff;font:700 .72rem Nunito;display:grid;place-items:center;padding:0 6px}
#drawer.on .dl>*{animation:dIn .55s cubic-bezier(.22,1,.36,1) both}
#drawer.on .dl>*:nth-child(1){animation-delay:.05s}#drawer.on .dl>*:nth-child(2){animation-delay:.09s}#drawer.on .dl>*:nth-child(3){animation-delay:.13s}#drawer.on .dl>*:nth-child(4){animation-delay:.17s}#drawer.on .dl>*:nth-child(5){animation-delay:.21s}#drawer.on .dl>*:nth-child(6){animation-delay:.25s}#drawer.on .dl>*:nth-child(7){animation-delay:.29s}#drawer.on .dl>*:nth-child(8){animation-delay:.33s}#drawer.on .dl>*:nth-child(9){animation-delay:.37s}#drawer.on .dl>*:nth-child(10){animation-delay:.41s}
@keyframes dIn{from{opacity:0;transform:translateX(-22px)}}
.dfoot a{color:var(--p1)}
.dfoot{margin-top:auto;line-height:1.7;text-align:center;font:700 .74rem Nunito;color:var(--mut);padding-top:6px}
/* pengumuman global: tampil di atas semua tab */
#annHost{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px}
#annHost.modal{justify-content:center;background:rgba(14,8,24,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:auto}
.an{pointer-events:auto;width:min(100%,430px);padding:16px 16px 14px;border-radius:26px;background:color-mix(in srgb,var(--w) 92%,transparent);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--glb);box-shadow:0 26px 50px -22px rgba(0,0,0,.55);animation:anIn .65s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.an::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--p1),var(--g2))}
.an.p::before{background:linear-gradient(#ff3b5c,#ff9d2f)}
@keyframes anIn{from{opacity:0;transform:translateY(-34px) scale(.94)}}
.an h3{font:600 1.02rem Fredoka;display:flex;gap:8px;align-items:center;padding-left:6px}
.an p{margin:6px 0 12px 6px;font-weight:600;font-size:.9rem;color:var(--mut);white-space:pre-wrap;word-break:break-word}
.an .r{display:flex;gap:8px;justify-content:flex-end}
.an button{border:0;border-radius:14px;min-height:38px;padding:0 16px;font:600 .86rem Fredoka;background:var(--p3);color:var(--p1)}
.an button.pr{background:linear-gradient(135deg,var(--p1),var(--g2));color:#fff;box-shadow:0 10px 18px -10px var(--p1)}
/* layar pembuka */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:var(--p4);transition:opacity .7s ease,transform .9s cubic-bezier(.22,1,.36,1),filter .7s}
#splash.out{opacity:0;transform:scale(1.08);filter:blur(12px);pointer-events:none}
.sp-aur{position:absolute;inset:-30%;pointer-events:none;background:radial-gradient(40% 32% at 20% 16%,color-mix(in srgb,var(--p2) 70%,transparent),transparent 70%),radial-gradient(38% 30% at 86% 24%,color-mix(in srgb,var(--g2) 55%,transparent),transparent 70%),radial-gradient(48% 36% at 62% 92%,color-mix(in srgb,var(--p1) 38%,transparent),transparent 72%);animation:ztAur 14s ease-in-out infinite alternate}
.sp-core{position:relative;width:148px;height:148px;display:grid;place-items:center;animation:spPop .9s cubic-bezier(.34,1.56,.64,1) both}
.sp-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.sp-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.sp-ring .rb{stroke:color-mix(in srgb,var(--p1) 16%,transparent)}
.sp-ring .rf{stroke:url(#spG);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 0 6px var(--p1))}
.sp-ico{position:relative;width:92px;height:92px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,var(--p1),color-mix(in srgb,var(--p1) 45%,var(--g2)));box-shadow:0 22px 44px -16px var(--p1),inset 0 2px 0 rgba(255,255,255,.55);animation:spFloat 3.4s ease-in-out infinite}
.sp-ico svg{position:absolute;width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:spMorph 5s infinite}
.sp-ico svg:nth-child(2){animation-delay:1s}.sp-ico svg:nth-child(3){animation-delay:2s}.sp-ico svg:nth-child(4){animation-delay:3s}.sp-ico svg:nth-child(5){animation-delay:4s}
@keyframes spMorph{0%{opacity:0;transform:scale(.4) rotate(-25deg)}6%,18%{opacity:1;transform:none}24%{opacity:0;transform:scale(.4) rotate(25deg)}100%{opacity:0}}
@keyframes spPop{from{opacity:0;transform:scale(.4)}}
@keyframes spFloat{50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.sp-name{display:flex;margin-top:22px;font:600 2.1rem Fredoka;color:var(--ink)}
.sp-name i{font-style:normal;display:inline-block;animation:spLet .6s cubic-bezier(.34,1.56,.64,1) both}.sp-name i.t{color:var(--p1)}
@keyframes spLet{from{opacity:0;transform:translateY(24px) rotate(8deg)}}
.sp-tip{min-height:2.8em;margin-top:6px;max-width:300px;text-align:center;font:700 .88rem/1.4 Nunito;color:var(--mut);transition:opacity .35s,transform .35s}
.sp-tip.sw{opacity:0;transform:translateY(8px)}
#spT{margin-top:12px;font:700 .8rem Nunito;color:var(--p1);letter-spacing:.02em}
#spS{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px;margin-top:14px;min-height:34px}
#spS span{padding:6px 14px;border-radius:99px;font:700 .74rem Nunito;color:var(--ink);animation:rise .5s both}
.sp-foot{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:0;right:0;text-align:center;font:700 .74rem Nunito;color:var(--mut);opacity:.85}
</style>

<body>
<div id="app">
  <div id="views">
    <iframe id="v-email" title="Email sementara" data-src="/email.html"></iframe>
    <iframe id="v-musik" title="Musik" data-src="/music.html" allow="autoplay; encrypted-media"></iframe>
    <iframe id="v-anime" title="Anime" data-src="/anime.html" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    <iframe id="v-unduh" title="Downloader" data-src="/download.html"></iframe>
    <iframe id="v-tools" title="Tools" data-src="/tools.html" allow="clipboard-write"></iframe>
    <iframe id="v-me" title="Menu dan pengaturan" data-src="/me.html" allow="clipboard-write"></iframe>
    <div id="load" hidden></div>
  </div>
  <div id="ins" class="glass" hidden><span>📲 Pasang ZukaiTemp sebagai aplikasi</span><button id="insGo">Pasang</button><button class="x" id="insX" aria-label="Tutup">✕</button></div>
  <div id="mini" class="glass"><div class="a" id="mArt"></div><div class="i" id="mInfo"><b id="mT"></b><span id="mA"></span></div><button id="mPv" aria-label="Sebelumnya">⏮</button><button class="pl" id="mPl" aria-label="Putar atau jeda">⏸</button><button id="mNx" aria-label="Berikutnya">⏭</button><button class="x" id="mX" aria-label="Tutup pemutar mini">✕</button></div>
  <nav id="bar" class="glass" aria-label="Navigasi utama">
    <i id="ind"></i>
    <button id="tabMenu" aria-label="Buka menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>Menu<b class="dot" id="mDot" hidden></b></button>
    <button data-v="email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M4.5 8.5L12 13.5l7.5-5"/></svg>Email</button>
    <button data-v="musik"><svg viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>Musik</button>
    <button data-v="anime"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="3.5"/><path d="M10.2 8.8l4 2.2-4 2.2z"/><path d="M8 20.5h8"/></svg>Anime</button>
    <button data-v="unduh"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.2-4.2M12 15l4.2-4.2"/><path d="M5 19.5h14"/></svg>Unduh</button>
    <button data-v="tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.1L4 17l3 3 5.6-5.5a4 4 0 0 0 5.1-5.2l-2.4 2.4-2.6-.6-.6-2.6z"/></svg>Tools</button>
  </nav>
</div>

<div id="edge"></div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Menu samping" aria-hidden="true">
  <div class="prof"><div class="av" id="dAv">🙂</div><div class="t"><b id="dName">Tamu</b><span id="dMail">Belum terhubung</span><em id="dRole" hidden>👑 Owner</em></div></div>
  <button class="gb" id="dLogin">🔗 Masuk dengan Google</button>
  <div class="dl">
    <button data-me="akun"><span class="ic2"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>Akun &amp; YouTube</button>
    <button data-me="pengumuman"><span class="ic2"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l7 4V6l-7 4z"/><path d="M17.5 9a4 4 0 0 1 0 6"/></svg></span>Pengumuman<em class="bg2" id="bAnn" hidden></em></button>
    <button data-me="chat"><span class="ic2"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg></span>Chat global</button>
    <button data-me="request"><span class="ic2"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>Request<em class="bg2" id="bReq" hidden></em></button>
    <hr>
    <button data-me="tampilan"><span class="ic2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 12h9"/></svg></span>Tampilan</button>
    <button data-me="penyimpanan"><span class="ic2"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span>Penyimpanan &amp; cache</button>
    <button data-me="log"><span class="ic2"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M10 12h6M10 16h6M10 8h2"/></svg></span>Log</button>
    <button data-me="tentang"><span class="ic2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></span>Tentang</button>
    <button data-me="pengaturan"><span class="ic2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>Semua pengaturan</button>
  </div>
  <div class="dfoot">ZukaiTemp · geser dari tepi kiri untuk membuka menu<br><a href="/privacy.html" target="_blank" rel="noopener">Kebijakan Privasi</a> · <a href="/terms.html" target="_blank" rel="noopener">Ketentuan Layanan</a></div>
</aside>
<div id="annHost"></div>

<div id="splash">
  <div class="sp-aur"></div>
  <div class="sp-core">
    <svg class="sp-ring" viewBox="0 0 120 120"><defs><linearGradient id="spG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs><circle class="rb" cx="60" cy="60" r="54"/><circle class="rf" id="spR" cx="60" cy="60" r="54"/></svg>
    <div class="sp-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M4.5 8.5L12 13.5l7.5-5"/></svg><svg viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="3.5"/><path d="M10.2 8.8l4 2.2-4 2.2z"/><path d="M8 20.5h8"/></svg><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.2-4.2M12 15l4.2-4.2"/><path d="M5 19.5h14"/></svg><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.1L4 17l3 3 5.6-5.5a4 4 0 0 0 5.1-5.2l-2.4 2.4-2.6-.6-.6-2.6z"/></svg></div>
  </div>
  <div class="sp-name" id="spN" aria-label="ZukaiTemp"></div>
  <div class="sp-tip" id="spP"></div>
  <div id="spT">Menyiapkan aplikasi…</div>
  <div id="spS"></div>
  <div class="sp-foot" id="spF"></div>
</div>

<script>
const $=s=>document.querySelector(s),O=location.origin;
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const TABS=['email','musik','anime','unduh','tools'],V=[...TABS,'me'];let curV='email',prevTab='email',mini=null,miniOff=false;
/* inset layar bawah (iPhone) diteruskan ke semua halaman */
const SB=(()=>{const d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden';document.body.appendChild(d);const v=parseFloat(getComputedStyle(d).paddingBottom)||0;d.remove();return v})();
document.documentElement.style.setProperty('--sb',SB+'px');
let mailStats=null,mailResolve;const mailP=new Promise(r=>mailResolve=r);
document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{
  f.dataset.r='1';try{f.contentDocument.documentElement.style.setProperty('--sb',SB+'px')}catch{}
  if('v-'+curV===f.id)$('#load').hidden=true;
}));
const syncMini=()=>$('#mini').classList.toggle('on',!!(mini&&mini.has&&curV!=='musik'&&!miniOff));
const toMusic=m=>{const f=$('#v-musik');f.contentWindow&&f.contentWindow.postMessage(m,O)};
const cmd=c=>toMusic({cmd:c});
function go(v,sec){
  if(!V.includes(v))v='email';
  if(v!=='me')prevTab=v;
  if(v==='me'){const f=$('#v-me');if(!f.src)f.src='/me.html#'+(sec||'home');else if(sec&&f.contentWindow)f.contentWindow.postMessage({sec},O)}
  const n=V.indexOf(v);curV=v;
  V.forEach((k,i)=>{const f=$('#v-'+k);if(k===v&&!f.src)f.src=f.dataset.src;f.classList.toggle('on',k===v);f.classList.toggle('before',i<n)});
  document.querySelectorAll('#bar [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#tabMenu').classList.toggle('on',v==='me'||drawerOn);
  $('#bar').style.setProperty('--i',drawerOn||v==='me'?0:TABS.indexOf(v)+1);
  $('#load').hidden=$('#v-'+v).dataset.r==='1';
  ['me','anime'].forEach(k=>{try{const m=$('#v-'+k);m.contentWindow&&m.contentWindow.postMessage({active:v===k},O)}catch{}});
  syncMini();
  if(v!=='musik'&&document.body.classList.contains('npo'))cmd('closeNp');
  const h=v==='me'?'me':v;if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h);
}
document.querySelectorAll('#bar [data-v]').forEach(b=>b.onclick=()=>{closeDrawer();go(b.dataset.v)});
/* ---- tab kiri (drawer) ---- */
let drawerOn=false;
function setDrawer(on){
  drawerOn=on;$('#drawer').classList.toggle('on',on);$('#scrim').classList.toggle('on',on);$('#drawer').setAttribute('aria-hidden',on?'false':'true');
  $('#tabMenu').classList.toggle('on',on||curV==='me');
  $('#bar').style.setProperty('--i',on||curV==='me'?0:Math.max(0,TABS.indexOf(curV))+1);
}
const openDrawer=()=>setDrawer(true),closeDrawer=()=>setDrawer(false);
$('#tabMenu').onclick=()=>setDrawer(!drawerOn);
$('#scrim').onclick=closeDrawer;
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
document.querySelectorAll('#drawer [data-me]').forEach(b=>b.onclick=()=>{closeDrawer();go('me',b.dataset.me);if(b.dataset.me==='pengumuman')ANN.forEach(a=>seen(a.id))});
$('#dLogin').onclick=()=>{closeDrawer();ZT.login()};
(()=>{ /* geser buka dari tepi kiri, geser ke kiri untuk menutup */
  let x0=0,y0=0,on=false;
  const st=e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;on=true},mv=e=>{if(!on)return;const t=e.touches[0],dx=t.clientX-x0,dy=Math.abs(t.clientY-y0);if(!drawerOn&&dx>46&&dy<40){on=false;openDrawer()}else if(drawerOn&&dx<-60&&dy<40){on=false;closeDrawer()}};
  $('#edge').addEventListener('touchstart',st,{passive:true});$('#edge').addEventListener('touchmove',mv,{passive:true});
  $('#drawer').addEventListener('touchstart',st,{passive:true});$('#drawer').addEventListener('touchmove',mv,{passive:true});
})();
/* ---- akun di drawer ---- */
function renderAcct(){
  const a=ZT.acct(),role=ZT.role();
  $('#dName').textContent=a?a.name:'Tamu';$('#dMail').textContent=a?a.email:'Belum terhubung';
  const av=$('#dAv');av.innerHTML=a&&a.picture?`<img src="${ZT.esc(a.picture)}" referrerpolicy="no-referrer" alt="">`:(a?ZT.esc((a.name||'?')[0].toUpperCase()):'🙂');
  $('#dRole').hidden=!(a&&role==='owner');$('#dLogin').hidden=!!a;
}
ZT.onacct=()=>{renderAcct();pollReq();};
renderAcct();
/* ---- pengumuman global + inbox owner ---- */
let ANN=[],reqNew=0;
const seenSet=()=>new Set(rd('zt_ann_seen',[]));
function seen(id){const s=seenSet();s.add(id);wr('zt_ann_seen',[...s].slice(-80))}
function badges(){
  const unread=ANN.filter(a=>!seenSet().has(a.id)).length;
  const set=(el,n)=>{el.hidden=!n;el.textContent=n>99?'99+':n};
  set($('#bAnn'),unread);set($('#bReq'),reqNew);$('#mDot').hidden=!(unread||reqNew);
}
const icons={info:'📣',penting:'⚠️',req:'📥'};
function showCards(cards){
  const host=$('#annHost');host.innerHTML='';host.classList.toggle('modal',cards.some(c=>c.kind==='penting'));
  cards.slice(0,3).forEach(c=>{
    const d=document.createElement('div');d.className='an'+(c.kind==='penting'?' p':'');
    d.innerHTML=`<h3>${icons[c.kind]||'📣'} <span>${ZT.esc(c.title)}</span></h3><p>${ZT.esc(c.body)}</p><div class="r">${c.open?'<button class="pr" data-o="1">Buka</button>':''}<button data-x="1">${c.open?'Nanti':'Mengerti'}</button></div>`;
    const done=()=>{c.done&&c.done();d.remove();if(!host.children.length){host.classList.remove('modal')}badges()};
    d.querySelector('[data-x]').onclick=done;
    const o=d.querySelector('[data-o]');if(o)o.onclick=()=>{done();go('me',c.open)};
    host.appendChild(d);
  });
}
function presentAnn(){
  const s=seenSet(),fresh=ANN.filter(a=>!s.has(a.id)).sort((a,b)=>(b.kind==='penting')-(a.kind==='penting')||b.ts-a.ts);
  badges();
  if(!fresh.length)return;
  if($('#annHost').children.length)return;
  showCards(fresh.map(a=>({kind:a.kind,title:a.title,body:a.body,done:()=>seen(a.id)})));
}
async function pollAnn(){try{const r=await fetch('/api/announce',{cache:'no-store'});if(!r.ok)return;const j=await r.json();ANN=j.items||[];presentAnn()}catch{}}
async function pollReq(){
  const t=ZT.token();if(!t||ZT.role()!=='owner'){reqNew=0;badges();return}
  try{
    const r=await fetch('/api/request?all=1',{headers:{authorization:'Bearer '+t},cache:'no-store'});if(!r.ok)return;
    const nw=((await r.json()).items||[]).filter(x=>x.status==='baru');reqNew=nw.length;badges();
    const sn=new Set(rd('zt_req_seen',[])),add=nw.filter(x=>!sn.has(x.id));
    if(add.length&&!$('#annHost').children.length){const x=add[0];showCards([{kind:'req',title:'Request baru'+(add.length>1?' ('+add.length+')':''),body:(x.name||'Tamu')+': '+x.msg.slice(0,140),open:'request',done:()=>{add.forEach(a=>sn.add(a.id));wr('zt_req_seen',[...sn].slice(-200))}}])}
  }catch{}
}
addEventListener('storage',e=>{if(e.key==='zt_ann_seen')badges();if(e.key==='zt_acct'||e.key==='zt_role')renderAcct()});
setInterval(()=>{if(!document.hidden){pollAnn();pollReq()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pollAnn();pollReq()}});
/* ---- pesan dari halaman di dalam iframe ---- */
addEventListener('message',e=>{
  if(e.origin!==O||!e.data)return;const d=e.data;
  if(d.go)go(d.go,d.sec);
  if(d.back)go(prevTab);
  if('np' in d)document.body.classList.toggle('npo',!!d.np);
  if(d.stats){mailStats=d.stats;mailResolve(mailStats)}
  if(d.mini){if(d.mini.playing||(mini&&mini.title!==d.mini.title))miniOff=false;mini=d.mini;$('#mT').textContent=mini.title||'';$('#mA').textContent=mini.artist||'';$('#mArt').style.backgroundImage=mini.art?`url("${String(mini.art).replace(/"/g,'')}")`:'';$('#mPl').textContent=mini.playing?'⏸':'▶';syncMini()}
  if(d.ytImport){go('musik');const f=$('#v-musik'),send=()=>toMusic({cmd:'ytImport',data:d.ytImport});if(f.dataset.r==='1')setTimeout(send,350);else f.addEventListener('load',()=>setTimeout(send,600),{once:true})}
  if(d.animePlay){miniOff=true;cmd('stop');syncMini()}
  if(d.annRefresh)pollAnn();
  if(d.reqRefresh)pollReq();
  if(d.swipe&&!drawerOn){
    const i=TABS.indexOf(curV);
    if(d.swipe==='edge')openDrawer();
    else if(d.swipe==='next'&&i>-1&&i<TABS.length-1)go(TABS[i+1]);
    else if(d.swipe==='prev'){if(i>0)go(TABS[i-1]);else if(i===0)openDrawer()}
  }
});
$('#mX').onclick=()=>{miniOff=true;cmd('stop');syncMini()};
$('#mPl').onclick=()=>cmd('toggle');$('#mNx').onclick=()=>cmd('next');$('#mPv').onclick=()=>cmd('prev');$('#mInfo').onclick=()=>go('musik');
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'email');

/* ---- tombol pasang aplikasi ---- */
let defer=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const showIns=()=>{let x=false;try{x=localStorage.getItem('zt_ins_x')}catch{}if(!standalone&&!x)$('#ins').hidden=false};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();defer=e;showIns()});
if(/iphone|ipad|ipod/i.test(navigator.userAgent))showIns();
$('#insGo').onclick=async()=>{if(defer){defer.prompt();await defer.userChoice;defer=null;$('#ins').hidden=true}else alert('Di iPhone: ketuk tombol Bagikan, lalu pilih "Tambah ke Layar Utama"')};
$('#insX').onclick=()=>{$('#ins').hidden=true;try{localStorage.setItem('zt_ins_x','1')}catch{}};
addEventListener('appinstalled',()=>{$('#ins').hidden=true});

/* ---- layar pembuka: semua angka diukur sungguhan, bukan karangan ---- */
(async()=>{
  const t0=performance.now(),R=$('#spR'),T=$('#spT'),S=$('#spS'),P=$('#spP'),acct=ZT.acct();
  $('#spN').innerHTML='ZukaiTemp'.split('').map((c,i)=>`<i class="${i>=5?'t':''}" style="animation-delay:${.3+i*.05}s">${c}</i>`).join('');
  $('#spF').textContent='v'+ZT.APP.version+' · oleh '+ZT.APP.dev.name;
  const tips=[acct?'Halo, '+String(acct.name).split(' ')[0]+'! 👋':'Selamat datang di ZukaiTemp 👋','💡 Geser dari tepi kiri layar untuk membuka menu','💡 Tab Anime memutar episode dari kanal YouTube resmi','💡 Ganti warna aksen di Menu → Tampilan','💡 Pasang lewat "Tambah ke Layar Utama" biar terasa seperti aplikasi'];
  let ti=0;P.textContent=tips[0];
  const tipT=setInterval(()=>{P.classList.add('sw');setTimeout(()=>{ti=(ti+1)%tips.length;P.textContent=tips[ti];P.classList.remove('sw')},350)},2100);
  const prog=(p,txt)=>{R.style.strokeDashoffset=339.3*(1-p/100);if(txt)T.textContent=txt};
  const chip=(id,txt)=>{let e=document.getElementById(id);if(!e){e=document.createElement('span');e.id=id;e.className='glass';S.appendChild(e)}e.textContent=txt};
  prog(10,'Memeriksa koneksi…');
  const c=navigator.connection,eff=c&&c.effectiveType;
  chip('c1',navigator.onLine?'🌐 Online'+(eff?' · '+eff.toUpperCase():''):'📴 Offline');
  const ts=[];
  for(let i=0;i<3;i++){const s=performance.now();try{await fetch('/icon-192.png?_='+Math.random(),{cache:'no-store'});ts.push(performance.now()-s)}catch{}}
  if(ts.length){ts.sort((a,b)=>a-b);chip('c2','⚡ Ping '+Math.round(ts[ts.length>>1])+' ms')}
  prog(38,'Memuat email sementara…');
  const f=$('#v-email'),loaded=new Promise(r=>{if(f.dataset.r==='1')r();else f.addEventListener('load',r,{once:true})});
  await Promise.race([loaded,new Promise(r=>setTimeout(r,4000))]);
  prog(68,'Mengecek server email…');chip('c3','📬 Mengecek server…');
  const st=await Promise.race([mailP,new Promise(r=>setTimeout(()=>r(null),3500))]);
  if(st){chip('c3',`📬 Server email ${st.ok}/${st.total} aktif`);chip('c4','🔗 '+st.domains+' domain tersedia')}
  else chip('c3','📬 Server email: belum merespons');
  prog(100,st?'Siap digunakan ✨':'Siap (server email sedang lambat)');
  await new Promise(r=>setTimeout(r,Math.max(1100,2600-(performance.now()-t0))));
  clearInterval(tipT);$('#splash').classList.add('out');setTimeout(()=>{const e=$('#splash');e&&e.remove()},950);
  ZT.log('info','Aplikasi dibuka ('+(standalone?'terpasang':'browser')+') v'+ZT.APP.version,'app');
  pollAnn();ZT.config().then(c=>{if(c.me)wr('zt_role',c.me.owner?'owner':'user');renderAcct();pollReq()});
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>ZT.log('warn','Service worker gagal: '+e.message,'app')));
</script>
</body>
</html>
