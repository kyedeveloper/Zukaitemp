<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZukaiTemp</title>
<meta name="description" content="ZukaiTemp: email sementara, musik, downloader, dan banyak tools.">
<meta name="theme-color" content="#ff4d94">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZukaiTemp">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
html,body{height:100%;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--p4);padding-top:env(safe-area-inset-top)}
#views{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--p4);display:none}
iframe.on{display:block}
#bar{display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--w);border-top:2px solid var(--p3);box-shadow:0 -10px 30px -20px rgba(255,77,148,.6)}
#bar button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;font:600 .72rem Fredoka;transition:.2s}
#bar button i{font-style:normal;font-size:1.35rem;line-height:1;transition:transform .25s}
#bar button.on{color:var(--p1);background:var(--p4)}
#bar button.on i{transform:translateY(-2px) scale(1.15)}
#mini{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--w);border-top:2px solid var(--p3)}
#mini .a{flex:none;width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--p2),var(--p1)) center/cover}
#mini .i{flex:1;min-width:0;cursor:pointer}#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini b{font-size:.9rem}#mini span{font-size:.76rem;color:var(--mut);font-weight:700}
#mini button{border:0;background:none;font-size:1.25rem;width:40px;height:40px;border-radius:50%;color:var(--ink)}
#mini button.pl{background:var(--p1);color:#fff}
#ins{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--p1);color:#fff;font:600 .85rem Fredoka}
#ins span{flex:1}#ins button{border:0;border-radius:99px;min-height:32px;padding:0 14px;font:600 .82rem Fredoka;background:#fff;color:var(--p1)}
#ins button.x{background:none;color:#fff;padding:0 6px;font-size:1rem}
#bar button:focus-visible{outline:3px solid var(--p1);outline-offset:-3px}
</style>
</head>
<body>
<div id="app">
  <div id="ins" hidden><span>📲 Pasang ZukaiTemp sebagai aplikasi</span><button id="insGo">Pasang</button><button class="x" id="insX" aria-label="Tutup">✕</button></div>
  <main id="views">
    <iframe id="v-email" title="Email sementara" data-src="/email.html"></iframe>
    <iframe id="v-musik" title="Musik" data-src="/music.html" allow="autoplay; encrypted-media"></iframe>
    <iframe id="v-unduh" title="Downloader" data-src="/download.html"></iframe>
    <iframe id="v-tools" title="Tools" data-src="/tools.html" allow="clipboard-write"></iframe>
  </main>
  <div id="mini" hidden><div class="a" id="mArt"></div><div class="i" id="mInfo"><b id="mT"></b><span id="mA"></span></div><button id="mPv" aria-label="Sebelumnya">⏮</button><button class="pl" id="mPl" aria-label="Putar atau jeda">⏸</button><button id="mNx" aria-label="Berikutnya">⏭</button></div>
  <nav id="bar" aria-label="Navigasi utama">
    <button data-v="email"><i>📧</i>Email</button>
    <button data-v="musik"><i>🎵</i>Musik</button>
    <button data-v="unduh"><i>⬇️</i>Unduh</button>
    <button data-v="tools"><i>🛠</i>Tools</button>
  </nav>
</div>
<script>
try{if(JSON.parse(localStorage.getItem('zt_dark')))document.documentElement.setAttribute('data-dark','')}catch{}
addEventListener('storage',e=>{if(e.key==='zt_dark'){try{document.documentElement.toggleAttribute('data-dark',!!JSON.parse(e.newValue))}catch{}}});
const V=['email','musik','unduh','tools'];
let curV='email',mini=null;
const $=s=>document.querySelector(s);
const syncMini=()=>{$('#mini').hidden=!(mini&&mini.has&&curV!=='musik')};
const cmd=c=>{const f=document.getElementById('v-musik');f.contentWindow&&f.contentWindow.postMessage({cmd:c},location.origin)};
function go(v){
  if(!V.includes(v))v='email';
  V.forEach(k=>{const f=document.getElementById('v-'+k);if(k===v&&!f.src)f.src=f.dataset.src;f.classList.toggle('on',k===v)});
  document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  curV=v;syncMini();
  if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);
}
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data)return;
  if(e.data.go)go(e.data.go);
  if(e.data.mini){mini=e.data.mini;$('#mT').textContent=mini.title||'';$('#mA').textContent=mini.artist||'';$('#mArt').style.backgroundImage=mini.art?`url("${String(mini.art).replace(/"/g,'')}")`:'';$('#mPl').textContent=mini.playing?'⏸':'▶';syncMini()}
});
$('#mPl').onclick=()=>cmd('toggle');$('#mNx').onclick=()=>cmd('next');$('#mPv').onclick=()=>cmd('prev');$('#mInfo').onclick=()=>go('musik');
/* ---- tombol pasang aplikasi ---- */
let defer=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const showIns=()=>{let x=false;try{x=localStorage.getItem('zt_ins_x')}catch{}if(!standalone&&!x)$('#ins').hidden=false};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();defer=e;showIns()});
if(/iphone|ipad|ipod/i.test(navigator.userAgent))showIns();
$('#insGo').onclick=async()=>{if(defer){defer.prompt();await defer.userChoice;defer=null;$('#ins').hidden=true}else alert('Di iPhone: ketuk tombol Bagikan, lalu pilih "Tambah ke Layar Utama"')};
$('#insX').onclick=()=>{$('#ins').hidden=true;try{localStorage.setItem('zt_ins_x','1')}catch{}};
addEventListener('appinstalled',()=>{$('#ins').hidden=true});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'email');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
