<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Email sementara · ZukaiTemp</title>
<meta name="theme-color" content="#08070c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
main{max-width:620px;padding-top:24px}
.addr{border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.05);border-radius:var(--r);padding:14px;margin-bottom:14px}
.addr small{font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);display:block;margin-bottom:6px}
.addr b{font-family:var(--mono);font-size:.92rem;color:var(--a2);word-break:break-all;display:block}
.addr .row{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mail{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:6px;cursor:pointer;transition:.2s}
.mail:hover{border-color:var(--a2)}
.mail.unread{border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.05)}
.mail .m{flex:1;min-width:0}
.mail b{font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail small{font-size:.68rem;color:var(--dim2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail .tm{font-family:var(--mono);font-size:.55rem;color:var(--dim2);flex:none}
#reader{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .35s var(--ease);padding-bottom:30px}
#reader.up{transform:none}
#reader .hd{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:12px 14px;background:rgba(8,7,12,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#reader .hd button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--txt);cursor:pointer}
#reader .bd{padding:16px 14px}
#reader h3{font-size:.95rem;margin-bottom:6px}
#reader .from{font-family:var(--mono);font-size:.65rem;color:var(--dim2);margin-bottom:14px}
#reader .frame{width:100%;min-height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<div class="grid-bg"></div>
<header class="top"><div class="wrap hrow">
  <a href="/" class="logo"><span class="mk"><i class="fa-solid fa-envelope"></i></span><span>EMAIL SEMENTARA<small>ZUKAITEMP</small></span></a>
  <div class="hactions"><a class="iconbtn" href="/"><i class="fa-solid fa-xmark"></i></a></div>
</div></header>

<main class="wrap">
  <span class="kicker">Sekali pakai</span>
  <h2 class="sec">Kotak masuk sementara</h2>
  <p class="sub">Untuk verifikasi, uji coba, atau mendaftar hal yang tidak mau kamu campur dengan email utama. Alamatnya hilang kalau tab ditutup permanen.</p>

  <div class="addr" id="addrBox" style="margin-top:16px">
    <small>Alamat kamu</small>
    <b id="addr">—</b>
    <div class="row">
      <button class="btn p" onclick="copyAddr()"><i class="fa-regular fa-copy"></i> Copy</button>
      <button class="btn" onclick="refresh()"><i class="fa-solid fa-rotate"></i> Segarkan</button>
      <button class="btn" onclick="newAddr()"><i class="fa-solid fa-plus"></i> Ganti</button>
    </div>
  </div>

  <div id="list"><div class="empty">Membuat alamat…</div></div>
</main>

<div id="reader">
  <div class="hd">
    <button onclick="closeReader()"><i class="fa-solid fa-arrow-left"></i></button>
    <span class="mono" style="font-size:.62rem;letter-spacing:.14em;color:var(--dim2)">BACA PESAN</span>
    <button style="margin-left:auto" onclick="delMail()"><i class="fa-solid fa-trash"></i></button>
  </div>
  <div class="bd">
    <h3 id="rSub">—</h3>
    <div class="from" id="rFrom">—</div>
    <iframe class="frame" id="rFrame" sandbox="allow-popups allow-same-origin"></iframe>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('up'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('up'),2200); }
const K = 'zk_mail';
let box = null, timer = null, curId = null;

function save(){ localStorage.setItem(K, JSON.stringify(box)); }
function load(){ try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch { return null; } }

async function newAddr(){
  $('#list').innerHTML = '<div class="skel"></div><div class="skel" style="margin-top:8px"></div>';
  try {
    const r = await fetch('/api/mail?a=create');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'gagal membuat alamat');
    box = { address: j.address, token: j.token };
    save();
    $('#addr').textContent = box.address;
    toast('Alamat baru siap');
    refresh();
  } catch (e) {
    $('#addr').textContent = '—';
    $('#list').innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

async function refresh(){
  if (!box?.token) return;
  try {
    const r = await fetch(`/api/mail?a=inbox&token=${encodeURIComponent(box.token)}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'gagal memuat');
    if (!j.data.length) return $('#list').innerHTML = '<div class="empty">Belum ada pesan. Kotak ini menunggu.</div>';
    $('#list').innerHTML = j.data.map(m => `<div class="mail ${m.seen ? '' : 'unread'}" data-id="${m.id}">
      <div class="m"><b>${m.subject.replace(/[<>]/g,'')}</b><small>${m.from.replace(/[<>]/g,'')} · ${m.intro.replace(/[<>]/g,'').slice(0,60)}</small></div>
      <span class="tm">${new Date(m.at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('');
    $('#list').querySelectorAll('.mail').forEach(el => el.onclick = () => openMail(el.dataset.id));
  } catch (e) { $('#list').innerHTML = `<div class="empty">${e.message}</div>`; }
}

async function openMail(id){
  curId = id;
  $('#rSub').textContent = 'Memuat…'; $('#rFrom').textContent = ''; $('#rFrame').srcdoc = '';
  $('#reader').classList.add('up');
  try {
    const r = await fetch(`/api/mail?a=read&token=${encodeURIComponent(box.token)}&id=${encodeURIComponent(id)}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'gagal');
    $('#rSub').textContent = j.subject || '(tanpa subjek)';
    $('#rFrom').textContent = j.from + ' · ' + new Date(j.at).toLocaleString('id-ID');
    $('#rFrame').srcdoc = j.html || `<pre style="font-family:monospace;padding:12px;white-space:pre-wrap">${(j.text||'').replace(/[<>]/g,'')}</pre>`;
  } catch (e) { $('#rSub').textContent = e.message; }
}
function closeReader(){ $('#reader').classList.remove('up'); curId = null; }

async function delMail(){
  if (!curId) return;
  await fetch(`/api/mail?a=delete&token=${encodeURIComponent(box.token)}&id=${encodeURIComponent(curId)}`).catch(()=>{});
  closeReader(); toast('Pesan dihapus'); refresh();
}

function copyAddr(){
  if (!box?.address) return;
  navigator.clipboard.writeText(box.address).then(() => toast('Alamat disalin')).catch(() => toast('Gagal menyalin'));
}

/* init */
box = load();
if (box?.address) { $('#addr').textContent = box.address; refresh(); }
else newAddr();
timer = setInterval(refresh, 10000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
</script>
</body>
</html>
