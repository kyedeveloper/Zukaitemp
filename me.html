.sh2 h3{margin-bottom:6px}.sh2 p{margin-bottom:12px}.sh2 .r{display:flex;gap:10px;margin-top:12px}.sh2 .r .btn{flex:1}

.cb{position:relative;max-width:86%;padding:9px 14px 10px;border-radius:20px 20px 20px 6px;background:var(--w);box-shadow:var(--sh);animation:ztRise .4s cubic-bezier(.22,1,.36,1)}

.cm.me .cn,.cm.me .cn span,.cm.me .cn i{color:rgba(255,255,255,.8)}

.lk{color:var(--p1);text-decoration:underline;cursor:pointer}

<body>
<div class="wrap">
  <header class="top"><button class="ib glass" id="back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="tt"><h1 id="ttl">Menu</h1></div></header>
  <main id="pg" class="pg"></main>
</div>
<div id="sheet" hidden><div class="sh2"><h3 id="shT"></h3><p class="d" id="shM"></p><textarea class="f2 glass" id="shI" rows="3" hidden></textarea><div class="r"><button class="btn o" id="shN">Batal</button><button class="btn p" id="shY">OK</button></div></div></div>
<script>
const $=s=>document.querySelector(s),O=location.origin,esc=ZT.esc,pg=$('#pg');
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const isOwner=()=>ZT.role()==='owner';
const fmtB=n=>n==null?'—':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'baru saja':s<3600?Math.floor(s/60)+' mnt lalu':s<86400?Math.floor(s/3600)+' jam lalu':Math.floor(s/86400)+' hari lalu'};
const clock=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const avatar=a=>a&&a.picture?`<img src="${esc(a.picture)}" referrerpolicy="no-referrer" alt="">`:(a?esc((a.name||'?')[0].toUpperCase()):'🙂');
async function api(path,o={}){
  const h={'content-type':'application/json'},t=ZT.token();if(t)h.authorization='Bearer '+t;
  const r=await fetch(path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:'no-store'});
  let j={};try{j=await r.json()}catch{}
  if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e}return j;
}
function ask(o){return new Promise(res=>{
  $('#shT').textContent=o.title||'';$('#shM').textContent=o.msg||'';const i=$('#shI');i.hidden=!o.input;i.value='';i.placeholder=o.input||'';
  $('#shY').textContent=o.ok||'OK';$('#shY').className='btn '+(o.danger?'o':'p');$('#shN').hidden=o.single;
  const done=v=>{$('#sheet').hidden=true;res(v)};
  $('#shY').onclick=()=>done(o.input?i.value.trim():true);$('#shN').onclick=()=>done(o.input?null:false);
  $('#sheet').hidden=false;if(o.input)setTimeout(()=>i.focus(),50);
})}
/* ---- bagian halaman ---- */
const S={
  home:{t:'Menu',r:rHome},akun:{t:'Akun & YouTube',r:rAkun,up:'home'},pengumuman:{t:'Pengumuman',r:rAnn,up:'home'},request:{t:'Request',r:rReq,up:'home'},
  pengaturan:{t:'Pengaturan',r:rSet,up:'home'},chat:{t:'Chat global',r:rChat,up:'home'},tampilan:{t:'Tampilan',r:rLook,up:'pengaturan'},penyimpanan:{t:'Penyimpanan & cache',r:rStore,up:'pengaturan'},log:{t:'Log',r:rLog,up:'pengaturan'}
};
let cur='home';
function nav(id){
  clearTimeout(CH.t);if(!S[id])id='home';cur=id;$('#ttl').textContent=S[id].t;
  pg.classList.remove('in');void pg.offsetWidth;pg.classList.add('in');
  scrollTo({top:0});S[id].r();
}
const A={
  nav:v=>nav(v),
  login:()=>ZT.login(),ytlink:()=>ZT.linkYT(),logout:async()=>{if(await ask({title:'Keluar dari akun?',msg:'Akun Google akan diputus dari ZukaiTemp di perangkat ini.',ok:'Keluar'}))ZT.logout()},
  set:v=>{const [k,val]=v.split(':');ZT.set({[k]:val==='true'?true:val==='false'?false:val});rLook(true)},
  tg:v=>{ZT.set({[v]:!ZT.prefs()[v]});rLook(true)}
};
pg.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=b.dataset.a.indexOf(':'),k=i<0?b.dataset.a:b.dataset.a.slice(0,i),v=i<0?'':b.dataset.a.slice(i+1);if(A[k])A[k](v,b,e)});
$('#back').onclick=()=>{const u=S[cur].up;if(u)nav(u);else parent.postMessage({back:1},O)};
/* ---- beranda ---- */
function rHome(){
  const a=ZT.acct();
  pg.innerHTML=`<section class="hero"><div class="av2">${avatar(a)}</div><div class="ht"><b>${a?esc(a.name):'Selamat datang 👋'}</b><span>${a?esc(a.email):'Masuk dengan Google untuk fitur akun'}</span>${a&&isOwner()?'<em>👑 Owner</em>':''}</div><button class="hb" data-a="${a?'nav:akun':'login'}">${a?'Kelola':'Masuk'}</button></section>
  <div class="tiles2">${[['pengumuman','📣','Pengumuman','Kabar dari owner'],['request','💬','Request','Kirim ke owner'],['tampilan','🎨','Tampilan','Warna & animasi'],['penyimpanan','💾','Penyimpanan','Cache & data'],['log','📜','Log','Catatan aplikasi'],['chat','💬','Chat global','Ngobrol bareng'],['akun','▶️','YouTube','Impor playlist'],['pengaturan','⚙️','Pengaturan','Semua opsi']].map(t=>`<button class="tile2 glass" data-a="nav:${t[0]}"><span class="em">${t[1]}</span>${t[2]}<small>${t[3]}</small></button>`).join('')}</div>
  <p class="foot">ID perangkat: ${esc(ZT.dev())}</p>`;
}
/* ---- pengaturan ---- */
function rSet(){
  pg.innerHTML=`<div class="card">${[['tampilan','🎨','Tampilan','Mode gelap, warna aksen, animasi'],['penyimpanan','💾','Penyimpanan & cache','Pemakaian ruang dan pembersihan'],['log','📜','Log','Catatan kesalahan dan kejadian']].map(r=>`<button class="row" data-a="nav:${r[0]}"><span class="em">${r[1]}</span><span class="tx">${r[2]}<small>${r[3]}</small></span><span class="ch">›</span></button>`).join('')}</div>
  <div class="card"><h3>ℹ️ Tentang</h3><p class="d">ZukaiTemp · email sementara, musik, downloader, dan tools. Semua pengaturan tampilan tersimpan di perangkat ini.</p><p class="d" style="margin-top:8px"><a href="/privacy.html" target="_blank" rel="noopener" style="color:var(--p1)">Kebijakan Privasi</a> · <a href="/terms.html" target="_blank" rel="noopener" style="color:var(--p1)">Ketentuan Layanan</a></p></div>`;
}
/* ---- tampilan ---- */
const SWS={sakura:['Sakura','#ff4d94','#b388ff'],aurora:['Aurora','#7c5cff','#ff6fb1'],samudra:['Samudra','#2f7bff','#22d3c5'],mint:['Mint','#10b981','#38bdf8'],senja:['Senja','#ff7a2f','#ff4d94'],mocha:['Mocha','#a0714f','#e8b86d']};
function rLook(keep){
  const p=ZT.prefs(),seg=(k,o)=>`<div class="seg">${o.map(x=>`<button data-a="set:${k}:${x[0]}" class="${p[k]===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
  const tg=(k,em,t,s)=>`<div class="row"><span class="em">${em}</span><span class="tx">${t}<small>${s}</small></span><button class="tg ${p[k]?'on':''}" role="switch" aria-checked="${!!p[k]}" aria-label="${t}" data-a="tg:${k}"></button></div>`;
  pg.innerHTML=`<div class="card"><h3>🌗 Mode</h3>${seg('theme',[['light','☀️ Terang'],['dark','🌙 Gelap'],['auto','✨ Otomatis']])}<p class="d">Otomatis mengikuti pengaturan HP kamu.</p></div>
  <div class="card"><h3>🎨 Warna aksen</h3><div class="swg">${Object.entries(SWS).map(([k,v])=>`<button class="sw2 ${p.acc===k?'on':''}" style="--c1:${v[1]};--c2:${v[2]}" data-a="set:acc:${k}"><i>${p.acc===k?'✓':''}</i>${v[0]}</button>`).join('')}</div></div>
  <div class="card"><h3>✨ Animasi</h3>${seg('anim',[['full','Penuh'],['lite','Hemat'],['off','Mati']])}<p class="d">Hemat mematikan latar bergerak dan animasi masuk. Mati menghentikan semua gerakan (bagus untuk HP lawas atau baterai tipis).</p></div>
  <div class="card"><h3>🔤 Ukuran teks</h3>${seg('fs',[['s','Kecil'],['m','Normal'],['l','Besar']])}</div>
  <div class="card">${tg('glass','🪟','Efek kaca','Blur transparan di kartu dan menu')}${tg('swipe','👆','Geser pindah tab','Geser kiri/kanan untuk ganti tab, dari tepi kiri untuk buka menu')}</div>`;
}
/* ---- penyimpanan & cache ---- */
function lsGroups(){
  const g={musik:0,email:0,pengaturan:0,log:0,lain:0};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),n=(k.length+(localStorage.getItem(k)||'').length)*2;g[/^zm_/.test(k)?'musik':/^pm_/.test(k)?'email':k==='zt_log'?'log':/^zt_/.test(k)?'pengaturan':'lain']+=n}
  return g;
}
async function rStore(){
  pg.innerHTML=`<div class="card"><div class="sk" style="height:110px"></div></div>`;
  const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate().catch(()=>null):null;
  const persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted().catch(()=>false):false;
  const ck=window.caches?await caches.keys().catch(()=>[]):[],g=lsGroups(),lsT=Object.values(g).reduce((a,b)=>a+b,0),d=(est&&est.usageDetails)||{};
  if(cur!=='penyimpanan')return;
  const pct=est&&est.quota?Math.max(1,Math.min(100,est.usage/est.quota*100)):0;

  if(!CH.db)return '<div class="card"><h3>🗄️ Database belum aktif</h3><p class="d">Chat butuh database Upstash Redis. Ikuti langkah di README.</p></div>';
  const u=rd('zt_chat_u',''),own=isOwner();
  return CH.items.length?CH.items.map(m=>{const me=u&&m.u===u;return `<div class="cm ${me?'me':''}"><div class="cb"><div class="cn">${m.o?'👑 ':''}${esc(m.name)}${m.v&&!m.o?'<i>✔</i>':''}<span>${hhmm(m.ts)}</span></div><div class="ct">${esc(m.text)}</div>${own?`<button class="cx" aria-label="Hapus pesan" data-a="cdel:${esc(m.id)}">🗑</button>`:''}</div></div>`}).join(''):'<div class="empty"><i>💬</i>Belum ada pesan. Jadi yang pertama menyapa!</div>';
}
function chatPaint(bottom){
  const el=$('#cl');if(!el)return;
  const near=bottom||innerHeight+scrollY>=document.documentElement.scrollHeight-160;
  el.innerHTML=chatHtml();
  if(near)requestAnimationFrame(()=>scrollTo({top:document.documentElement.scrollHeight}));
}
async function chatPull(first){
  try{
    const j=await api('/api/chat');if(cur!=='chat')return;
    CH.db=j.db!==false;const it=j.items||[],sig=it.length+':'+(it.length?it[it.length-1].id:'');
    if(sig!==CH.sig){CH.sig=sig;CH.items=it;CH.idle=0;chatPaint(first)}else CH.idle++;
  }catch{CH.idle++}
}
function chatLoop(){
  clearTimeout(CH.t);if(cur!=='chat'||!ACTIVE)return;
  CH.t=setTimeout(async()=>{if(!document.hidden&&ACTIVE)await chatPull();chatLoop()},4000+Math.min(CH.idle,10)*1000);
}
function rChat(){
  pg.innerHTML=`<div class="chat" id="cl"></div><div class="cform glass"><input id="ci" maxlength="300" placeholder="Tulis pesan…" autocomplete="off" enterkeyhint="send"><button class="btn p" data-a="csend">Kirim</button></div><p class="d" style="text-align:center;margin-top:10px">Chat terlihat oleh semua pengguna. Jaga sopan santun.${ZT.acct()?'':' <a class="lk" data-a="cnick">Ganti nama</a>'}</p>`;
  $('#ci').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();A.csend()}});
  CH.idle=0;chatPaint(true);chatPull(true);chatLoop();
}
A.csend=async b=>{
  const inp=$('#ci'),text=inp.value.trim();if(!text)return;
  const a=ZT.acct();let name=a?a.name:rd('zt_nick','');
  if(!name){const n=await ask({title:'Pilih nama panggilan',msg:'Nama ini tampil di chat global.',input:'Nama (maks 20 huruf)',ok:'Simpan'});if(!n)return;name=n.slice(0,20);wr('zt_nick',name)}
  if(b&&b.disabled!==undefined)b.disabled=true;
  try{
    const j=await api('/api/chat',{method:'POST',body:{text,name:name.slice(0,20),dev:ZT.dev()}});
    wr('zt_chat_u',j.u);inp.value='';CH.items=CH.items.concat(j.item).slice(-60);CH.sig=CH.items.length+':'+j.item.id;CH.idle=0;chatPaint(true);chatLoop();
  }catch(e){ZT.toast(e.status===503?'Chat butuh database di server (lihat README)':e.message)}
  if(b&&b.disabled!==undefined)b.disabled=false;inp.focus();
};
A.cnick=async()=>{const n=await ask({title:'Ganti nama',msg:'Nama ini tampil di chat global.',input:'Nama (maks 20 huruf)',ok:'Simpan'});if(n){wr('zt_nick',n.slice(0,20));ZT.toast('Nama diganti')}};
A.cdel=async id=>{if(!await ask({title:'Hapus pesan ini?',msg:'Pesan hilang untuk semua orang.',ok:'Hapus',danger:true}))return;try{await api('/api/chat',{method:'POST',body:{action:'delete',id}});CH.sig='';chatPull()}catch(e){ZT.toast(e.message)}};
/* ---- sinkron dengan sisa aplikasi ---- */
addEventListener('message',e=>{
  if(e.origin!==O||!e.data)return;
  if(e.data.sec)nav(e.data.sec);
  if('active' in e.data){ACTIVE=!!e.data.active;if(!ACTIVE)clearTimeout(CH.t);else if(cur==='chat'){chatPull();chatLoop()}}
});
addEventListener('storage',e=>{
  if(e.key==='zt_acct'||e.key==='zt_role'){if(['home','akun','pengumuman','request'].includes(cur))nav(cur)}
  else if(e.key==='zt_log'&&cur==='log')rLog();
  else if(e.key==='zt_prefs'&&cur==='tampilan')rLook(true);
});
ZT.onacct=()=>nav(cur);
nav(location.hash.slice(1)||'home');
</script>
</body>
